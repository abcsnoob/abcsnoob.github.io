<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abcsnoob SFU - LiveKit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://unpkg.com/nprogress@0.2.0/nprogress.css">
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@4/dark.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-white">

    <div id="login-screen" class="vh-100 d-flex align-items-center justify-content-center">
        <div class="card bg-black text-white p-4 border-secondary shadow-lg" style="width: 380px;">
            <div class="text-center mb-4">
                <i class="bi bi-broadcast fs-1 text-primary"></i>
                <h3 class="mt-2 fw-bold">ABC'S NOOB</h3>
                <p class="text-secondary small">:)</p>
            </div>
            <div class="mb-3">
                <label class="form-label small">Username</label>
                <input type="text" id="username-input" class="form-control bg-dark text-white border-secondary" placeholder="Tên đăng nhập...">
            </div>
            <div class="mb-3">
                <label class="form-label small">Password</label>
                <input type="password" id="password-input" class="form-control bg-dark text-white border-secondary" placeholder="Mật khẩu...">
            </div>
            <button id="auth-btn" class="btn btn-primary w-100 fw-bold mb-2">ĐĂNG NHẬP</button>
            <button id="reg-btn" class="btn btn-outline-secondary w-100 btn-sm">Tạo tài khoản mới</button>
        </div>
    </div>

    <div id="main-app" class="vh-100 d-none d-flex flex-column">
        <div class="p-2 border-bottom border-secondary d-flex justify-content-between align-items-center bg-black">
            <div class="d-flex align-items-center">
        <button id="toggle-chat" class="btn btn-outline-secondary btn-sm me-3 border-0">
            <i class="bi bi-layout-sidebar-reverse fs-5"></i>
        </button>
        <span class="fw-bold text-primary"><i class="bi bi-shield-check"></i> Abc's Noob</span>
    </div>
            <span class="fw-bold text-primary"><i class="bi"></i></span>
            <span class="badge rounded-pill bg-dark border border-secondary">
                <i class="bi bi-reception-4 text-success" id="ping-icon"></i> 
                <span id="ping-value">N/A</span> ms
            </span>
        </div>

        <div class="d-flex flex-grow-1 overflow-hidden">
            <div id="video-grid" class="flex-grow-1 p-3 row g-2 align-content-start overflow-auto"></div>

            <div id="chat-sidebar" class="bg-black border-start border-secondary d-flex flex-column" style="width: 300px;">
                <div class="p-2 border-bottom border-secondary fw-bold small"><i class="bi bi-chat-left-text me-2"></i> PHÒNG CHAT</div>
                <div id="chat-messages" class="flex-grow-1 p-3 overflow-auto small"></div>
                <div class="p-2 border-top border-secondary">
                    <div class="input-group">
                        <input type="text" id="chat-input" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="Nhắn tin...">
                        <button id="send-btn" class="btn btn-primary btn-sm"><i class="bi bi-send"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <div class="p-3 bg-black border-top border-secondary d-flex justify-content-center gap-3">
            <button id="call-btn" class="btn btn-success px-4">
    <i class="bi bi-telephone-fill"></i> Tham gia
</button>
            <button id="mic-btn" class="btn btn-secondary rounded-circle"><i class="bi bi-mic-fill"></i></button>
            <button id="cam-btn" class="btn btn-secondary rounded-circle"><i class="bi bi-camera-video-fill"></i></button>
            <button id="share-btn" class="btn btn-outline-success"><i class="bi bi-display"></i> Share</button>
            <button id="leave-btn" class="btn btn-danger px-4">Rời phòng</button>
        </div>
    </div>

    <script src="https://unpkg.com/nprogress@0.2.0/nprogress.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client@1.15.4/dist/livekit-client.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
