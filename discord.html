<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Widget Fullscreen</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #2c2f33;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        #discord-widget {
            width: 100%;
            height: 100%;
            border: none;
        }
        .message {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <iframe id="discord-widget" sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"></iframe>

    <script>
        // Lấy ID từ query string
        const params = new URLSearchParams(window.location.search);
        const serverId = params.get('id');

        const iframe = document.getElementById('discord-widget');

        if(serverId) {
            // Theme dark, full chat và online list
            iframe.src = `https://discord.com/widget?id=${serverId}&theme=dark`;
        } else {
            // Hiển thị thông báo nếu chưa có ID
            document.body.innerHTML = '<div class="message">Vui lòng cung cấp ID server Discord trong query string, ví dụ: ?id=YOUR_SERVER_ID</div>';
        }
    </script>
</body>
</html>
