<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Widget Fullscreen</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #2c2f33;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: #fff;
            overflow: hidden;
        }
        #discord-widget {
            width: 100%;
            height: 100%;
            border: none;
            display: none; /* ẩn iframe lúc đầu để hiện spinner */
        }
        .spinner {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #7289da;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            animation: spin 1s linear infinite;
            position: absolute;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .message {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="spinner" id="spinner"></div>
    <iframe id="discord-widget" sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"></iframe>

    <script>
        const params = new URLSearchParams(window.location.search);
        const serverId = params.get('id');

        const iframe = document.getElementById('discord-widget');
        const spinner = document.getElementById('spinner');

        if(serverId) {
            iframe.src = `https://discord.com/widget?id=${serverId}&theme=dark`;
            
            // Khi iframe load xong
            iframe.onload = function() {
                spinner.style.display = 'none';
                iframe.style.display = 'block';
            }
        } else {
            spinner.style.display = 'none';
            document.body.innerHTML = '<div class="message">Vui lòng cung cấp ID server Discord trong query string, ví dụ: ?id=YOUR_SERVER_ID</div>';
        }
    </script>
</body>
</html>
