<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Minecraft 3D Skin Viewer - Animated Select</title>
    </head>
    <body>
        <div id="custom-spinner" class="material-spinner">
            <svg viewBox="0 0 50 50">
                <circle class="path" cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
            </svg>
        </div>
        <div class="controls">
            <div class="control-group">
                <a href="javascript:history.back()" class="back-btn"
                    ><svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Quay lại</a
                >
            </div>
            <div class="control-group">
                <label>Skin:</label>
                <div class="custom-select" id="skin-select-custom">
                    <div class="select-trigger"><span class="current-val">Normal</span></div>
                    <div class="options-menu" id="skin-options"></div>
                </div>
            </div>
            <div class="control-group">
                <label>Động tác:</label>
                <div class="custom-select" id="anim-select-custom">
                    <div class="select-trigger"><span class="current-val">Đứng yên</span></div>
                    <div class="options-menu">
                        <div class="option" data-value="idle">Đứng yên</div>
                        <div class="option" data-value="walk">Đi bộ</div>
                        <div class="option" data-value="run">Chạy</div>
                        <div class="option" data-value="fly">Bay</div>
                        <div class="option" data-value="idle">Mình sẽ thêm động tác mới sau :)</div>
                    </div>
                </div>
            </div>
        </div>
        <div id="viewer-container"></div>
        <div class="info">Chuột trái: Xoay | Cuộn: Zoom</div>
                <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/nprogress/0.2.0/nprogress.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/nprogress/0.2.0/nprogress.min.css"></noscript>
          <link rel="stylesheet" href="/assets/css/skin.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
        <noscript><link rel="stylesheet" href="/assets/css/skin.css"></noscript>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/nprogress/0.2.0/nprogress.min.js"></script>
        <script>
            NProgress.configure({
                easing: "cubic-bezier(0.4, 0.0, 0.2, 1)",
                speed: 500,
                showSpinner: !1,
                trickleSpeed: 700,
            }),
                NProgress.start();
        </script>
        <script src="https://cdn.jsdelivr.net/npm/stats.js@0.17.0/build/stats.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/skinview3d@3.4.2/bundles/skinview3d.bundle.min.js"></script>
        <script src="moreanimation.js"></script>
        <script>
            const CONTROLS_HEIGHT = 80,
                spinner = document.getElementById("custom-spinner");
            let loadingCount = 0;
            function startLoading() {
                loadingCount++, NProgress.start(), spinner.classList.remove("hidden");
            }
            function stopLoading() {
                (loadingCount = Math.max(0, loadingCount - 1)),
                    0 === loadingCount && (NProgress.done(), spinner.classList.add("hidden"));
            }
            const skins = {
                    Normal: "img/og.png",
                    "No Head Outer Layer": "img/no_cap.png",
                    "No Jacket": "img/no_jacket.png",
                    "No Pants Outer Layer": "img/no_out_pants.png",
                    "No Outer Layer": "img/no_2_layer.png",
                    "just inner layer pants": "img/raw.png",
                },
                skinOptionsContainer = document.getElementById("skin-options");
            Object.entries(skins).forEach(([e, n]) => {
                const t = document.createElement("div");
                (t.className = "option"),
                    (t.dataset.value = n),
                    (t.textContent = e),
                    skinOptionsContainer.appendChild(t);
            });
            const container = document.getElementById("viewer-container"),
                skinViewer = new skinview3d.SkinViewer({
                    canvas: document.createElement("canvas"),
                    width: window.innerWidth,
                    height: window.innerHeight - 80,
                    skin: skins.Normal,
                    slim: !1,
                });
            function initCustomSelect(e, n) {
                const t = document.getElementById(e),
                    i = t.querySelector(".select-trigger"),
                    s = t.querySelector(".current-val");
                i.addEventListener("click", (e) => {
                    e.stopPropagation();
                    const n = t.classList.contains("active");
                    closeAllSelects(), n || t.classList.add("active");
                }),
                    t.querySelector(".options-menu").addEventListener("click", (e) => {
                        const i = e.target.closest(".option");
                        i && ((s.textContent = i.textContent), t.classList.remove("active"), n(i.dataset.value));
                    });
            }
            function closeAllSelects() {
                document.querySelectorAll(".custom-select").forEach((e) => e.classList.remove("active"));
            }
            container.appendChild(skinViewer.canvas),
                (skinViewer.autoRotate = !0),
                (skinViewer.autoRotateSpeed = 0),
                (skinViewer.animation = new skinview3d.IdleAnimation()),
                startLoading(),
                skinViewer.loadSkin(skins.Normal).then(stopLoading),
                window.addEventListener("resize", () => {
                    (skinViewer.width = window.innerWidth), (skinViewer.height = window.innerHeight - 80);
                }),
                document.addEventListener("click", closeAllSelects),
                initCustomSelect("skin-select-custom", (e) => {
                    startLoading(), skinViewer.loadSkin(e).then(stopLoading);
                });
            const ANIMATIONS = {
                walk: () => new skinview3d.WalkingAnimation(),
                run: () => new skinview3d.RunningAnimation(),
                fly: () => new skinview3d.FlyingAnimation(),
                idle: () => new skinview3d.IdleAnimation(),
            };
            initCustomSelect("anim-select-custom", (e) => {
                startLoading(),
                    (skinViewer.animation = ANIMATIONS[e]?.() ?? ANIMATIONS.idle()),
                    setTimeout(stopLoading, 300);
            });
                            const statsPanels = [new Stats(), new Stats(), new Stats()],
                statsContainer = document.createElement("div");
            (statsContainer.style.cssText =
                "position:absolute;top:0;left:0;display:grid;grid-template-columns:1fr;gap:0"),
                statsPanels.forEach((e, n) => {
                    e.showPanel(n), (e.dom.style.position = "static"), statsContainer.appendChild(e.dom);
                }),
                container.appendChild(statsContainer);
            const originalRender = skinViewer.render.bind(skinViewer);
            skinViewer.render = () => {
                statsPanels.forEach((e) => e.begin()), originalRender(), statsPanels.forEach((e) => e.end());
            };
        </script>
    </body>
</html>
