    <div id="admin-area" class="card border-0 shadow-sm bg-light mb-5 rounded-4" style="display: none;">

            <h5 class="fw-bold mb-3">Tạo bài viết mới</h5>
            <input type="text" id="post-title" class="form-control mb-3 border-0 shadow-sm" placeholder="Tiêu đề...">
            <textarea id="post-content" class="form-control mb-3 border-0 shadow-sm" rows="5" placeholder="Nội dung (Enter để xuống dòng)..."></textarea>
            <button onclick="handleCreatePost()" class="btn btn-dark w-100 fw-bold rounded-pill">Đăng bài</button>
        </div>
    </div>

    <div id="blog-container" class="d-flex flex-column gap-4 mb-5">
        <div class="text-center text-muted">Đang tải dữ liệu từ server...</div>
    </div>
</div>

<script>
    async function handleCreatePost() {
        const t = document.getElementById('post-title');
        const c = document.getElementById('post-content');
        if(!t.value || !c.value) return alert("Nhập đủ tin đi ông cháu!");
        await window.createPost(t.value, c.value);
        t.value = ''; c.value = '';
    }
</script>
