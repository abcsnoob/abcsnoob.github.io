<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm tra liên kết | Abc's Noob</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    
    <style>
        :root { --accent-color: #0d6efd; }
        body { transition: background-color 0.5s ease, color 0.5s ease; min-height: 100vh; }
        .redirect-card { 
            max-width: 550px; 
            margin: 60px auto; 
            border-radius: 24px; 
            border: none; 
            background: #fff; 
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .platform-display { font-size: 2.5rem; font-weight: 800; color: var(--accent-color); line-height: 1.2; }
        .domain-sub { font-size: 1rem; color: #6c757d; font-family: 'Courier New', Courier, monospace; word-break: break-all; }

        /* Hiệu ứng nhấp nháy cho icon cảnh báo */
        @keyframes pulse-red {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pulse { animation: pulse-red 1.5s infinite; }

        /* Chế độ Lockdown Mode (Nguy hiểm) */
        body.is-dangerous { background-color: #4a0404 !important; }
        .is-dangerous .redirect-card { 
            background-color: #fff; 
            border: 5px solid #dc3545; 
            box-shadow: 0 0 30px rgba(220, 53, 69, 0.5) !important; 
        }
        .is-dangerous .platform-display { color: #dc3545; }
        .is-dangerous .btn-primary { display: none; } /* Chặn nút đi tiếp */

        /* Loader mặc định */
        .loader-ring {
            display: inline-block; width: 60px; height: 60px;
            border: 5px solid rgba(0,0,0,0.05);
            border-radius: 50%; border-top-color: var(--accent-color);
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .logo { width: 30px; margin-right: 10px; border-radius: 50%; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container justify-content-center">
            <a class="navbar-brand fw-bold" href="./">
                <img src="./assets/image/abcsnoob.webp" class="logo" alt="Logo">Abc's Noob
            </a>
        </div>
    </nav>

    <div class="container text-center">
        <div class="card redirect-card shadow-lg p-4 p-md-5">
            <div id="status-icon" class="mb-4">
                <div class="loader-ring"></div>
            </div>
            
            <h2 id="msg-header" class="fw-bold text-dark">Đang kiểm tra bảo mật...</h2>
            
            <div id="platform" class="platform-display my-3">...</div>
            <div id="domain-sub" class="domain-sub mb-4"></div>

            <div id="warning-box" class="alert alert-info py-3 shadow-sm">
                <i class="fa-solid fa-spinner fa-spin me-2"></i>Đang đối soát danh sách đen...
            </div>

            <p id="timer-text" class="mt-3">
                Tự động chuyển tiếp sau <span id="countdown" class="fw-bold text-danger">5</span> giây...
            </p>
            
            <div class="d-grid gap-3 mt-4">
                <a id="direct-link" href="#" class="btn btn-primary btn-lg shadow fw-bold">Tiếp tục truy cập</a>
                <a href="javascript:history.back()" class="btn btn-outline-secondary btn-lg">Quay lại an toàn</a>
            </div>

            <p class="small text-muted mt-4">
                Phát hiện trang web lừa đảo? <a href="./contact" class="text-decoration-none">Báo cáo ngay</a>
            </p>
        </div>
    </div>

    <script>
        // Link API GitHub của bạn
        const API_URL = "https://raw.githubusercontent.com/abcsnoob/apis-json/refs/heads/main/domain_mapping.json";

        async function startSecurityScan() {
            const params = new URLSearchParams(window.location.search);
            let target = params.get('to');
            const platformEl = document.getElementById('platform');
            const domainSubEl = document.getElementById('domain-sub');
            const countdownEl = document.getElementById('countdown');
            const directLink = document.getElementById('direct-link');
            const warningBox = document.getElementById('warning-box');
            const msgHeader = document.getElementById('msg-header');
            const statusIcon = document.getElementById('status-icon');

            if (!target) {
                msgHeader.innerText = "Lỗi liên kết";
                platformEl.innerText = "Tham số trống";
                statusIcon.innerHTML = '<i class="fa-solid fa-circle-exclamation fa-4x text-warning"></i>';
                return;
            }

            // Chuẩn hóa đường dẫn
            if (!target.startsWith('http')) target = 'https://' + target;
            directLink.href = target;

            try {
                const urlObj = new URL(target);
                const currentDomain = urlObj.hostname.replace(/^www\./, '').toLowerCase();
                domainSubEl.innerText = currentDomain;

                // Tải dữ liệu JSON
                const res = await fetch(API_URL);
                const mapping = await res.json();

                let foundData = null;
                let isDangerous = false;

                // Quét Mapping (bao gồm Key chính và mảng AKA)
                for (const [key, data] of Object.entries(mapping)) {
                    const akaList = data.aka ? data.aka.map(d => d.toLowerCase()) : [];
                    if (currentDomain === key.toLowerCase() || akaList.includes(currentDomain)) {
                        foundData = data;
                        if (key === "dangerous_sites") isDangerous = true;
                        break;
                    }
                }

                if (isDangerous) {
                    // KÍCH HOẠT LOCKDOWN MODE
                    document.body.classList.add('is-dangerous');
                    statusIcon.innerHTML = '<i class="fa-solid fa-triangle-exclamation fa-5x text-danger animate-pulse"></i>';
                    msgHeader.innerText = "CẢNH BÁO NGUY HIỂM!";
                    msgHeader.classList.add('text-danger');
                    
                    platformEl.innerText = foundData.name;
                    
                    warningBox.className = "alert alert-danger shadow-sm py-4";
                    warningBox.innerHTML = `
                        <h5 class="fw-bold"><i class="fa-solid fa-skull-crossbones me-2"></i> PHÁT HIỆN RỦI RO CAO</h5>
                        <p class="mb-0">Trang web này đã bị hệ thống đánh dấu là <b>${foundData.type}</b>. 
                        Dữ liệu của bạn có thể bị đánh cắp nếu tiếp tục truy cập.</p>
                    `;

                    document.getElementById('timer-text').innerHTML = "<b class='text-warning'>Vì sự an toàn, quá trình tự động chuyển hướng đã bị chặn.</b>";
                    directLink.classList.add('disabled');
                    directLink.innerHTML = '<i class="fa-solid fa-ban me-2"></i>Đã chặn truy cập';
                } else {
                    // CHẾ ĐỘ AN TOÀN
                    statusIcon.innerHTML = '<i class="fa-solid fa-circle-check fa-4x text-success"></i>';
                    msgHeader.innerText = "Bạn sắp ra ngoài rồi đấy!";
                    platformEl.innerText = foundData ? foundData.name : currentDomain;
                    
                    warningBox.className = "alert alert-success py-3 shadow-sm";
                    warningBox.innerHTML = `<i class="fa-solid fa-shield-check me-2"></i>Liên kết này được xác định là an toàn.`;
                    
                    // Bắt đầu đếm ngược chuyển hướng
                    let seconds = 5;
                    const timer = setInterval(() => {
                        seconds--;
                        countdownEl.innerText = seconds;
                        if (seconds <= 0) {
                            clearInterval(timer);
                            window.location.href = target;
                        }
                    }, 1000);
                }

            } catch (e) {
                console.error("Fetch Error:", e);
                platformEl.innerText = "Liên kết ngoài";
                warningBox.innerHTML = "Không thể kết nối API bảo mật. Vui lòng cẩn trọng.";
            }
        }

        window.onload = startSecurityScan;
    </script>
</body>
</html>
