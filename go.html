<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang chuyển hướng... | Abc's Noob</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous"/>
    <link href="./assets/css/style.css" rel="stylesheet" />
    <link rel="icon" href="assets/image/favicon.ico" type="image/x-icon"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    
    <style>
        .redirect-card { max-width: 500px; margin: 80px auto; border-radius: 20px; border: none; }
        .platform-display { font-size: 2rem; font-weight: 800; color: #0d6efd; }
        .loader-ring {
            display: inline-block; width: 50px; height: 50px;
            border: 5px solid rgba(13, 110, 253, 0.2);
            border-radius: 50%; border-top-color: #0d6efd;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a id="notranslate" class="navbar-brand" href="./"><img class="logo" src="./assets/image/abcsnoob.webp" style="width:30px; margin-right:10px;">Abc's Noob</a>
        </div>
    </nav>

    <div class="container text-center">
        <div class="card redirect-card shadow-lg p-5">
            <div class="mb-4"><div class="loader-ring"></div></div>
            <h2 class="fw-bold text-dark">Bạn sắp ra ngoài rồi đấy!</h2>
            <p class="text-muted">Đang chuyển tới:</p>
            <div id="platform" class="platform-display mb-4">...</div>
            <p class="mt-3">Tự động chuyển tiếp sau <span id="countdown" class="fw-bold text-danger">5</span> giây...</p>
            <div class="d-grid gap-2 mt-4">
                <a id="direct-link" href="#" class="btn btn-primary btn-lg">Chuyển hướng ngay</a>
                <a href="javascript:history.back()" class="btn btn-outline-secondary">Quay lại</a>
            </div>
        </div>
    </div>

    <script>
        const API_MAPPING = "https://raw.githubusercontent.com/abcsnoob/apis-json/refs/heads/main/domain_mapping.json";

        async function handleRedirect() {
            const urlParams = new URLSearchParams(window.location.search);
            let targetUrl = urlParams.get('to');
            const platformEl = document.getElementById('platform');
            const countdownEl = document.getElementById('countdown');
            const directLink = document.getElementById('direct-link');

            if (!targetUrl) {
                platformEl.innerText = "Lỗi đường dẫn";
                return;
            }

            if (!targetUrl.startsWith('http')) targetUrl = 'https://' + targetUrl;
            directLink.href = targetUrl;

            try {
                const domain = new URL(targetUrl).hostname.replace('www.', '');
                const response = await fetch(API_MAPPING);
                const mapping = await response.json();

                let finalName = domain; // Mặc định hiển thị domain nếu không khớp
                
                // LOGIC MỚI: Tìm kiếm trong cấu trúc lồng nhau
                for (const [mainDomain, info] of Object.entries(mapping)) {
                    // Kiểm tra nếu là domain gốc HOẶC nằm trong danh sách aka
                    if (domain === mainDomain || (info.aka && info.aka.includes(domain))) {
                        finalName = info.name;
                        break;
                    }
                }

                platformEl.innerText = finalName;

                let seconds = 5;
                const timer = setInterval(() => {
                    seconds--;
                    countdownEl.innerText = seconds;
                    if (seconds <= 0) {
                        clearInterval(timer);
                        window.location.href = targetUrl;
                    }
                }, 1000);

            } catch (error) {
                platformEl.innerText = new URL(targetUrl).hostname;
            }
        }

        window.onload = handleRedirect;
    </script>
</body>
</html>
