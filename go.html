<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Safe Redirect</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
    body {
        font-family: system-ui, sans-serif;
        background: #0f172a;
        color: #e5e7eb;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
    }
    .box {
        background: #020617;
        border-radius: 12px;
        padding: 24px;
        max-width: 480px;
        width: 100%;
        box-shadow: 0 20px 40px rgba(0,0,0,.4);
    }
    h1 { margin-top: 0; }
    .danger { color: #ef4444; }
    .safe { color: #22c55e; }
    .countdown {
        font-size: 22px;
        font-weight: bold;
        margin-top: 12px;
    }
    button {
        margin-top: 16px;
        padding: 10px 16px;
        border-radius: 8px;
        border: none;
        background: #2563eb;
        color: white;
        cursor: pointer;
    }
</style>
</head>

<body>
<div class="box">
    <h1 id="title">Checking…</h1>
    <p id="desc"></p>
    <div id="extra"></div>
</div>

<script>
const API_MAPPING = "https://raw.githubusercontent.com/abcsnoob/apis-json/refs/heads/main/domain_mapping.json";

/* =========================
   DOMAIN UTILITIES
========================= */
function normalizeDomain(host) {
    return host
        .toLowerCase()
        .replace(/^www\./, "")
        .replace(/:\d+$/, "");
}

function domainMatch(current, target) {
    return current === target || current.endsWith("." + target);
}

/* =========================
   MAIN
========================= */
async function init() {
    const params = new URLSearchParams(window.location.search);
    let target = params.get("to");
    if (!target) return;

    if (!target.startsWith("http")) {
        target = "https://" + target;
    }

    const urlObj = new URL(target);
    const currentDomain = normalizeDomain(urlObj.hostname);

    const el = {
        platform: document.getElementById("platform"),
        domainSub: document.getElementById("domain-sub"),
        countdown: document.getElementById("countdown"),
        progressBar: document.getElementById("progress-bar"),
        directLink: document.getElementById("direct-link"),
        warningBox: document.getElementById("warning-box"),
        msgHeader: document.getElementById("msg-header"),
        timerArea: document.getElementById("timer-area"),
        screenshot: document.getElementById("screenshot"),
        loading: document.getElementById("loading-preview")
    };

    el.domainSub.innerText = currentDomain;

    try {
        const res = await fetch(API_MAPPING, { cache: "no-store" });
        const mapping = await res.json();

        let foundData = null;
        let foundKey = null;
        let finalTarget = urlObj.href;

        /* =========================
           1. DANGEROUS CHECK
        ========================= */
        if (mapping.dangerous_sites?.aka) {
            for (const bad of mapping.dangerous_sites.aka) {
                const badDomain = normalizeDomain(bad);
                if (domainMatch(currentDomain, badDomain)) {
                    foundKey = "dangerous_sites";
                    foundData = mapping.dangerous_sites;
                    break;
                }
            }
        }

        if (foundKey === "dangerous_sites") {
            loadPreview(el, finalTarget);
            applyLockdown(el, foundData);
            return;
        }

        /* =========================
           2. EXACT DOMAIN + SUBDOMAIN
        ========================= */
        for (const [key, data] of Object.entries(mapping)) {
            if (key === "dangerous_sites") continue;

            const base = normalizeDomain(key);

            if (domainMatch(currentDomain, base)) {
                foundKey = key;
                foundData = data;
                break;
            }

            /* =========================
               3. AKA CHECK (STRICT)
            ========================= */
            if (data.aka) {
                for (const aka of data.aka) {
                    const akaDomain = normalizeDomain(aka);
                    if (domainMatch(currentDomain, akaDomain)) {
                        foundKey = key;
                        foundData = data;
                        finalTarget = data.url || ("https://" + base);
                        break;
                    }
                }
            }

            if (foundData) break;
        }

        loadPreview(el, finalTarget);

        /* =========================
           4. RESULT UI
        ========================= */
        if (foundData) {
            applySafe(el, foundData.name || foundKey, finalTarget);
        } else {
            applySafe(el, currentDomain, finalTarget);
        }

    } catch (err) {
        loadPreview(el, target);
        applySafe(el, currentDomain, target);
    }
}

/* =========================
   PREVIEW
========================= */
function loadPreview(el, url) {
    el.screenshot.src =
        "https://api.microlink.io/?url=" +
        encodeURIComponent(url) +
        "&screenshot=true&embed=screenshot.url";

    el.screenshot.onload = () => {
        el.loading.style.display = "none";
        el.screenshot.style.display = "block";
    };
}

/* =========================
   UI STATES
========================= */
function applyLockdown(el, data) {
    document.body.classList.add("is-dangerous");
    el.msgHeader.innerText = "KẾT QUẢ: CỰC KỲ NGUY HIỂM";
    el.platform.innerText = "ĐÃ CHẶN TRUY CẬP";
    el.warningBox.className = "alert alert-danger fw-bold animate-pulse";
    el.warningBox.innerHTML =
        `<i class="fa-solid fa-triangle-exclamation me-2"></i>` +
        `Trang này (${data.type}) nằm trong danh sách đen.`;
    el.directLink.classList.add("d-none");
}

function applySafe(el, name, url) {
    el.msgHeader.innerText = "KẾT QUẢ: AN TOÀN";
    el.platform.innerText = name;
    el.warningBox.className = "alert alert-success py-2";
    el.warningBox.innerHTML =
        `<i class="fa-solid fa-shield-check me-2"></i>` +
        `Không phát hiện dấu hiệu độc hại.`;
    activateRedirect(el, url);
}

/* =========================
   REDIRECT TIMER
========================= */
function activateRedirect(el, url) {
    el.directLink.href = url;
    el.timerArea.style.display = "block";

    let timeLeft = 5;
    el.countdown.innerText = timeLeft;

    const timer = setInterval(() => {
        timeLeft--;
        el.countdown.innerText = timeLeft;
        el.progressBar.style.width = ((5 - timeLeft) / 5) * 100 + "%";
        el.directLink.innerText = `Vui lòng chờ (${timeLeft}s)`;

        if (timeLeft <= 0) {
            clearInterval(timer);
            el.directLink.classList.remove("disabled", "btn-primary");
            el.directLink.classList.add("btn-success");
            el.directLink.innerText = "Truy cập ngay";
            window.location.href = url;
        }
    }, 1000);
}

window.onload = init;
</script>

</body>
</html>
