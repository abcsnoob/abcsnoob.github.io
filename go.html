<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quét & Sửa lỗi Liên kết | Abc's Noob</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        :root { --danger: #ff4d4d; --primary: #0d6efd; --success: #28a745; }
        body { transition: background-color 0.4s ease; min-height: 100vh; display: flex; flex-direction: column; font-family: 'Segoe UI', sans-serif; }
        .redirect-card { 
            max-width: 580px; margin: auto; border-radius: 28px; border: none; 
            background: #fff; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }
        .preview-box { width: 100%; height: 260px; background: #f8f9fa; display: flex; align-items: center; justify-content: center; position: relative; }
        #screenshot { width: 100%; height: 100%; object-fit: cover; display: none; }
        
        /* Chế độ Lockdown (Dành cho nhà cái) */
        body.is-dangerous { background-color: #2b0000 !important; }
        .is-dangerous .redirect-card { border: 5px solid var(--danger); outline: 100vh solid rgba(0,0,0,0.4); }
        .is-dangerous .preview-box { filter: grayscale(1) sepia(1) hue-rotate(-50deg); }
        .is-dangerous #timer-area, .is-dangerous #direct-link { display: none !important; }

        .loader { width: 45px; height: 45px; border: 5px solid #eee; border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #timer-area { display: none; }
        .animate-pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow">
        <div class="container justify-content-center">
            <a class="navbar-brand fw-bold" href="./">
                <img src="./assets/image/abcsnoob.webp" style="width:30px; border-radius:50%; margin-right:10px;">Abc's Noob
            </a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="card redirect-card">
            <div class="preview-box">
                <div id="loading-preview" class="text-center">
                    <div class="loader mx-auto mb-2"></div>
                    <small class="text-muted fw-bold">ĐANG QUÉT MÃ ĐỘC & PHÂN TÍCH...</small>
                </div>
                <img id="screenshot" alt="Website Preview">
            </div>

            <div class="card-body p-4 p-md-5 text-center">
                <h3 id="msg-header" class="fw-bold text-secondary mb-2">Đang xử lý dữ liệu...</h3>
                <div id="platform" class="display-6 fw-bold text-primary mb-1">Kiểm tra kết nối</div>
                <div id="domain-sub" class="text-muted small mb-4 font-monospace">...</div>

                <div id="warning-box" class="alert alert-secondary py-3 mb-4">
                    <i class="fa-solid fa-database fa-beat me-2"></i>Đang đối soát danh sách đen từ GitHub...
                </div>

                <div id="timer-area" class="mb-4">
                    <p class="mb-1 text-success fw-bold">An toàn! Tự động chuyển hướng sau <span id="countdown">5</span>s</p>
                    <div class="progress" style="height: 10px; border-radius: 10px;">
                        <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width: 0%"></div>
                    </div>
                </div>
                
                <div class="d-grid gap-2">
                    <a id="direct-link" href="#" class="btn btn-primary btn-lg shadow fw-bold disabled">Đang xác minh...</a>
                    <a href="javascript:history.back()" class="btn btn-outline-secondary">Hủy bỏ & Quay lại</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_MAPPING = "https://raw.githubusercontent.com/abcsnoob/apis-json/refs/heads/main/domain_mapping.json";

        async function init() {
            const params = new URLSearchParams(window.location.search);
            let target = params.get('to');
            if (!target) return;
            if (!target.startsWith('http')) target = 'https://' + target;

            const el = {
                platform: document.getElementById('platform'),
                domainSub: document.getElementById('domain-sub'),
                countdown: document.getElementById('countdown'),
                progressBar: document.getElementById('progress-bar'),
                directLink: document.getElementById('direct-link'),
                warningBox: document.getElementById('warning-box'),
                msgHeader: document.getElementById('msg-header'),
                timerArea: document.getElementById('timer-area'),
                screenshot: document.getElementById('screenshot'),
                loading: document.getElementById('loading-preview')
            };

            const urlObj = new URL(target);
            const currentDomain = urlObj.hostname.replace(/^www\./, '').toLowerCase();
            el.domainSub.innerText = currentDomain;

            try {
                const res = await fetch(API_MAPPING);
                const mapping = await res.json();

                let finalTarget = target;
                let foundData = null;
                let isDangerous = false;
                let isAkaHeal = false;
                let parentDomain = "";

                // 1. KIỂM TRA NHÀ CÁI (DANGEROUS) TRƯỚC
                const dangerData = mapping["dangerous_sites"];
                if (dangerData && dangerData.aka.map(d => d.toLowerCase()).includes(currentDomain)) {
                    isDangerous = true;
                    foundData = dangerData;
                }

                // 2. KIỂM TRA AKA HEALER (NẾU KHÔNG DANGEROUS)
                if (!isDangerous) {
                    for (const [key, data] of Object.entries(mapping)) {
                        if (key === "dangerous_sites") continue;
                        const akaList = data.aka ? data.aka.map(d => d.toLowerCase()) : [];
                        
                        if (akaList.includes(currentDomain)) {
                            isAkaHeal = true;
                            parentDomain = key;
                            foundData = data;
                            finalTarget = "https://" + key;
                            break;
                        }
                        if (currentDomain === key.toLowerCase()) {
                            foundData = data;
                            break;
                        }
                    }
                }

                // 3. TẢI ẢNH PREVIEW THEO ĐỊA CHỈ CUỐI
                el.screenshot.src = `https://api.microlink.io/?url=${encodeURIComponent(finalTarget)}&screenshot=true&embed=screenshot.url`;
                el.screenshot.onload = () => { el.loading.style.display = 'none'; el.screenshot.style.display = 'block'; };

                // 4. HIỂN THỊ GIAO DIỆN KẾT QUẢ
                if (isDangerous) {
                    applyLockdown(el, foundData);
                } else if (isAkaHeal) {
                    applyHealer(el, foundData, parentDomain, finalTarget);
                } else {
                    applySafe(el, foundData ? foundData.name : currentDomain, finalTarget);
                }

            } catch (e) {
                window.location.href = target;
            }
        }

        function applyLockdown(el, data) {
            document.body.classList.add('is-dangerous');
            el.msgHeader.innerText = "KẾT QUẢ: CỰC KỲ NGUY HIỂM";
            el.platform.innerText = "ĐÃ CHẶN TRUY CẬP";
            el.warningBox.className = "alert alert-danger fw-bold animate-pulse";
            el.warningBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation me-2"></i>Trang này (${data.type}) đã bị liệt vào danh sách đen.`;
            el.loading.innerHTML = "<i class='fa-solid fa-skull-crossbones fa-4x text-danger'></i>";
        }

        function applyHealer(el, data, parent, url) {
            el.msgHeader.innerText = "SỬA LỖI LIÊN KẾT";
            el.platform.innerText = data.name;
            el.warningBox.className = "alert alert-info py-3";
            el.warningBox.innerHTML = `<i class="fa-solid fa-wrench me-2"></i>Link <b>${el.domainSub.innerText}</b> lỗi. Đang bẻ lái về <b>${parent}</b>...`;
            activateRedirect(el, url);
        }

        function applySafe(el, name, url) {
            el.msgHeader.innerText = "KẾT QUẢ: AN TOÀN";
            el.platform.innerText = name;
            el.warningBox.className = "alert alert-success py-2";
            el.warningBox.innerHTML = `<i class="fa-solid fa-shield-check me-2"></i>Không tìm thấy dấu hiệu độc hại.`;
            activateRedirect(el, url);
        }

        function activateRedirect(el, url) {
            el.directLink.href = url;
            el.directLink.classList.remove('disabled');
            el.directLink.innerText = "Truy cập ngay";
            el.timerArea.style.display = 'block';
            
            let time = 5;
            const t = setInterval(() => {
                time--;
                el.countdown.innerText = time;
                el.progressBar.style.width = ((5-time)/5*100) + "%";
                if (time <= 0) { clearInterval(t); window.location.href = url; }
            }, 1000);
        }

        window.onload = init;
    </script>
</body>
</html>
