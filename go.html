<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảo mật liên kết | Abc's Noob</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    
    <style>
        :root { --primary: #0d6efd; --danger: #dc3545; }
        body { transition: background-color 0.4s ease; min-height: 100vh; display: flex; flex-direction: column; }
        .redirect-card { 
            max-width: 580px; margin: auto; border-radius: 28px; border: none; 
            background: #fff; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }
        .preview-box {
            width: 100%; height: 280px; background: #f8f9fa;
            display: flex; align-items: center; justify-content: center; position: relative;
        }
        #screenshot { width: 100%; height: 100%; object-fit: cover; display: none; }
        
        /* Lockdown UI */
        body.is-dangerous { background-color: #2c0000 !important; }
        .is-dangerous .redirect-card { border: 4px solid var(--danger); box-shadow: 0 0 50px rgba(220, 53, 69, 0.4) !important; }
        .is-dangerous .preview-box { filter: sepia(1) hue-rotate(-50deg); }

        .loader { width: 45px; height: 45px; border: 5px solid #eee; border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .animate-pulse { animation: pulse 1.5s infinite; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container justify-content-center">
            <a class="navbar-brand fw-bold" href="./">
                <img src="./assets/image/abcsnoob.webp" style="width:30px; border-radius:50%; margin-right:10px;">Abc's Noob
            </a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="card redirect-card">
            <div class="preview-box" id="preview-container">
                <div id="loading-spinner">
                    <div class="loader mx-auto mb-2"></div>
                    <small class="text-muted">Đang quét giao diện...</small>
                </div>
                <img id="screenshot" alt="Website Preview">
            </div>

            <div class="card-body p-4 p-md-5 text-center">
                <h3 id="msg-header" class="fw-bold mb-2">Đang xác minh...</h3>
                <div id="platform" class="display-6 fw-bold text-primary mb-1">...</div>
                <div id="domain-sub" class="text-muted small mb-4 font-monospace"></div>

                <div id="warning-box" class="alert alert-light border py-3">
                    <i class="fa-solid fa-shield-halved me-2"></i>Chờ trong giây lát để hệ thống kiểm tra an toàn.
                </div>

                <div id="timer-area">
                    <p class="mb-0">Tự động chuyển tiếp sau <span id="countdown" class="fw-bold text-danger">5</span> giây</p>
                    <div class="progress mt-2" style="height: 6px;">
                        <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%"></div>
                    </div>
                </div>
                
                <div class="d-grid gap-2 mt-4">
                    <a id="direct-link" href="#" class="btn btn-primary btn-lg shadow fw-bold">Truy cập ngay</a>
                    <a href="javascript:history.back()" class="btn btn-link text-secondary">Quay lại an toàn</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_MAPPING = "https://raw.githubusercontent.com/abcsnoob/apis-json/refs/heads/main/domain_mapping.json";

        async function init() {
            const params = new URLSearchParams(window.location.search);
            let target = params.get('to');
            if (!target) return;
            if (!target.startsWith('http')) target = 'https://' + target;

            const elements = {
                platform: document.getElementById('platform'),
                domainSub: document.getElementById('domain-sub'),
                countdown: document.getElementById('countdown'),
                progressBar: document.getElementById('progress-bar'),
                directLink: document.getElementById('direct-link'),
                warningBox: document.getElementById('warning-box'),
                msgHeader: document.getElementById('msg-header'),
                screenshot: document.getElementById('screenshot'),
                loading: document.getElementById('loading-spinner')
            };

            elements.directLink.href = target;

            // Dùng Microlink để chụp ảnh (Nhanh và mượt hơn)
            elements.screenshot.src = `https://api.microlink.io/?url=${encodeURIComponent(target)}&screenshot=true&embed=screenshot.url`;
            elements.screenshot.onload = () => {
                elements.loading.style.display = 'none';
                elements.screenshot.style.display = 'block';
            };

            try {
                const urlObj = new URL(target);
                const currentDomain = urlObj.hostname.replace(/^www\./, '').toLowerCase();
                elements.domainSub.innerText = currentDomain;

                const res = await fetch(API_MAPPING);
                const mapping = await res.json();

                let foundData = null;
                let isDangerous = false;
                let isAka = false;

                for (const [key, data] of Object.entries(mapping)) {
                    const akaList = data.aka ? data.aka.map(d => d.toLowerCase()) : [];
                    
                    // Ưu tiên check AKA trước để chuyển hướng ngay (Bonus yêu cầu)
                    if (akaList.includes(currentDomain)) {
                        window.location.replace(target);
                        return; // Thoát hàm ngay lập tức
                    }

                    if (currentDomain === key.toLowerCase()) {
                        foundData = data;
                        if (key === "dangerous_sites") isDangerous = true;
                        break;
                    }
                }

                // Xử lý Giao diện
                if (isDangerous) {
                    document.body.classList.add('is-dangerous');
                    elements.msgHeader.innerText = "CẢNH BÁO NGUY HIỂM!";
                    elements.msgHeader.classList.add('text-danger');
                    elements.platform.innerText = "Trang web độc hại";
                    elements.platform.classList.replace('text-primary', 'text-danger');
                    elements.warningBox.className = "alert alert-danger shadow-sm animate-pulse";
                    elements.warningBox.innerHTML = `<b>Phát hiện:</b> ${foundData.type}. Hệ thống đã chặn truy cập tự động để bảo vệ bạn.`;
                    document.getElementById('timer-area').style.display = 'none';
                    elements.directLink.classList.add('disabled');
                } else {
                    elements.msgHeader.innerText = "Bạn đang rời khỏi website";
                    elements.platform.innerText = foundData ? foundData.name : currentDomain;
                    elements.warningBox.innerHTML = `<i class="fa-solid fa-check-circle text-success me-2"></i>Liên kết này an toàn để truy cập.`;
                    
                    let timeLeft = 5;
                    const interval = setInterval(() => {
                        timeLeft--;
                        elements.countdown.innerText = timeLeft;
                        elements.progressBar.style.width = ((5 - timeLeft) / 5 * 100) + "%";
                        if (timeLeft <= 0) {
                            clearInterval(interval);
                            window.location.href = target;
                        }
                    }, 1000);
                }
            } catch (e) {
                window.location.href = target;
            }
        }
        window.onload = init;
    </script>
</body>
</html>
