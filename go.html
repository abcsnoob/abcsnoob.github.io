<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quét Bảo mật | Abc's Noob</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        :root { --primary: #0d6efd; --danger: #dc3545; }
        body { transition: background-color 0.4s ease; min-height: 100vh; display: flex; flex-direction: column; font-family: sans-serif; }
        .redirect-card { 
            max-width: 580px; margin: auto; border-radius: 28px; border: none; 
            background: #fff; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }
        .preview-box {
            width: 100%; height: 280px; background: #f8f9fa;
            display: flex; align-items: center; justify-content: center; position: relative;
        }
        #screenshot { width: 100%; height: 100%; object-fit: cover; display: none; }
        
        /* Lockdown UI */
        body.is-dangerous { background-color: #2c0000 !important; }
        .is-dangerous .redirect-card { border: 4px solid var(--danger); box-shadow: 0 0 50px rgba(220, 53, 69, 0.4) !important; }
        .is-dangerous .preview-box { filter: sepia(1) opacity(0.7); }

        /* Spinner & Progress */
        .loader { width: 50px; height: 50px; border: 5px solid #eee; border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #timer-area { display: none; } /* Mặc định ẩn, chỉ hiện khi an toàn */
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container justify-content-center">
            <a class="navbar-brand fw-bold" href="./">
                <img src="./assets/image/abcsnoob.webp" style="width:30px; border-radius:50%; margin-right:10px;">Abc's Noob
            </a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="card redirect-card">
            <div class="preview-box" id="preview-container">
                <div id="loading-preview">
                    <div class="loader mx-auto mb-2"></div>
                    <small class="text-muted fw-bold">ĐANG QUÉT MÃ ĐỘC...</small>
                </div>
                <img id="screenshot" alt="Website Preview">
            </div>

            <div class="card-body p-4 p-md-5 text-center">
                <h3 id="msg-header" class="fw-bold mb-2 text-secondary">Đang phân tích dữ liệu...</h3>
                <div id="platform" class="display-6 fw-bold text-primary mb-1">Kiểm tra kết nối</div>
                <div id="domain-sub" class="text-muted small mb-4 font-monospace">...</div>

                <div id="warning-box" class="alert alert-warning py-3">
                    <i class="fa-solid fa-database fa-spin me-2"></i>Vui lòng chờ, hệ thống đang đối soát danh sách đen...
                </div>

                <div id="timer-area">
                    <p class="mb-0">Dữ liệu sạch! Chuyển hướng sau <span id="countdown" class="fw-bold text-danger">5</span> giây</p>
                    <div class="progress mt-2" style="height: 8px;">
                        <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width: 0%"></div>
                    </div>
                </div>
                
                <div class="d-grid gap-2 mt-4" id="action-buttons">
                    <a id="direct-link" href="#" class="btn btn-primary btn-lg shadow fw-bold disabled">Đang xác minh...</a>
                    <a href="javascript:history.back()" class="btn btn-link text-secondary">Hủy bỏ</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_MAPPING = "https://raw.githubusercontent.com/abcsnoob/apis-json/refs/heads/main/domain_mapping.json";

        async function startScanning() {
            const params = new URLSearchParams(window.location.search);
            let target = params.get('to');
            if (!target) return;
            if (!target.startsWith('http')) target = 'https://' + target;

            const el = {
                platform: document.getElementById('platform'),
                domainSub: document.getElementById('domain-sub'),
                countdown: document.getElementById('countdown'),
                progressBar: document.getElementById('progress-bar'),
                directLink: document.getElementById('direct-link'),
                warningBox: document.getElementById('warning-box'),
                msgHeader: document.getElementById('msg-header'),
                timerArea: document.getElementById('timer-area'),
                screenshot: document.getElementById('screenshot'),
                loadingPreview: document.getElementById('loading-preview')
            };

            el.directLink.href = target;
            const urlObj = new URL(target);
            const currentDomain = urlObj.hostname.replace(/^www\./, '').toLowerCase();
            el.domainSub.innerText = currentDomain;

            // Bắt đầu tải ảnh Preview ngay lập tức (chạy ngầm)
            el.screenshot.src = `https://api.microlink.io/?url=${encodeURIComponent(target)}&screenshot=true&embed=screenshot.url`;
            el.screenshot.onload = () => {
                el.loadingPreview.style.display = 'none';
                el.screenshot.style.display = 'block';
            };

            try {
                // BẮT ĐẦU DÒ JSON
                const res = await fetch(API_MAPPING);
                const mapping = await res.json();

                let foundData = null;
                let isDangerous = false;
                let isAka = false;

                for (const [key, data] of Object.entries(mapping)) {
                    const akaList = data.aka ? data.aka.map(d => d.toLowerCase()) : [];
                    
                    // 1. Nếu là AKA -> BIẾN MẤT NGAY (CHUYỂN HƯỚNG THẲNG)
                    if (akaList.includes(currentDomain)) {
                        window.location.replace(target);
                        return; 
                    }

                    // 2. Nếu là domain gốc
                    if (currentDomain === key.toLowerCase()) {
                        foundData = data;
                        if (key === "dangerous_sites") isDangerous = true;
                        break;
                    }
                }

                // SAU KHI DÒ XONG MỚI XỬ LÝ GIAO DIỆN
                if (isDangerous) {
                    // CHẾ ĐỘ CẢNH BÁO
                    document.body.classList.add('is-dangerous');
                    el.msgHeader.innerText = "KẾT QUẢ QUÉT: NGUY HIỂM!";
                    el.platform.innerText = "TRANG WEB ĐỘC HẠI";
                    el.platform.classList.replace('text-primary', 'text-danger');
                    el.warningBox.className = "alert alert-danger shadow-sm border-3";
                    el.warningBox.innerHTML = `<h4><i class="fa-solid fa-biohazard me-2"></i>${foundData.type}</h4>
                        Trang web này nằm trong danh sách đen. Mọi chuyển hướng tự động đã bị vô hiệu hóa.`;
                    el.directLink.innerHTML = "ĐÃ CHẶN VÌ AN TOÀN";
                    el.directLink.classList.add('disabled');
                } else {
                    // CHẾ ĐỘ AN TOÀN -> MỚI HIỆN ĐẾM NGƯỢC
                    el.msgHeader.innerText = "KẾT QUẢ QUÉT: AN TOÀN";
                    el.platform.innerText = foundData ? foundData.name : currentDomain;
                    el.warningBox.className = "alert alert-success py-2";
                    el.warningBox.innerHTML = `<i class="fa-solid fa-circle-check me-2"></i>Không tìm thấy rủi ro. Bạn có thể tiếp tục.`;
                    el.directLink.innerText = "Truy cập ngay";
                    el.directLink.classList.remove('disabled');
                    el.timerArea.style.display = 'block'; // Hiện đếm ngược
                    
                    startCountdown(el, target);
                }

            } catch (e) {
                // Nếu lỗi API, cho đi luôn để không làm phiền người dùng
                window.location.href = target;
            }
        }

        function startCountdown(el, target) {
            let timeLeft = 5;
            const interval = setInterval(() => {
                timeLeft--;
                el.countdown.innerText = timeLeft;
                el.progressBar.style.width = ((5 - timeLeft) / 5 * 100) + "%";
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    window.location.href = target;
                }
            }, 1000);
        }

        window.onload = startScanning;
    </script>
</body>
</html>
