<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm tra liên kết | Abc's Noob</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous"/>
    <link href="./assets/css/style.css" rel="stylesheet" />
    <link rel="icon" href="assets/image/favicon.ico" type="image/x-icon"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    
    <style>
        :root { --accent-color: #0d6efd; }
        body { transition: all 0.5s ease; }
        .redirect-card { max-width: 550px; margin: 60px auto; border-radius: 24px; border: none; background: #fff; transition: transform 0.3s; }
        .platform-display { font-size: 2.5rem; font-weight: 800; color: var(--accent-color); line-height: 1.2; }
        
        /* Cảnh báo nguy hiểm */
        body.is-dangerous { background-color: #721c24 !important; }
        .is-dangerous .redirect-card { border: 4px solid #dc3545; }
        .is-dangerous .platform-display { color: #dc3545; }
        .is-dangerous #direct-link { display: none; } /* Chặn nút đi tiếp nếu nguy hiểm */
        
        .loader-ring {
            display: inline-block; width: 60px; height: 60px;
            border: 5px solid rgba(0,0,0,0.05);
            border-radius: 50%; border-top-color: var(--accent-color);
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .domain-sub { font-size: 1rem; color: #6c757d; font-family: 'Courier New', Courier, monospace; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container justify-content-center">
            <a class="navbar-brand" href="./"><img src="./assets/image/abcsnoob.webp" style="width:30px; margin-right:10px;">Abc's Noob</a>
        </div>
    </nav>

    <div class="container text-center">
        <div class="card redirect-card shadow-lg p-5">
            <div id="status-icon" class="mb-4"><div class="loader-ring"></div></div>
            
            <h2 id="msg-header" class="fw-bold text-dark">Đang kiểm tra liên kết...</h2>
            <div id="platform" class="platform-display my-3">...</div>
            <div id="domain-sub" class="domain-sub mb-4"></div>

            <div id="warning-box" class="alert alert-info py-3">
                <i class="fa-solid fa-circle-info me-2"></i>Đang đối soát dữ liệu bảo mật...
            </div>

            <p id="timer-text" class="mt-3">Tự động chuyển tiếp sau <span id="countdown" class="fw-bold text-danger">5</span> giây...</p>
            
            <div class="d-grid gap-3 mt-4">
                <a id="direct-link" href="#" class="btn btn-primary btn-lg shadow">Tiếp tục truy cập</a>
                <a href="javascript:history.back()" class="btn btn-outline-secondary">Quay lại trang trước</a>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://raw.githubusercontent.com/abcsnoob/apis-json/refs/heads/main/domain_mapping.json";

        async function init() {
            const params = new URLSearchParams(window.location.search);
            let target = params.get('to');
            const platformEl = document.getElementById('platform');
            const domainSubEl = document.getElementById('domain-sub');
            const countdownEl = document.getElementById('countdown');
            const directLink = document.getElementById('direct-link');
            const warningBox = document.getElementById('warning-box');
            const msgHeader = document.getElementById('msg-header');

            if (!target) {
                platformEl.innerText = "Lỗi: Link trống";
                return;
            }

            if (!target.startsWith('http')) target = 'https://' + target;
            directLink.href = target;

            try {
                const urlObj = new URL(target);
                const currentDomain = urlObj.hostname.replace(/^www\./, '').toLowerCase();
                domainSubEl.innerText = currentDomain;

                const res = await fetch(API_URL);
                const mapping = await res.json();

                let foundData = null;
                let isDangerous = false;

                // Kiểm tra Mapping
                for (const [key, data] of Object.entries(mapping)) {
                    const akaList = data.aka ? data.aka.map(d => d.toLowerCase()) : [];
                    if (currentDomain === key.toLowerCase() || akaList.includes(currentDomain)) {
                        foundData = data;
                        if (key === "dangerous_sites") isDangerous = true;
                        break;
                    }
                }

                if (isDangerous) {
                    // Giao diện cảnh báo đỏ
                    document.body.classList.add('is-dangerous');
                    msgHeader.innerText = "CẢNH BÁO NGUY HIỂM!";
                    platformEl.innerText = foundData.name;
                    warningBox.className = "alert alert-danger py-3";
                    warningBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation me-2"></i>Trang web này nằm trong danh sách đen (Lừa đảo/Cá cược). Hệ thống đã chặn tự động chuyển hướng.`;
                    document.getElementById('timer-text').style.display = 'none';
                    document.getElementById('status-icon').innerHTML = '<i class="fa-solid fa-circle-xmark fa-4x text-danger"></i>';
                } else {
                    // Giao diện bình thường
                    msgHeader.innerText = "Bạn sắp ra ngoài rồi đấy!";
                    platformEl.innerText = foundData ? foundData.name : currentDomain;
                    warningBox.innerHTML = `<i class="fa-solid fa-shield-check text-success me-2"></i>Liên kết đã được kiểm tra an toàn.`;
                    
                    let time = 5;
                    const timer = setInterval(() => {
                        time--;
                        countdownEl.innerText = time;
                        if (time <= 0) {
                            clearInterval(timer);
                            window.location.href = target;
                        }
                    }, 1000);
                }

            } catch (e) {
                platformEl.innerText = "Liên kết ngoài";
            }
        }
        window.onload = init;
    </script>
</body>
</html>
