<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm tra liên kết | Abc's Noob</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    
    <style>
        :root { --accent-color: #0d6efd; }
        body { transition: background-color 0.5s ease; min-height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .redirect-card { 
            max-width: 600px; 
            margin: 40px auto; 
            border-radius: 24px; 
            border: none; 
            background: #fff; 
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .preview-container {
            width: 100%;
            height: 250px;
            background: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid #dee2e6;
        }
        .preview-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .platform-display { font-size: 2.2rem; font-weight: 800; color: var(--accent-color); line-height: 1.2; }
        .domain-sub { font-size: 0.9rem; color: #6c757d; font-family: monospace; }

        /* Lockdown Mode */
        body.is-dangerous { background-color: #4a0404 !important; }
        .is-dangerous .redirect-card { border: 5px solid #dc3545; box-shadow: 0 0 40px rgba(220, 53, 69, 0.6) !important; }
        .is-dangerous .platform-display { color: #dc3545; }
        .is-dangerous .btn-primary, .is-dangerous #timer-text { display: none !important; }
        .is-dangerous .preview-container { filter: grayscale(1) sepia(1) hue-rotate(-50deg) saturate(2); }

        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-ring { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--accent-color); border-radius: 50%; animation: spin 1s linear infinite; }
        .animate-pulse { animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container justify-content-center">
            <a class="navbar-brand fw-bold" href="./">
                <img src="./assets/image/abcsnoob.webp" style="width:30px; border-radius:50%; margin-right:10px;">Abc's Noob
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="card redirect-card shadow-lg">
            <div class="preview-container" id="preview-box">
                <div id="preview-loading" class="text-center">
                    <div class="loader-ring mx-auto mb-2"></div>
                    <small class="text-muted">Đang tải ảnh xem trước...</small>
                </div>
                <img id="screenshot" class="preview-img" alt="Website Preview">
            </div>

            <div class="p-4 p-md-5 text-center pt-0">
                <div id="status-icon" class="mt-n3 mb-3" style="margin-top: -25px; position: relative; z-index: 10;">
                    <span class="badge rounded-pill bg-white shadow-sm p-3">
                        <i class="fa-solid fa-shield-halved text-primary fs-3"></i>
                    </span>
                </div>

                <h3 id="msg-header" class="fw-bold text-dark">Kiểm tra an toàn...</h3>
                <div id="platform" class="platform-display my-2">...</div>
                <div id="domain-sub" class="domain-sub mb-4"></div>

                <div id="warning-box" class="alert alert-secondary py-2 small">
                    <i class="fa-solid fa-circle-notch fa-spin me-2"></i>Đang xác minh danh tính...
                </div>

                <p id="timer-text" class="mt-3">Chuyển hướng sau <span id="countdown" class="fw-bold text-danger">5</span> giây...</p>
                
                <div class="d-grid gap-2 mt-4">
                    <a id="direct-link" href="#" class="btn btn-primary btn-lg fw-bold shadow">Tiếp tục ngay</a>
                    <a href="javascript:history.back()" class="btn btn-outline-secondary">Quay lại an toàn</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://raw.githubusercontent.com/abcsnoob/apis-json/refs/heads/main/domain_mapping.json";

        async function init() {
            const params = new URLSearchParams(window.location.search);
            let target = params.get('to');
            const platformEl = document.getElementById('platform');
            const domainSubEl = document.getElementById('domain-sub');
            const countdownEl = document.getElementById('countdown');
            const directLink = document.getElementById('direct-link');
            const warningBox = document.getElementById('warning-box');
            const msgHeader = document.getElementById('msg-header');
            const statusIcon = document.getElementById('status-icon');
            const screenshotImg = document.getElementById('screenshot');

            if (!target) {
                platformEl.innerText = "Thiếu liên kết";
                return;
            }

            if (!target.startsWith('http')) target = 'https://' + target;
            directLink.href = target;

            // 1. Hiển thị screenshot (Sử dụng WordPress mShot API - Free & Fast)
            screenshotImg.src = `https://s0.wp.com/mshots/v1/${encodeURIComponent(target)}?w=600&h=450`;
            screenshotImg.onload = () => {
                document.getElementById('preview-loading').style.display = 'none';
                screenshotImg.style.display = 'block';
            };

            try {
                const urlObj = new URL(target);
                const currentDomain = urlObj.hostname.replace(/^www\./, '').toLowerCase();
                domainSubEl.innerText = currentDomain;

                const res = await fetch(API_URL);
                const mapping = await res.json();

                let foundData = null;
                let isDangerous = false;
                let isAka = false;

                for (const [key, data] of Object.entries(mapping)) {
                    const akaList = data.aka ? data.aka.map(d => d.toLowerCase()) : [];
                    
                    if (key === "dangerous_sites" && akaList.includes(currentDomain)) {
                        isDangerous = true;
                        foundData = data;
                        break;
                    }
                    if (currentDomain === key.toLowerCase()) {
                        foundData = data;
                        break;
                    }
                    if (akaList.includes(currentDomain)) {
                        foundData = data;
                        isAka = true;
                        break;
                    }
                }

                // 2. Xử lý Logic chuyển hướng
                if (isDangerous) {
                    document.body.classList.add('is-dangerous');
                    statusIcon.innerHTML = '<span class="badge rounded-pill bg-danger shadow-sm p-3 animate-pulse"><i class="fa-solid fa-skull-crossbones text-white fs-2"></i></span>';
                    msgHeader.innerText = "NGUY HIỂM: ĐÃ CHẶN!";
                    platformEl.innerText = foundData.name;
                    warningBox.className = "alert alert-danger py-3 shadow-sm";
                    warningBox.innerHTML = `<b>Cảnh báo:</b> Đây là trang ${foundData.type}. Tuyệt đối không nhập mật khẩu hay thông tin thẻ.`;
                    document.getElementById('timer-text').style.display = 'none';
                    directLink.classList.add('disabled');
                } 
                else if (isAka) {
                    // Nếu là AKA -> Chuyển hướng ngay (Tối ưu băng thông)
                    window.location.replace(target);
                } 
                else {
                    statusIcon.innerHTML = '<span class="badge rounded-pill bg-success shadow-sm p-3"><i class="fa-solid fa-check text-white fs-3"></i></span>';
                    msgHeader.innerText = "Liên kết an toàn";
                    platformEl.innerText = foundData ? foundData.name : currentDomain;
                    warningBox.className = "alert alert-success py-2";
                    warningBox.innerHTML = `<i class="fa-solid fa-shield-check me-2"></i>Dữ liệu sạch. Chúc bạn trải nghiệm vui vẻ!`;
                    
                    let time = 5;
                    const timer = setInterval(() => {
                        time--;
                        countdownEl.innerText = time;
                        if (time <= 0) {
                            clearInterval(timer);
                            window.location.href = target;
                        }
                    }, 1000);
                }
            } catch (e) {
                window.location.href = target;
            }
        }
        window.onload = init;
    </script>
</body>
</html>
