<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Safe Redirect</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
    body {
        font-family: system-ui, sans-serif;
        background: #0f172a;
        color: #e5e7eb;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
    }
    .box {
        background: #020617;
        border-radius: 12px;
        padding: 24px;
        max-width: 480px;
        width: 100%;
        box-shadow: 0 20px 40px rgba(0,0,0,.4);
    }
    h1 { margin-top: 0; }
    .danger { color: #ef4444; }
    .safe { color: #22c55e; }
    .countdown {
        font-size: 22px;
        font-weight: bold;
        margin-top: 12px;
    }
    button {
        margin-top: 16px;
        padding: 10px 16px;
        border-radius: 8px;
        border: none;
        background: #2563eb;
        color: white;
        cursor: pointer;
    }
</style>
</head>

<body>
<div class="box">
    <h1 id="title">Checking…</h1>
    <p id="desc"></p>
    <div id="extra"></div>
</div>

<script>
(async () => {

    /* =====================
       CONFIG
    ====================== */
    const COUNTDOWN_SECONDS = 5;
    const MAPPING_URL = "https://raw.githubusercontent.com/abcsnoob/apis-json/refs/heads/main/domain_mapping.json";

    /* =====================
       UTILS
    ====================== */
    const qs = new URLSearchParams(location.search);
    const target = qs.get("to");

    if (!target) {
        document.getElementById("title").innerText = "❌ Thiếu tham số ?to=";
        return;
    }

    let urlObj;
    try {
        urlObj = new URL(
            target.startsWith("http") ? target : "https://" + target
        );
    } catch {
        document.getElementById("title").innerText = "❌ URL không hợp lệ";
        return;
    }

    const normalizeDomain = (host) =>
        host
            .toLowerCase()
            .replace(/^www\./, "")
            .replace(/:\d+$/, "");

    const currentDomain = normalizeDomain(urlObj.hostname);

    /* =====================
       LOAD JSON
    ====================== */
    const res = await fetch(MAPPING_URL);
    const mapping = await res.json();

    let foundData = null;
    let finalTarget = urlObj.href;
    let isDangerous = false;

    /* =====================
       CHECK DANGEROUS
    ====================== */
    const dangerData = mapping["dangerous_sites"];

    if (dangerData?.aka) {
        const bad = dangerData.aka.some(d => {
            d = d.toLowerCase();
            return currentDomain === d || currentDomain.endsWith("." + d);
        });

        if (bad) {
            isDangerous = true;
            foundData = dangerData;
        }
    }

    /* =====================
       NORMAL DOMAIN HEALER
    ====================== */
    if (!isDangerous) {
        for (const [key, data] of Object.entries(mapping)) {
            if (key === "dangerous_sites") continue;

            const main = normalizeDomain(key);

            if (currentDomain === main) {
                foundData = data;
                finalTarget = data.url || ("https://" + key);
                break;
            }

            if (data.aka?.some(a => {
                a = a.toLowerCase();
                return currentDomain === a || currentDomain.endsWith("." + a);
            })) {
                foundData = data;
                finalTarget = data.url || ("https://" + key);
                break;
            }
        }
    }

    /* =====================
       UI RENDER
    ====================== */
    const title = document.getElementById("title");
    const desc = document.getElementById("desc");
    const extra = document.getElementById("extra");

    if (isDangerous) {
        title.innerHTML = "🚫 <span class='danger'>Trang web nguy hiểm</span>";
        desc.innerHTML = `
            Domain <b>${currentDomain}</b> được đánh dấu là
            <b>${foundData?.type || "Nguy hiểm"}</b>.
        `;
        extra.innerHTML = `
            <button onclick="history.back()">⬅ Quay lại</button>
        `;
        return;
    }

    title.innerHTML = "✅ <span class='safe'>Trang web an toàn</span>";
    desc.innerHTML = `
        Bạn sẽ được chuyển đến:<br>
        <b>${finalTarget}</b>
    `;

    let time = COUNTDOWN_SECONDS;
    const cd = document.createElement("div");
    cd.className = "countdown";
    cd.innerText = time;
    extra.appendChild(cd);

    const btn = document.createElement("button");
    btn.innerText = "Đi ngay";
    btn.onclick = () => location.href = finalTarget;
    extra.appendChild(btn);

    const timer = setInterval(() => {
        time--;
        cd.innerText = time;
        if (time <= 0) {
            clearInterval(timer);
            location.href = finalTarget;
        }
    }, 1000);

})();
</script>
</body>
</html>
