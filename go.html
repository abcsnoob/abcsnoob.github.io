<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abc's Noob | Link Scanner</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root { --danger:#ff4d4d; --primary:#0d6efd; }

body {
    background:#f8f9fa;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    font-family:"Segoe UI",sans-serif;
}

.redirect-card {
    max-width:580px;
    margin:auto;
    border-radius:28px;
    border:none;
    background:#fff;
    overflow:hidden;
    box-shadow:0 15px 35px rgba(0,0,0,.15);
}

.preview-box {
    width:100%;
    height:260px;
    background:#f1f3f5;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

#screenshot {
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

.loader {
    width:45px;
    height:45px;
    border:5px solid #eee;
    border-top:5px solid var(--primary);
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin { to { transform:rotate(360deg); } }

body.is-dangerous {
    background:#2b0000;
}

.is-dangerous .redirect-card {
    border:5px solid var(--danger);
    outline:100vh solid rgba(0,0,0,.4);
}
</style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
<div class="container justify-content-center">
<a class="navbar-brand fw-bold" href="./">Abc's Noob</a>
</div>
</nav>

<div class="container py-5">
<div class="card redirect-card">

<div class="preview-box">
    <div id="loading-preview" class="text-center">
        <div class="loader mx-auto mb-2"></div>
        <small class="text-muted fw-bold">ĐANG PHÂN TÍCH LIÊN KẾT...</small>
    </div>
    <img id="screenshot" alt="Preview">
</div>

<div class="card-body text-center p-4 p-md-5">
    <h4 id="msg-header" class="fw-bold text-secondary mb-2">Đang xử lý…</h4>
    <div id="platform" class="display-6 fw-bold text-primary mb-1">—</div>
    <div id="domain-sub" class="text-muted font-monospace mb-4">—</div>

    <div id="warning-box" class="alert alert-secondary">
        Đang kiểm tra dữ liệu…
    </div>

    <div id="timer-area" style="display:none">
        <p class="fw-bold text-success">
            Chuyển hướng sau <span id="countdown">5</span>s
        </p>
        <div class="progress" style="height:10px">
            <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated bg-success"></div>
        </div>
    </div>

    <div class="d-grid gap-2 mt-4">
        <a id="direct-link" class="btn btn-primary btn-lg disabled">Vui lòng chờ…</a>
        <a href="javascript:history.back()" class="btn btn-outline-secondary">Quay lại</a>
    </div>
</div>

</div>
</div>

<script>
const API_MAPPING =
"https://raw.githubusercontent.com/abcsnoob/apis-json/refs/heads/main/domain_mapping.json";

/* ===== DOMAIN TOOLS ===== */
const normalize = d =>
    d.toLowerCase().replace(/^www\./,"").replace(/:\d+$/,"");

const match = (cur, target) =>
    cur === target || cur.endsWith("." + target);

/* ===== PREVIEW ===== */
function loadPreview(url, el) {
    el.load.style.display = "block";
    el.img.style.display = "none";

    const img = new Image();
    img.src =
        "https://api.microlink.io/?url=" +
        encodeURIComponent(url) +
        "&screenshot=true&embed=screenshot.url";

    img.onload = () => {
        el.img.src = img.src;
        el.load.style.display = "none";
        el.img.style.display = "block";
    };

    img.onerror = () => {
        el.load.innerHTML =
            "<i class='fa-solid fa-eye-slash fa-2x text-muted'></i>";
    };
}

/* ===== MAIN ===== */
async function init() {
    const p = new URLSearchParams(location.search);
    let target = p.get("to");
    if (!target) return;
    if (!target.startsWith("http")) target = "https://" + target;

    const url = new URL(target);
    const cur = normalize(url.hostname);

    const el = {
        msg: document.getElementById("msg-header"),
        platform: document.getElementById("platform"),
        domain: document.getElementById("domain-sub"),
        warn: document.getElementById("warning-box"),
        timer: document.getElementById("timer-area"),
        cd: document.getElementById("countdown"),
        bar: document.getElementById("progress-bar"),
        link: document.getElementById("direct-link"),
        load: document.getElementById("loading-preview"),
        img: document.getElementById("screenshot")
    };

    el.domain.innerText = cur;
    loadPreview(target, el);

    const map = await fetch(API_MAPPING).then(r => r.json());

    /* ---- dangerous ---- */
    if (map.dangerous_sites?.aka) {
        for (const d of map.dangerous_sites.aka) {
            if (match(cur, normalize(d))) {
                document.body.classList.add("is-dangerous");
                el.msg.innerText = "NGUY HIỂM";
                el.platform.innerText = "ĐÃ CHẶN";
                el.warn.className = "alert alert-danger fw-bold";
                el.warn.innerText = "Trang web nằm trong danh sách đen";
                el.link.style.display = "none";
                return;
            }
        }
    }

    /* ---- normal ---- */
    for (const [key,data] of Object.entries(map)) {
        if (key === "dangerous_sites") continue;

        if (match(cur, normalize(key))) {
            el.platform.innerText = data.name;
            el.warn.className = "alert alert-success";
            el.warn.innerText = "Trang web an toàn";
            return redirect(el, target);
        }

        if (data.aka) {
            for (const aka of data.aka) {
                if (match(cur, normalize(aka))) {
                    el.platform.innerText = data.name;
                    el.warn.className = "alert alert-info";
                    el.warn.innerText =
                        "Link phụ – đang bẻ lái về trang chính";
                    return redirect(el, "https://" + key);
                }
            }
        }
    }

    el.platform.innerText = cur;
    el.warn.className = "alert alert-secondary";
    el.warn.innerText = "Không có dữ liệu – tiếp tục";
    redirect(el, target);
}

/* ===== REDIRECT ===== */
function redirect(el, url) {
    el.timer.style.display = "block";
    el.link.href = url;

    let t = 5;
    el.cd.innerText = t;

    const i = setInterval(() => {
        t--;
        el.cd.innerText = t;
        el.bar.style.width = ((5 - t) / 5 * 100) + "%";
        el.link.innerText = `Vui lòng chờ (${t}s)`;

        if (t <= 0) {
            clearInterval(i);
            el.link.classList.remove("disabled");
            el.link.innerText = "Truy cập ngay";
            location.href = url;
        }
    }, 1000);
}

window.addEventListener("DOMContentLoaded", init);
</script>

</body>
</html>
