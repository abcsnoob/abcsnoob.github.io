<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Xem PowerPoint</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #loader {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #111;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
    }

    .spinner {
      border: 8px solid #f3f3f3;
      border-top: 8px solid #3498db;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <div>Đang tải PowerPoint... vui lòng chờ</div>
  </div>

  <iframe id="pptxFrame"></iframe>

  <script>
    const params = new URLSearchParams(window.location.search);
    let pptxUrl = params.get("url");

    if (!pptxUrl) {
      // Nếu không có url => chuyển hướng mặc định
      window.location.href = "https://abcsnoob.github.io/files/roblox.pptx";
    } else {
      const iframe = document.getElementById("pptxFrame");
      const viewerUrl =
        "https://view.officeapps.live.com/op/embed.aspx?src=" + encodeURIComponent(pptxUrl);

      // Hiển thị spinner 5s rồi mới bắt đầu load file
      setTimeout(() => {
        iframe.src = viewerUrl;
        document.getElementById("loader").style.display = "none";
        iframe.style.display = "block";
      }, 5000);
    }
  </script>
</body>
</html>
