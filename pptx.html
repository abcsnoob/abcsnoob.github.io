<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chiếu PPTX Fullscreen</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    #container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none; /* ẩn lúc load */
    }

    /* Spinner */
    .spinner {
      border: 8px solid rgba(255, 255, 255, 0.2);
      border-top: 8px solid #3498db;
      border-radius: 50%;
      width: 80px;
      height: 80px;
      animation: spin 1s linear infinite;
      position: absolute;
      top: 50%;
      left: 50%;
      margin: -40px 0 0 -40px;
      z-index: 10;
    }

    @keyframes spin {
      0% { transform: rotate(0deg);}
      100% { transform: rotate(360deg);}
    }

    /* Thông báo lỗi */
    #message {
      color: white;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="container">
    <div class="spinner" id="spinner"></div>
    <iframe id="pptFrame" allowfullscreen></iframe>
    <div id="message"></div>
  </div>

  <script>
    const iframe = document.getElementById('pptFrame');
    const spinner = document.getElementById('spinner');
    const message = document.getElementById('message');

    // Lấy URL từ query string ?url=
    const params = new URLSearchParams(window.location.search);
    const pptUrl = params.get('url');

    if(pptUrl) {
      // Thiết lập embed Office Online
      iframe.src = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(pptUrl)}`;
      iframe.onload = () => {
        spinner.style.display = 'none';
        iframe.style.display = 'block';
      };
    } else {
      spinner.style.display = 'none';
      message.textContent = "Vui lòng truyền URL PPTX bằng ?url=...";
    }
  </script>
</body>
</html>
