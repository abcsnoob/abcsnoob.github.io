<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chiếu PPTX</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f0f0f0;
      font-family: Arial, sans-serif;
    }
    #container {
      width: 960px;
      height: 569px;
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none; /* ẩn lúc đang load */
    }

    /* Spinner */
    .spinner {
      border: 8px solid #f3f3f3;
      border-top: 8px solid #3498db;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
      position: absolute;
      top: 50%;
      left: 50%;
      margin: -30px 0 0 -30px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg);}
      100% { transform: rotate(360deg);}
    }

    /* Responsive */
    @media (max-width: 1000px) {
      #container {
        width: 90%;
        height: 50vw; /* giữ tỉ lệ 16:9 */
      }
    }
  </style>
</head>
<body>
  <div id="container">
    <div class="spinner" id="spinner"></div>
    <iframe id="pptFrame" allowfullscreen></iframe>
  </div>

  <script>
    const iframe = document.getElementById('pptFrame');
    const spinner = document.getElementById('spinner');

    // Lấy URL từ query string ?url=
    const params = new URLSearchParams(window.location.search);
    const pptUrl = params.get('url');

    if(pptUrl) {
      // Chèn link Office Online embed
      iframe.src = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(pptUrl)}`;
      iframe.onload = () => {
        spinner.style.display = 'none';
        iframe.style.display = 'block';
      };
    } else {
      spinner.style.display = 'none';
      document.getElementById('container').innerHTML = "<p>Vui lòng truyền URL PPTX bằng ?url=...</p>";
    }
  </script>
</body>
</html>
