<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tải về Abc's Noob AI - Đa nền tảng</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
body { background: #0f172a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
.card:hover { transform: translateY(-5px); transition: 0.3s; border-color: #38bdf8; }
.btn-dl { background: linear-gradient(90deg, #38bdf8 0%, #3b82f6 100%); }
.glass-panel { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(10px); }
</style>
</head>
<body class="flex flex-col min-h-screen items-center justify-center p-6 py-12">

<div class="text-center mb-10">
    <h1 class="text-5xl font-extrabold mb-4 bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
        Abc's Noob AI
    </h1>
    <p class="text-slate-400 text-lg">Trợ lý AI siêu cấp - Tải một lần, chạy mọi nơi</p>
</div>

<div id="download-cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 w-full max-w-6xl mb-12">
    <!-- Cards sẽ được JS tạo ra -->
</div>

<script>
const platforms = [
  { name: 'Windows', icon: 'fab fa-windows', file: 'windows', ext: '.zip', info: 'Windows 8/10/11' },
  { name: 'MacOS', icon: 'fab fa-apple', file: 'macos', ext: '.zip', info: 'Darwin / Intel & M1-3' },
  { name: 'Linux', icon: 'fab fa-linux', file: 'linux', ext: '.tar.gz', info: 'Debian Compatible' },
  { name: 'Android', icon: 'fab fa-android', file: 'android', ext: '.apk', info: 'Android 5.1 - 15. Có lỗi khởi động' }
];

// URL JSON version
const jsonUrl = 'https://raw.githubusercontent.com/abcsnoob/abcsnoobytb/refs/heads/main/aiapp-release.json'; // đặt file JSON của bạn ở cùng thư mục hoặc URL

fetch(jsonUrl)
  .then(res => res.json())
  .then(data => {
    const version = data.latest;
    const base = data.base_url;
    const container = document.getElementById('download-cards');

    platforms.forEach(p => {
      const url = `${base}${version}/abcsnoob-${p.file}${p.ext}`;
      const card = document.createElement('div');
      card.className = 'card bg-slate-800 p-6 rounded-2xl border border-slate-700 text-center';
      card.innerHTML = `
        <i class="${p.icon} text-4xl text-blue-400 mb-4"></i>
        <h3 class="text-xl font-bold mb-1">${p.name}</h3>
        <p class="text-xs text-slate-300 mb-2 uppercase tracking-wider">${p.info}</p>
        <p class="text-sm text-slate-400 mb-6 font-mono">${p.ext} (tải về)</p>
        <a href="${url}" class="btn-dl block py-3 px-4 rounded-xl font-bold hover:opacity-90 transition">
          Tải bản ${p.name}
        </a>
      `;
      container.appendChild(card);
    });
  })
  .catch(err => {
    console.error('Không thể load JSON:', err);
    document.getElementById('download-cards').innerHTML = '<p class="text-red-500">Không thể load dữ liệu download.</p>';
  });
</script>

</body>
</html>
