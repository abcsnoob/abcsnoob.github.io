<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tải về Abc's Noob AI - Đa nền tảng</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
body { background: #0f172a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
.card:hover { transform: translateY(-5px); transition: 0.3s; border-color: #38bdf8; }
.btn-dl { background: linear-gradient(90deg, #38bdf8 0%, #3b82f6 100%); }
.glass-panel { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(10px); }
</style>
</head>
<body class="flex flex-col min-h-screen items-center justify-center p-6 py-12">

<div class="text-center mb-10">
    <h1 class="text-5xl font-extrabold mb-4 bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
        Abc's Noob AI
    </h1>
    <p class="text-slate-400 text-lg">Trợ lý AI siêu cấp - Tải một lần, chạy mọi nơi</p>
    <div class="mt-4">
        <label for="version-select" class="text-slate-300 mr-2 font-semibold">Chọn phiên bản:</label>
        <select id="version-select" class="bg-slate-700 text-white rounded px-3 py-1"></select>
    </div>
</div>

<div id="download-cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 w-full max-w-6xl mb-12">
    </div>
<div class="mt-6 flex gap-4 justify-center">
    <a href="https://abcsnoob.github.io/chat/" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2 rounded-full font-bold transition flex items-center gap-2">
        <i class="fas fa-globe"></i> Dùng bản Web (Không cần cài đặt)
    </a>
</div>

<script>
const platforms = [
  { name: 'Windows', icon: 'fab fa-windows', key: 'windows', ext: '.zip', info: 'Windows 8/10/11 (Đã test)' },
  { name: 'MacOS', icon: 'fab fa-apple', key: 'macos', ext: '.zip', info: 'Intel & Apple Silicon (Beta)' },
  { name: 'Linux', icon: 'fab fa-linux', key: 'linux', ext: '.tar.gz', info: 'Bản thực thi đa nền tảng (Beta)' }, 
  { name: 'Android', icon: 'fab fa-android', key: 'android', ext: '.apk', info: 'Android 5.1 - 15 (Đã test)' }
];

const jsonUrl = 'https://raw.githubusercontent.com/abcsnoob/abcsnoobytb/refs/heads/main/aiapp-release.json';

let versionData = null;

function renderDownloads(versionObj) {
  const container = document.getElementById('download-cards');
  container.innerHTML = '';

  platforms.forEach(p => {
    const url = versionObj.downloads[p.key];
    if(!url) return; 
    const card = document.createElement('div');
    card.className = 'card bg-slate-800 p-6 rounded-2xl border border-slate-700 text-center';
    card.innerHTML = `
      <i class="${p.icon} text-4xl text-blue-400 mb-4"></i>
      <h3 class="text-xl font-bold mb-1">${p.name}</h3>
      <p class="text-xs text-slate-300 mb-2 uppercase tracking-wider">${p.info}</p>
      <p class="text-sm text-slate-400 mb-6 font-mono">${p.ext} (tải về)</p>
      <a href="${url}" class="btn-dl block py-3 px-4 rounded-xl font-bold hover:opacity-90 transition">
        Tải bản ${p.name}
      </a>
    `;
    container.appendChild(card);
  });
}

// Hàm lấy thông tin hash hiện tại trên URL (bỏ ký tự '#')
function getVersionFromHash() {
  return window.location.hash ? window.location.hash.substring(1) : null;
}

// Load JSON
fetch(jsonUrl)
  .then(res => res.json())
  .then(data => {
    versionData = data;
    const select = document.getElementById('version-select');

    if(data.versions && data.versions.length > 0){
      data.versions.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.version;
        opt.textContent = v.version;
        select.appendChild(opt);
      });

      // --- PHẦN XỬ LÝ URL TỰ ĐỘNG ---
      const hashVersion = getVersionFromHash();
      // Tìm xem version trong hash có tồn tại trong danh sách JSON không
      const matchedVersion = data.versions.find(v => v.version === hashVersion);
      
      // Nếu khớp thì chọn version theo URL, nếu không thì lấy mặc định bản mới nhất (bản đầu tiên)
      const currentVersion = matchedVersion || data.versions[0];
      
      select.value = currentVersion.version;
      renderDownloads(currentVersion);

      // Nếu không có hash hoặc hash sai, cập nhật lại hash chuẩn cho URL
      if (!matchedVersion) {
        window.history.replaceState(null, null, '#' + currentVersion.version);
      }
      // -------------------------------

      // Khi đổi version thủ công
      select.addEventListener('change', e => {
        const selected = data.versions.find(v => v.version === e.target.value);
        if(selected) {
          renderDownloads(selected);
          // Cập nhật lại hash trên thanh địa chỉ mà không reload trang
          window.history.pushState(null, null, '#' + selected.version);
        }
      });
      
      // Lắng nghe sự kiện nếu user bấm nút Back/Forward của trình duyệt thì cập nhật theo URL
      window.addEventListener('hashchange', () => {
        const newHash = getVersionFromHash();
        const selected = data.versions.find(v => v.version === newHash);
        if (selected && select.value !== newHash) {
          select.value = selected.version;
          renderDownloads(selected);
        }
      });

    } else {
      select.style.display = 'none';
    }
  })
  .catch(err => {
    console.error('Không thể load JSON:', err);
    document.getElementById('download-cards').innerHTML = '<p class="text-red-500">Không thể load dữ liệu download.</p>';
  });
</script>

</body>
</html>
