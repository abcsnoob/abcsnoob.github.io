<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tải về Abc's Noob AI - Đa nền tảng</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
body { background: #0f172a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
.card:hover { transform: translateY(-5px); transition: 0.3s; border-color: #38bdf8; }
.btn-dl { background: linear-gradient(90deg, #38bdf8 0%, #3b82f6 100%); }
.glass-panel { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(10px); }
</style>
</head>
<body class="flex flex-col min-h-screen items-center justify-center p-6 py-12">

<div class="text-center mb-10">
    <h1 class="text-5xl font-extrabold mb-4 bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
        Abc's Noob AI
    </h1>
    <p class="text-slate-400 text-lg">Trợ lý AI siêu cấp - Tải một lần, chạy mọi nơi</p>
</div>

<div id="download-cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 w-full max-w-6xl mb-12">
    <!-- JS sẽ thêm card download ở đây -->
</div>

<script>
const platforms = [
  { name: 'Windows', icon: 'fab fa-windows', key: 'windows' },
  { name: 'MacOS', icon: 'fab fa-apple', key: 'macos' },
  { name: 'Linux', icon: 'fab fa-linux', key: 'linux' },
  { name: 'Android', icon: 'fab fa-android', key: 'android' }
];

// JSON chứa latest + links
const jsonUrl = 'https://raw.githubusercontent.com/abcsnoob/abcsnoobytb/refs/heads/main/aiapp-release.json';

fetch(jsonUrl)
  .then(res => {
    if (!res.ok) throw new Error('Không load được JSON');
    return res.json();
  })
  .then(data => {
    const version = data.latest || data.version;
    const downloads = data.downloads || {};
    const container = document.getElementById('download-cards');

    platforms.forEach(p => {
      const url = downloads[p.key] || '#';
      const card = document.createElement('div');
      card.className = 'card bg-slate-800 p-6 rounded-2xl border border-slate-700 text-center';
      card.innerHTML = `
        <i class="${p.icon} text-4xl text-blue-400 mb-4"></i>
        <h3 class="text-xl font-bold mb-1">${p.name}</h3>
        <p class="text-sm text-slate-400 mb-6 font-mono">${url !== '#' ? url.split('/').pop() : 'Chưa có link'}</p>
        <a href="${url}" class="btn-dl block py-3 px-4 rounded-xl font-bold hover:opacity-90 transition ${url === '#' ? 'opacity-50 pointer-events-none' : ''}">
          ${url === '#' ? 'Chưa có' : 'Tải bản ' + p.name}
        </a>
      `;
      container.appendChild(card);
    });
  })
  .catch(err => {
    console.error('Lỗi:', err);
    document.getElementById('download-cards').innerHTML = '<p class="text-red-500 text-center w-full">Không thể tải dữ liệu phiên bản.</p>';
  });
</script>

</body>
</html>
