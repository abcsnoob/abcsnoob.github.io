<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>markdown =)</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nprogress/0.2.0/nprogress.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/nprogress/0.2.0/nprogress.min.css">
    

    <style>
                #nprogress .bar { 
            background: #4e73df !important; 
            height: 3px !important; 
            z-index: 2000 !important; /* Đảm bảo luôn nằm trên cùng */
        }
        #nprogress .peg { box-shadow: 0 0 10px var(--primary), 0 0 5px var(--primary) !important; }
    </style>
<script>
        NProgress.start();
</script>
</head>
<body>

<header>
    <div class="logo" onclick="goHome()">markdown =)</div>
    <div class="btn-group">
        <button class="btn-p" onclick="createNew()"><i class="fa-solid fa-plus"></i> New</button>
        <button class="btn-s" onclick="document.getElementById('file-in').click()"><i class="fa-solid fa-upload"></i> Local</button>
        <button class="btn-p" style="background:#36b9cc" onclick="toggleModal(true)"><i class="fa-solid fa-globe"></i> Open URL</button>
        <button class="btn-v" onclick="saveAndShare()"><i class="fa-solid fa-share-nodes"></i> Share</button>
    </div>
    <input type="file" id="file-in" hidden onchange="handleLocalFile(event)">
</header>

<div class="workspace">
    <div class="pane" id="editor-pane">
        <div class="p-header"><span>Editor</span><span id="char-count">0 chars</span></div>
        <textarea id="ed" spellcheck="false" placeholder="Viết markdown..."></textarea>
    </div>
    <div class="pane">
        <div class="p-header">Live Preview</div>
        <article id="pv" class="markdown-body"></article>
    </div>
</div>

<div class="modal" id="url-modal">
    <div class="modal-content">
        <h3 style="margin-top:0">Import from URL</h3>
        <input type="text" id="url-input" placeholder="https://raw.githubusercontent.com/...">
        <div style="display:flex; gap:10px; justify-content:flex-end;">
            <button class="btn-s" onclick="toggleModal(false)">Hủy</button>
            <button class="btn-p" onclick="submitUrl()">Tải file</button>
        </div>
    </div>
</div>

<div id="toast">Thông báo</div>

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
        <style>
        :root {
            --primary: #4e73df; --success: #1cc88a; --info: #36b9cc;
            --dark: #1a1b26; --gray: #858796; --light: #f8f9fc; --border: #e3e6f0;
        }

        /* Progress Bar Style - GitHub/YouTube Look */


        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif; margin: 0; padding: 0;
            background: var(--light); height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        header {
            background: #fff; padding: 8px 20px; display: flex; align-items: center;
            justify-content: space-between; border-bottom: 1px solid var(--border); z-index: 100;
        }
        .logo { font-weight: 800; color: var(--primary); font-size: 1.2rem; cursor: pointer; user-select: none; }
        .btn-group { display: flex; gap: 6px; }
        
        button {
            border: none; padding: 7px 14px; border-radius: 6px; cursor: pointer;
            font-weight: 600; font-size: 13px; transition: 0.2s; display: flex; align-items: center; gap: 6px; color: #fff;
        }
        .btn-p { background: var(--primary); }
        .btn-s { background: var(--gray); }
        .btn-v { background: var(--success); }
        button:hover { opacity: 0.9; transform: translateY(-1px); }

        .workspace { display: flex; flex: 1; overflow: hidden; }
        .pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #fff; }
        #editor-pane { border-right: 1px solid var(--border); }
        
        .p-header {
            background: #f8f9fc; padding: 5px 15px; font-size: 11px;
            font-weight: 700; color: #b7b9cc; text-transform: uppercase;
            display: flex; justify-content: space-between; border-bottom: 1px solid #f1f3f9;
        }

        textarea {
            width: 100%; flex: 1; padding: 25px; border: none; outline: none; resize: none;
            font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 14px; line-height: 1.8; color: #2e2f37;
        }

        #preview { flex: 1; padding: 40px; overflow-y: auto; scroll-behavior: smooth; }

        /* Code Block Styling */
        .markdown-body { font-size: 16px; color: #3a3b45; }
        .markdown-body pre {
            position: relative; background: var(--dark) !important;
            padding: 35px 20px 20px; border-radius: 12px; margin: 20px 0;
        }
        .markdown-body pre::before {
            content: attr(data-lang); position: absolute; top: 0; right: 0;
            background: #414868; color: #a9b1d6; padding: 4px 12px;
            font-size: 11px; font-weight: bold; border-radius: 0 12px 0 12px; text-transform: uppercase;
        }
        .markdown-body code { color: #e91e63; background: #f1f3f9; padding: 2px 5px; border-radius: 4px; }
        .markdown-body pre code { color: #cfc9c2; background: transparent; padding: 0; }

        /* Modal & Toast */
        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(2px);
        }
        .modal-content { background: #fff; padding: 25px; border-radius: 15px; width: 420px; }
        .modal-content input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid var(--border); border-radius: 8px; outline: none; }
        
        #toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #333; color: #fff; padding: 10px 25px; border-radius: 50px;
            font-size: 13px; opacity: 0; transition: 0.4s; z-index: 1000; pointer-events: none;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
    // START PROGRESS BAR NGAY LẬP TỨC KHI SCRIPT CHẠY


    const ed = document.getElementById('ed'), pv = document.getElementById('pv'), st = document.getElementById('char-count');
    let renderTimer;

    localforage.config({ name: 'MD_SPA_Ultimate' });
    NProgress.configure({ showSpinner: false, speed: 500, minimum: 0.2 });

    // Renderer Setup
    const renderer = new marked.Renderer();
    renderer.code = function(code, lang) {
        const text = typeof code === 'object' ? code.text : code;
        const language = lang || 'text';
        let highlighted;
        try {
            highlighted = hljs.getLanguage(language) ? hljs.highlight(text, { language }).value : hljs.highlightAuto(text).value;
        } catch (e) { highlighted = text; }
        return `<pre data-lang="${language}"><code>${highlighted}</code></pre>`;
    };
    marked.setOptions({ renderer, breaks: true, gfm: true });

    // SPA Routing & Global Request Handler
    async function handleRouting() {
        NProgress.start(); // Luôn chạy progress bar đầu tiên khi đổi route
        const params = new URLSearchParams(window.location.search);
        const file = params.get('file');
        const content = params.get('content');

        if (file) {
            await fetchRemoteFile(file);
        } else if (content) {
            updateUI(content.replace(/\\n/g, '\n'));
            NProgress.done();
        } else {
            const saved = await localforage.getItem('last_draft');
            updateUI(saved || "# markdown =)\nChào mừng bạn!");
            NProgress.done();
        }
    }

    function updateUI(md) {
        ed.value = md;
        render(md);
    }

    function render(md) {
        // Có thể start progress bar nhẹ ở đây nếu render cực nặng
        pv.innerHTML = DOMPurify.sanitize(marked.parse(md));
        pv.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
        st.innerText = `${md.length} chars`;
    }

    async function fetchRemoteFile(url) {
        NProgress.set(0.4); // Nhảy tới 40% ngay lập tức
        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error();
            const text = await res.text();
            updateUI(text);
            showToast("Tải file thành công!");
        } catch (e) {
            showToast("Lỗi tải file từ URL!");
        } finally {
            NProgress.done();
        }
    }

    // Modal & Actions
    function toggleModal(show) { document.getElementById('url-modal').style.display = show ? 'flex' : 'none'; }

    function submitUrl() {
        const url = document.getElementById('url-input').value.trim();
        if (url) {
            toggleModal(false);
            NProgress.start(); // Bắt đầu bar ngay khi click nút
            const newUrl = `${window.location.pathname}?file=${encodeURIComponent(url)}`;
            window.history.pushState({ path: newUrl }, '', newUrl);
            fetchRemoteFile(url);
        }
    }

    function saveAndShare() {
        NProgress.start(); // Bắt đầu bar ngay khi nhấn Share
        const mdEncoded = ed.value.replace(/\n/g, '\\n');
        const sharePath = `${window.location.pathname}?content=${encodeURIComponent(mdEncoded)}`;
        window.history.pushState({ path: sharePath }, '', sharePath);
        navigator.clipboard.writeText(window.location.href);
        
        // Giả lập xử lý 500ms để bar chạy đẹp hơn
        setTimeout(() => {
            showToast("Đã lưu và copy link!");
            NProgress.done();
        }, 500);
    }

    function handleLocalFile(e) {
        NProgress.start();
        const reader = new FileReader();
        reader.onload = (ev) => {
            updateUI(ev.target.result);
            NProgress.done();
            showToast("Đã nạp file local!");
        };
        reader.readAsText(e.target.files[0]);
    }

    function goHome() {
        NProgress.start();
        window.history.pushState({}, '', window.location.pathname);
        handleRouting();
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg; t.style.opacity = '1';
        setTimeout(() => t.style.opacity = '0', 3000);
    }

    function createNew() { 
        if(confirm("Xóa nội dung?")) {
            NProgress.start();
            updateUI("");
            NProgress.done();
        }
    }

    // Init listeners
    window.addEventListener('popstate', handleRouting);

    ed.addEventListener('input', () => {
        clearTimeout(renderTimer);
        renderTimer = setTimeout(() => {
            render(ed.value);
            localforage.setItem('last_draft', ed.value);
        }, 300);
    });

    // Chạy route lần đầu
    handleRouting();
</script>
</body>
</html>
