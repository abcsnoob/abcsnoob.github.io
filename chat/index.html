<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Trang chính thức của Abc's Noob – YouTuber Minecraft, lập trình HTML+CSS+JS."/>
    <meta name="author" content="Abc's Noob" />
    <meta property="og:title" content="Abc's Noob AI - Chatbot" />
    <meta property="og:image" content="https://abcsnoob.github.io/abcsnoob.webp" />
    
    <link rel="icon" type="image/png" href="/favicon-32x32.png" />
    <title>Abc's Noob Website | AI Chat</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link href="../assets/css/style.css" rel="stylesheet" />

    <style>
        /* Giao diện mới 100% theo style hiện đại */
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .chat-wrapper {
            max-width: 800px;
            margin: 40px auto;
        }

        .chat-card {
            background: #fff;
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 70vh;
        }

        .chat-header {
            background: #212529; /* Màu tối đồng bộ với Navbar */
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: #ffffff;
        }

        /* Bong bóng chat hiện đại */
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.5;
            position: relative;
        }

        .user-message {
            align-self: flex-end;
            background-color: #0d6efd; /* Blue primary */
            color: white;
            border-bottom-right-radius: 2px;
        }

        .bot-message {
            align-self: flex-start;
            background-color: #f1f0f0;
            color: #333;
            border-bottom-left-radius: 2px;
            white-space: pre-wrap;
        }

        .chat-footer {
            padding: 15px;
            background: #fff;
            border-top: 1px solid #eee;
        }

        .input-group {
            background: #f8f9fa;
            border-radius: 30px;
            padding: 5px 5px 5px 15px;
            border: 1px solid #ddd;
        }

        #user-input {
            border: none;
            background: transparent;
            box-shadow: none;
            padding: 10px 0;
        }

        .btn-send {
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        /* Scrollbar tinh tế */
        #chat-window::-webkit-scrollbar { width: 6px; }
        #chat-window::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
        
        .logo { width: 30px; height: 30px; border-radius: 50%; margin-right: 10px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a id="notranslate" class="navbar-brand" href="../">
                <img class="logo" src="../assets/image/abcsnoob.webp">Abc's Noob
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../">Trang chủ</a></li>
                    <li class="nav-item"><a class="nav-link" href="../blogs">Blog</a></li>
                    <li class="nav-item"><a class="nav-link" href="../apps">Ứng dụng</a></li>
                    <li class="nav-item"><a class="nav-link" href="../contact">Liên hệ</a></li>
                    <li class="nav-item"><a class="nav-link active" href="./chat">Chat AI</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container chat-wrapper">
        <div class="text-center mb-4">
            <h2 class="fw-bold">Abc's Noob AI</h2>
            <p class="text-muted">Hỏi mình bất cứ điều gì về lập trình hoặc Minecraft!</p>
        </div>

        <div class="chat-card">
            <div class="chat-header">
                <div>
                    <i class="fa-solid fa-robot me-2"></i>
                    <span class="fw-medium">Assistant</span>
                </div>
                <span class="badge rounded-pill bg-success">Online</span>
            </div>
            
            <div id="chat-window">
                <div class="message bot-message">
                    Chào bạn! Mình là AI của Abc's Noob. Chúc bạn một ngày tốt lành, mình có thể giúp gì cho bạn?
                </div>
            </div>

            <div class="chat-footer">
                <div class="input-group">
                    <input type="text" id="user-input" class="form-control" placeholder="Nhập tin nhắn..." autocomplete="off">
                    <button class="btn btn-primary btn-send" onclick="sendMessage()">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
        <p class="text-center text-muted mt-3 small">Powered by Gemini 1.5 Flash-Lite & Cloudflare</p>
    </div>

    <script>
        const WORKER_URL = 'https://abcsnoobai.abcsnoob.workers.dev';
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');

        async function sendMessage() {
            const prompt = userInput.value.trim();
            if (!prompt) return;

            addMessage(prompt, 'user-message');
            userInput.value = '';

            const loadingId = 'load-' + Date.now();
            addMessage('Đang suy nghĩ...', 'bot-message', loadingId);

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await response.json();
                document.getElementById(loadingId).innerText = data.text || data.error;
                
            } catch (err) {
                document.getElementById(loadingId).innerText = "Lỗi kết nối. Vui lòng thử lại sau!";
            }
            
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function addMessage(text, className, id = '') {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            if(id) div.id = id;
            div.innerText = text;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
    <script src="/assets/js/translate.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
