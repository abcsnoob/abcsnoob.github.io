<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abc's Noob Website | AI Chat</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="/assets/css/style.css">

    <style>
        body { background-color: #f4f7f6; margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
        .logo { width: 30px; height: 30px; border-radius: 50%; margin-right: 10px; }
        
        .main-content {
            position: relative;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        .iframe-container {
            width: 100%;
            max-width: 1100px;
            height: 82vh;
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background: #fff;
            display: none; /* Ẩn đi lúc đầu */
        }

        /* Spinner Overlay */
        .loading-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#"><img class="logo" src="/assets/image/abcsnoob.webp">Abc's Noob</a>
            <div class="ms-auto">
                <button class="btn btn-sm btn-outline-danger" onclick="clearIframeChat()">Xóa lịch sử</button>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div id="loading-spinner" class="loading-overlay">
            <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
            <span class="mt-2 text-muted fw-bold">Đang khởi tạo AI...</span>
        </div>

        <iframe id="chatFrame" class="iframe-container"></iframe>
    </div>
<script src="/assets/js/translate.js"></script>
<script type="module" src="../assets/js/warn.js"></script>
    <script>
        // Chờ 1 giây rồi mới bắt đầu tải iframe
        setTimeout(() => {
            const frame = document.getElementById('chatFrame');
            frame.src = "chat-iframe.html"; 
            
            // Khi iframe bắt đầu có nội dung thì hiện lên
            frame.onload = () => {
                document.getElementById('loading-spinner').style.display = 'none';
                frame.style.display = "block";
            };
        }, 1000);

        function clearIframeChat() {
            const frame = document.getElementById('chatFrame');
            if(frame.contentWindow) {
                frame.contentWindow.postMessage('clear-chat', '*');
            }
        }
    </script>
</body>
</html>
