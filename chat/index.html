<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abc's Noob Website | AI Chat</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">

    <style>
        /* [Giữ nguyên CSS cũ của ông] */
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .chat-wrapper { max-width: 800px; margin: 40px auto; }
        .chat-card { background: #fff; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; height: 75vh; }
        .chat-header { background: #212529; color: white; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background-color: #ffffff; }
        
        .message { max-width: 85%; padding: 12px 16px; border-radius: 20px; font-size: 15px; line-height: 1.6; }
        .user-message { align-self: flex-end; background-color: #0d6efd; color: white; border-bottom-right-radius: 2px; }
        
        /* Tinh chỉnh bot-message để hiển thị Markdown mượt hơn */
        .bot-message { align-self: flex-start; background-color: #f1f0f0; color: #333; border-bottom-left-radius: 2px; }
        .bot-message p { margin-bottom: 8px; }
        .bot-message code { background: #e0e0e0; padding: 2px 5px; border-radius: 4px; font-family: monospace; }
        .bot-message pre { background: #2d2d2d !important; color: #ccc; padding: 15px; border-radius: 10px; overflow-x: auto; margin: 10px 0; }
        
        .chat-footer { padding: 15px; border-top: 1px solid #eee; }
        .input-group { background: #f8f9fa; border-radius: 30px; padding: 5px 15px; border: 1px solid #ddd; }
        #user-input { border: none; background: transparent; box-shadow: none; }
        .btn-send { border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
        .logo { width: 30px; height: 30px; border-radius: 50%; margin-right: 10px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="../"><img class="logo" src="https://abcsnoob.github.io/assets/image/abcsnoob.webp">Abc's Noob</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../">Trang chủ</a></li>
                    <li class="nav-item"><a class="nav-link" href="../blog">Blog</a></li>
                    <li class="nav-item"><a class="nav-link" href="../apps">Ứng dụng</a></li>
                    <li class="nav-item"><a class="nav-link" href="../contact">Liên hệ</a></li>
                    <li class="nav-item"><a class="nav-link" href="../donate">Donate</a></li>
                    <li class="nav-item"><a class="nav-link active" href="./chat">Chat</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container chat-wrapper">
        <div class="chat-card">
            <div class="chat-header">
                <div><i class="fa-solid fa-robot me-2"></i><span class="fw-medium">Abc's Noob AI</span></div>
                <span class="badge rounded-pill bg-success">Online</span>
            </div>
            
            <div id="chat-window">
                </div>

            <div class="chat-footer">
                <div class="input-group">
                    <input type="text" id="user-input" class="form-control" placeholder="Hỏi gì về Minecraft hoặc Code đi..." autocomplete="off">
                    <button class="btn btn-primary btn-send" onclick="sendMessage()">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>

    <script>
        const WORKER_URL = 'https://abcsnoobai.abcsnoob.workers.dev';
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');

        // Cấu hình Marked để render xuống dòng tốt hơn
        marked.setOptions({
            breaks: true,
            highlight: function(code, lang) {
                return Prism.highlight(code, Prism.languages[lang] || Prism.languages.javascript, lang);
            }
        });

        async function sendMessage() {
            const prompt = userInput.value.trim();
            if (!prompt) return;

            addMessage(prompt, 'user-message');
            userInput.value = '';

            const loadingId = 'load-' + Date.now();
            addMessage('Đang check node...', 'bot-message', loadingId);

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await response.json();
                const rawText = data.text || data.error;
                
                // RENDER MARKDOWN TẠI ĐÂY
                const botMsgDiv = document.getElementById(loadingId);
                botMsgDiv.innerHTML = marked.parse(rawText);
                
                // Highlight lại code sau khi render
                Prism.highlightAllUnder(botMsgDiv);
                
            } catch (err) {
                document.getElementById(loadingId).innerText = "[BUG]: Mất kết nối server rồi ông anh ơi!";
            }
            
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function addMessage(text, className, id = '') {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            if(id) div.id = id;
            
            // User message dùng innerText cho an toàn, Bot dùng innerHTML cho Markdown
            if (className === 'user-message') {
                div.innerText = text;
            } else {
                div.innerHTML = text; 
            }
            
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
