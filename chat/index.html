<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abc's Noob Website | AI Chat</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="/assets/css/style.css">

    <style>
        body { background-color: #f4f7f6; overflow-x: hidden; }
        .logo { width: 30px; height: 30px; border-radius: 50%; margin-right: 10px; }
        .iframe-container {
            width: 100%;
            height: calc(100vh - 56px); /* Full màn hình trừ chiều cao navbar */
            border: none;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a id="notranslate" class="navbar-brand" href="./"><img class="logo" src="/assets/image/abcsnoob.webp">Abc's Noob</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../">Trang chủ</a></li>
                    <li class="nav-item"><a class="nav-link" href="../blogs">Blog</a></li>
                    <li class="nav-item"><a class="nav-link" href="../apps">Ứng dụng</a></li>
                    <li class="nav-item"><a class="nav-link" href="../chat">Chat AI</a></li>
                    <li class="nav-item">
                        <button class="btn btn-sm btn-outline-danger ms-lg-3" onclick="clearIframeChat()">Xóa lịch sử</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <iframe src="chat-iframe.html" id="chatFrame" class="iframe-container"></iframe>

    <script>
        function clearIframeChat() {
            const frame = document.getElementById('chatFrame');
            // Gửi lệnh xóa vào trong iframe
            frame.contentWindow.postMessage('clear-chat', '*');
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
