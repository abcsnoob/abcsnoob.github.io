<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abc's Noob Website | AI Chat</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="/assets/css/style.css">

    <style>
        body { background-color: #f4f7f6; margin: 0; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        .logo { width: 30px; height: 30px; border-radius: 50%; margin-right: 10px; }
        
        /* Layout chính */
        .main-content {
            position: relative;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        .iframe-container {
            width: 100%;
            max-width: 1100px; /* Độ rộng tối ưu */
            height: 82vh;
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background: #fff;
            display: none; /* Ẩn cho đến khi load xong */
            transition: opacity 0.5s ease;
        }

        /* Spinner Overlay */
        .loading-overlay {
            position: absolute;
            top: 40%; /* Căn cao hơn một chút để trông cân đối */
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a id="notranslate" class="navbar-brand" href="../">
                <img class="logo" src="/assets/image/abcsnoob.webp">Abc's Noob
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link active" href="../">Trang chủ</a></li>
                    <li class="nav-item"><a class="nav-link" href="../blogs">Blog</a></li>
                    <li class="nav-item"><a class="nav-link" href="../apps">Ứng dụng</a></li>
                    <li class="nav-item"><a class="nav-link" href="../contact">Liên hệ</a></li>
                    <li class="nav-item"><a class="nav-link" href="../donate">Donate</a></li>
                    <li class="nav-item"><a class="nav-link" href="../chat">Chat AI</a></li>
                    <li class="nav-item ms-lg-3">
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div id="loading-spinner" class="loading-overlay">
            <div class="spinner-border text-primary" style="width: 3.5rem; height: 3.5rem;" role="status"></div>
            <span class="mt-3 text-muted fw-bold">Đang kết nối hệ thống AI...</span>
        </div>

        <iframe id="chatFrame" class="iframe-container"></iframe>
    </div>
<script src="/assets/js/translate.js"></script>
    <script type="module" src="../assets/js/warn.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 1. Chờ 1 giây rồi mới gán URL để tải iframe
        setTimeout(() => {
            const frame = document.getElementById('chatFrame');
            frame.src = "chat-iframe.html"; 
            
            // 2. Khi iframe tải xong nội dung
            frame.onload = () => {
                // Ẩn spinner
                document.getElementById('loading-spinner').style.display = 'none';
                // Hiện iframe mượt mà
                frame.style.display = "block";
                frame.style.opacity = "0";
                setTimeout(() => { frame.style.opacity = "1"; }, 50);
            };
        }, 4000);

        // Hàm gọi lệnh xóa lịch sử bên trong Iframe

    </script>
</body>
</html>
