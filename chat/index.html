<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abc's Noob Website | AI Chat Realtime</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">

    <style>
        body { background-color: #f4f7f6; }
        .chat-wrapper { max-width: 800px; margin: 40px auto; }
        .chat-card { background: #fff; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; height: 75vh; }
        .chat-header { background: #212529; color: white; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background-color: #ffffff; }
        
        .message { max-width: 85%; padding: 12px 16px; border-radius: 20px; font-size: 15px; line-height: 1.6; }
        .user-message { align-self: flex-end; background-color: #0d6efd; color: white; border-bottom-right-radius: 2px; }
        
        .bot-message { align-self: flex-start; background-color: #f1f0f0; color: #333; border-bottom-left-radius: 2px; }
        .bot-message p { margin-bottom: 8px; }
        .bot-message code { background: #e0e0e0; padding: 2px 5px; border-radius: 4px; font-family: monospace; }
        .bot-message pre { background: #2d2d2d !important; color: #ccc; padding: 15px; border-radius: 10px; overflow-x: auto; margin: 10px 0; }
        
        .chat-footer { padding: 15px; border-top: 1px solid #eee; }
        .input-group { background: #f8f9fa; border-radius: 30px; padding: 5px 15px; border: 1px solid #ddd; }
        #user-input { border: none; background: transparent; box-shadow: none; }
        .btn-send { border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
        .logo { width: 30px; height: 30px; border-radius: 50%; margin-right: 10px; }
        
        /* Hiệu ứng nhấp nháy khi đang gõ */
        .typing::after { content: '...'; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a id="notranslate" class="navbar-brand" href="./"><img class="logo" src="/assets/image/abcsnoob.webp">Abc's Noob</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="../">Trang chủ</a></li>
                    <li class="nav-item"><a class="nav-link" href="../blogs">Blog</a></li>
                    <li class="nav-item"><a class="nav-link" href="../apps">Ứng dụng</a></li>
                    <li class="nav-item"><a class="nav-link" href="../contact">Liên hệ</a></li>
                    <li class="nav-item"><a class="nav-link" href="../donate">Donate</a></li>
                    <li class="nav-item"><a class="nav-link" href="../chat">Chat AI</a></li>
                    <button class="btn btn-sm btn-outline-light" onclick="clearChat()">Xóa lịch sử</button>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container chat-wrapper">
        <div class="chat-card">
            <div class="chat-header">
                <div><i id="notranslate" class="fa-solid fa-robot me-2"></i><span class="fw-medium">Abc's Noob AI</span></div>
                <div>
                    <button class="btn btn-sm btn-outline-info me-2" onclick="shareChat()"><i class="fa-solid fa-share-nodes"></i> Chia sẻ</button>
                    <span class="badge rounded-pill bg-success">Online</span>
                </div>
            </div>
            
            <div id="chat-window"></div>

            <div class="chat-footer">
                <div class="input-group">
                    <input type="text" id="user-input" class="form-control" placeholder="Hỏi gì về Minecraft hoặc Code đi..." autocomplete="off">
                    <button class="btn btn-primary btn-send" id="send-btn" onclick="sendMessage()">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
    <script type="module" src="/assets/js/warn.js"></script>
    <script src="/assets/js/translate.js"></script>
    <script>
        // Thay WORKER_URL bằng URL của worker đã deploy
        const WORKER_URL = 'https://abcsnoobai.abcsnoob.workers.dev'; 
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        let isTyping = false;
        let chatHistory = []; // Lịch sử chat sẽ được quản lý bởi Durable Object

        // Lấy chatId từ URL hoặc tạo mới
        const urlParams = new URLSearchParams(window.location.search);
        let currentChatId = urlParams.get('id');
        if (!currentChatId) {
            currentChatId = 'group-' + Date.now().toString(36); // Tạo ID mới nếu không có
            window.history.replaceState(null, null, `?id=${currentChatId}`); // Cập nhật URL
        }

        let ws; // Biến giữ kết nối WebSocket

        // Hàm kết nối WebSocket
        function connectWebSocket() {
            if (ws && ws.readyState === WebSocket.OPEN) return;

            // Xây dựng URL WebSocket từ WORKER_URL
            const wsUrl = WORKER_URL.replace('https://', 'wss://') + `/websocket/${currentChatId}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log("WebSocket connected for chat ID:", currentChatId);
                // Sau khi kết nối, DO sẽ gửi lịch sử chat về
            };

            ws.onmessage = async (event) => {
                const message = JSON.parse(event.data);
                console.log("Received message from WebSocket:", message);

                if (message.type === "history") {
                    // Xóa cửa sổ chat cũ và hiển thị lịch sử từ DO
                    chatWindow.innerHTML = '';
                    chatHistory = message.data;
                    chatHistory.forEach(msg => {
                        renderMessage(msg.parts[0].text, msg.role === 'user' ? 'user-message' : 'bot-message', null, true);
                    });
                } else if (message.type === "chat") {
                    // Nhận tin nhắn chat mới, hiển thị ngay lập tức
                    const msgData = message.data;
                    chatHistory.push(msgData); // Cập nhật lịch sử cục bộ
                    if (msgData.role === 'user') {
                        renderMessage(msgData.parts[0].text, 'user-message');
                    } else {
                        // Hiển thị tin nhắn bot (có hiệu ứng gõ)
                        const loadingId = 'bot-' + Date.now();
                        renderMessage('', 'bot-message', loadingId, false); // Tạo div rỗng để đổ text vào
                        await typeText(document.getElementById(loadingId), msgData.parts[0].text);
                    }
                }
            };

            ws.onclose = () => {
                console.log("WebSocket disconnected. Reconnecting in 5 seconds...");
                setTimeout(connectWebSocket, 5000); // Thử kết nối lại sau 5 giây
            };

            ws.onerror = (error) => {
                console.error("WebSocket error:", error);
                ws.close();
            };
        }

        window.onload = () => {
            connectWebSocket(); // Bắt đầu kết nối WebSocket khi tải trang
        };

        marked.setOptions({ breaks: true });

        async function sendMessage() {
            const prompt = userInput.value.trim();
            if (!prompt || isTyping || ws.readyState !== WebSocket.OPEN) return;

            isTyping = true;
            userInput.value = '';

            // 1. Hiển thị tin nhắn user ngay lập tức (và gửi qua WebSocket)
            const userMessage = { role: "user", parts: [{ text: prompt }] };
            ws.send(JSON.stringify({ type: "chat", data: userMessage })); // Gửi tin nhắn user qua WS
            // renderMessage(prompt, 'user-message'); // Sẽ được render khi nhận broadcast từ WS

            // 2. Gửi prompt đến Gemini API (qua Worker chính) để lấy phản hồi của AI
            const loadingId = 'gemini-thinking-' + Date.now();
            renderMessage('AI đang nghĩ...', 'bot-message', loadingId, false); // Hiển thị trạng thái AI đang nghĩ

            try {
                // Chúng ta sẽ gửi toàn bộ chatHistory hiện tại đến Gemini để duy trì ngữ cảnh
                // Lưu ý: chatHistory cần được cập nhật đúng cách từ WebSocket
                const messagesToSendToGemini = [...chatHistory, userMessage]; 

                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: messagesToSendToGemini, chatId: currentChatId })
                });

                const data = await response.json();
                const botText = data.text || data.error || "Hệ thống AI đang offline mất rồi...";
                
                // Xóa trạng thái "AI đang nghĩ..."
                document.getElementById(loadingId).remove(); 
                
                // 3. Khi nhận được phản hồi từ Gemini, gửi nó qua WebSocket để broadcast
                const botMessage = { role: "model", parts: [{ text: botText }] };
                ws.send(JSON.stringify({ type: "chat", data: botMessage })); // Gửi tin nhắn bot qua WS
                
            } catch (err) {
                console.error("Error calling Gemini API:", err);
                // Xóa trạng thái "AI đang nghĩ..."
                document.getElementById(loadingId).remove();
                renderMessage(`[BUG]: Mất kết nối đến AI server rồi! ${err.message}`, 'bot-message');
            } finally {
                isTyping = false;
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }
        }

        async function typeText(element, text) {
            let i = 0;
            return new Promise((resolve) => {
                function typing() {
                    if (i < text.length) {
                        element.innerHTML = marked.parse(text.substring(0, i + 1));
                        Prism.highlightAllUnder(element);
                        i++;
                        chatWindow.scrollTop = chatWindow.scrollHeight;
                        setTimeout(typing, 15); // Tốc độ gõ 15ms
                    } else {
                        resolve();
                    }
                }
                typing();
            });
        }

        function renderMessage(text, className, id = '', useMarkdown = true) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            if(id) div.id = id;
            
            div.innerHTML = useMarkdown ? marked.parse(text) : text;
            chatWindow.appendChild(div);
            if(useMarkdown) Prism.highlightAllUnder(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return div; // Trả về div để có thể thao tác với nó (ví dụ xóa loading message)
        }

        function clearChat() {
            if(confirm("Xóa hết dấu vết chat à ông anh? Nó sẽ reset cả phòng chat này đó!")) {
                // Để reset chat trên Durable Object, cách đơn giản nhất là đổi `currentChatId`
                // hoặc thêm một API endpoint để DO tự xóa lịch sử của nó.
                // Tạm thời, chúng ta sẽ tạo một chat ID mới.
                window.location.search = `?id=new-group-${Date.now().toString(36)}`;
                // Durable Object cũ với currentChatId trước đó vẫn sẽ tồn tại với lịch sử của nó
                // cho đến khi nó tự động được dọn dẹp (nếu không có ai kết nối).
            }
        }

        function shareChat() {
            const shareUrl = window.location.href;
            navigator.clipboard.writeText(shareUrl);
            alert("Đã chép link chat nhóm/chia sẻ! Gửi cho bạn bè để cùng chat: " + shareUrl);
        }

        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
