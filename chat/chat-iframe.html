<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Noob AI - Neon Responsive</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">

    <style>
        :root {
            --primary: #007bff; --bg: #ffffff; --text: #212529; --msg-bot: #f0f0f0;
            --border: #dee2e6; --header-bg: #212529; --header-text: #ffffff;
            --input-bg: #ffffff; --icon-color: #6c757d;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #171717; --text: #ececec; --msg-bot: #212121;
                --border: #333333; --header-bg: #000000; --header-text: #ffffff;
                --input-bg: #212121; --icon-color: #b4b4b4;
            }
        }

        body, html { margin: 0; padding: 0; height: 100dvh; width: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, sans-serif; overflow: hidden; }

        .app-wrapper { display: flex; flex-direction: column; height: 100%; max-width: 900px; margin: 0 auto; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }

        /* Header PRO: Chống chìm nút */
        .app-header {
            padding: 12px 18px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            background: var(--header-bg); color: var(--header-text);
        }
        .header-tools { display: flex; gap: 20px; align-items: center; }
        .header-tools i { 
            cursor: pointer; font-size: 1.1rem; 
            color: rgba(255, 255, 255, 0.7); /* Màu trắng đục để nổi trên nền tối */
            transition: 0.2s;
        }
        .header-tools i:hover { color: #00d2ff; text-shadow: 0 0 8px rgba(0,210,255,0.5); }

        #chat-window { flex: 1; overflow-y: auto; padding: 20px 15px; display: flex; flex-direction: column; gap: 24px; -webkit-overflow-scrolling: touch; }

        /* Bubble Style */
        .msg-row { display: flex; width: 100%; }
        .user-row { justify-content: flex-end; }
        .msg-bubble { 
            max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 16px; 
            line-height: 1.5; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .user-bubble { background: var(--primary); color: white; border-bottom-right-radius: 4px; }
        .bot-bubble { background: var(--msg-bot); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

        /* Code Block & Copy Button */
        pre { position: relative; background: #0d0d0d !important; border-radius: 10px !important; padding: 15px !important; margin: 15px 0 !important; }
        .copy-btn {
            position: absolute; top: 8px; right: 8px; padding: 4px 10px;
            font-size: 11px; background: #333; color: #fff; border: 1px solid #444;
            border-radius: 5px; cursor: pointer; opacity: 0.8;
        }
        .copy-btn:hover { opacity: 1; background: #444; }

        /* Footer & Input Neon */
        .app-footer { padding: 15px; background: var(--bg); border-top: 1px solid var(--border); }
        .input-box {
            background: var(--input-bg); border: 1.5px solid var(--border);
            border-radius: 24px; padding: 8px 16px; display: flex; align-items: flex-end; gap: 10px;
        }
        .input-box:focus-within { border-color: var(--primary); box-shadow: 0 0 10px rgba(0,123,255,0.2); }

        #user-input {
            flex: 1; border: none; background: transparent; color: var(--text);
            outline: none; padding: 8px 0; max-height: 180px; font-size: 16px; resize: none;
        }

        .icon-btn { background: none; border: none; padding: 5px; color: var(--icon-color); cursor: pointer; transition: 0.2s; }
        .icon-btn:hover { color: var(--primary); }

        .send-btn {
            background: var(--primary); color: white; width: 36px; height: 36px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; border: none;
        }
        .send-btn:disabled { background: #555; opacity: 0.5; }

        /* Preview Image */
        .img-strip { display: none; position: relative; width: 65px; height: 65px; margin-bottom: 10px; margin-left: 10px; }
        .img-strip img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; border: 1px solid var(--primary); }
        .img-del {
            position: absolute; top: -8px; right: -8px; background: #ff4d4d; color: white;
            border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
            font-size: 12px; cursor: pointer; border: 2px solid var(--bg);
        }

        /* Chips */
        .welcome-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 25px; }
        .chip { 
            padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border);
            font-size: 14px; cursor: pointer; background: var(--msg-bot);
        }
        .chip:hover { border-color: var(--primary); color: var(--primary); }
    </style>
</head>
<body>

<div id="iframe-loader" style="position:fixed; inset:0; background:var(--bg); z-index:1000; display:flex; align-items:center; justify-content:center;">
    <div class="spinner-border text-primary"></div>
</div>

<div class="app-wrapper">
    <header class="app-header">
        <div class="fw-bold fs-5"><i class="fa-solid fa-wand-sparkles me-2"></i>Abc's Noob AI</div>
        <div class="header-tools">
            <i class="fa-solid fa-cloud-arrow-down" onclick="importShare()" title="Nhập ID"></i>
            <i class="fa-solid fa-share-nodes" onclick="shareChat()" title="Chia sẻ"></i>
            <i class="fa-solid fa-trash-can" onclick="clearChat()" title="Xóa lịch sử"></i>
        </div>
    </header>

    <main id="chat-window">
        <div id="welcome" class="my-auto text-center px-4">
            <h2 class="fw-bold">Abc's Noob AI</h2>
            <p class="text-muted">Giao diện chuẩn AI, hỗ trợ ảnh & mã nguồn.</p>
            <div class="welcome-chips">
                <div class="chip" onclick="quick('Cách farm kim cương Minecraft')">Farm Kim Cương</div>
                <div class="chip" onclick="quick('Viết code Website bán hàng đơn giản')">Code Website</div>
                <div class="chip" onclick="quick('Bitcoin có tăng được 100k không?')">Dự đoán BTC</div>
            </div>
        </div>
    </main>

    <footer class="app-footer">
        <div class="img-strip" id="p-strip">
            <img id="p-img" src="">
            <div class="img-del" onclick="cancelImg()">×</div>
        </div>
        
        <div class="input-box">
            <button class="icon-btn" onclick="document.getElementById('file-in').click()">
                <i class="fa-solid fa-circle-plus fs-4"></i>
            </button>
            <input type="file" id="file-in" hidden accept="image/*" onchange="handleFile(this)">
            
            <textarea id="user-input" rows="1" placeholder="Hỏi tôi bất cứ điều gì..." oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
            
            <button id="stop-btn" class="icon-btn text-danger" style="display:none" onclick="abortTyping=true">
                <i class="fa-solid fa-circle-stop fs-4"></i>
            </button>
            <button class="send-btn" id="send-btn" onclick="send()">
                <i class="fa-solid fa-arrow-up"></i>
            </button>
        </div>
        <p class="text-center text-muted small mt-2">Abc's Noob AI có thể mắc sai lầm. Hãy kiểm tra thông tin quan trọng.</p>
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

<script>
    const WORKER_URL = 'https://abcsnoobai.abcsnoob.workers.dev';
    const chatWindow = document.getElementById('chat-window');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const stopBtn = document.getElementById('stop-btn');
    let isTyping = false, abortTyping = false, selectedImageData = null;
    let chatHistory = JSON.parse(localStorage.getItem('abc_chat_pro')) || [];

    // --- UTILS ---
    function autoResize(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }

    function quickChat(txt) { userInput.value = txt; sendMessage(); }

    function handleFile(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            selectedImageData = e.target.result;
            document.getElementById('image-preview-strip').style.display = 'block';
            document.getElementById('preview-img').src = selectedImageData;
        };
        reader.readAsDataURL(file);
    }
    function cancelImage() { selectedImageData = null; document.getElementById('image-preview-strip').style.display = 'none'; }

    // --- RENDER ---
    function renderMessage(text, role, id = null, imgSrc = null) {
        if (document.getElementById('welcome-screen')) document.getElementById('welcome-screen').style.display = 'none';
        
        const container = document.createElement('div');
        container.className = role === 'user' ? 'message user-message-container' : 'message';
        
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.innerHTML = role === 'user' ? '<i class="fa-solid fa-circle-user fs-4 text-primary"></i>' : '<i class="fa-solid fa-robot fs-4 text-success"></i>';
        
        const content = document.createElement('div');
        content.className = role === 'user' ? 'user-message' : 'msg-content bot-message';
        if (id) content.id = id;

        if (imgSrc) {
            content.innerHTML += `<img src="${imgSrc}" style="max-width:200px; border-radius:8px; display:block; margin-bottom:10px; cursor:zoom-in" onclick="window.open(this.src)">`;
        }
        
        const textSpan = document.createElement('div');
        textSpan.innerHTML = marked.parse(text || "");
        content.appendChild(textSpan);
        
        container.appendChild(avatar);
        container.appendChild(content);
        chatWindow.appendChild(container);
        chatWindow.scrollTop = chatWindow.scrollHeight;
        
        addCopyButtons(content);
        Prism.highlightAllUnder(content);
    }

    function addCopyButtons(parent) {
        parent.querySelectorAll('pre').forEach(block => {
            if (block.querySelector('.copy-code')) return;
            const btn = document.createElement('button');
            btn.className = 'copy-code';
            btn.innerText = 'Copy';
            btn.onclick = () => {
                navigator.clipboard.writeText(block.innerText.replace('Copy', ''));
                btn.innerText = 'Done!';
                setTimeout(() => btn.innerText = 'Copy', 2000);
            };
            block.appendChild(btn);
        });
    }

    // --- CORE ---
    async function sendMessage() {
        const text = userInput.value.trim();
        if ((!text && !selectedImageData) || isTyping) return;

        const currentImg = selectedImageData;
        renderMessage(text, 'user', null, currentImg);
        
        let entry = { role: "user", parts: [] };
        if (text) entry.parts.push({ text: text });
        if (currentImg) entry.parts.push({ inline_data: { mime_type: "image/jpeg", data: currentImg } });
        chatHistory.push(entry);

        userInput.value = ''; userInput.style.height = 'auto'; cancelImage();
        isTyping = true; sendBtn.disabled = true; stopBtn.style.display = 'inline-block';

        const botMsgId = 'bot-' + Date.now();
        renderMessage('', 'model', botMsgId);
        const botEl = document.getElementById(botMsgId).querySelector('div');

        // Gửi AI (chỉ gửi ảnh cuối để tiết kiệm)
        const cleanHistory = chatHistory.map((m, i) => (i === chatHistory.length - 1) ? m : { role: m.role, parts: m.parts.filter(p => p.text) });

        try {
            const res = await fetch(WORKER_URL, { method: 'POST', body: JSON.stringify({ messages: cleanHistory }) });
            const data = await res.json();
            
            let i = 0; abortTyping = false;
            const fullText = data.text;
            function type() {
                if (i < fullText.length && !abortTyping) {
                    i += 8; botEl.innerHTML = marked.parse(fullText.substring(0, i));
                    chatWindow.scrollTop = chatWindow.scrollHeight;
                    setTimeout(type, 10);
                } else {
                    botEl.innerHTML = marked.parse(fullText);
                    addCopyButtons(botEl.parentElement);
                    Prism.highlightAllUnder(botEl.parentElement);
                    chatHistory.push({ role: "model", parts: [{ text: fullText }] });
                    localStorage.setItem('abc_chat_pro', JSON.stringify(chatHistory.slice(-20)));
                    isTyping = false; sendBtn.disabled = false; stopBtn.style.display = 'none';
                }
            }
            type();
        } catch (e) { botEl.innerText = "Lỗi kết nối!"; isTyping = false; sendBtn.disabled = false; }
    }

    // --- DATA ---
    async function shareChat() {
        Swal.fire({ title: 'Đang tạo bản lưu...', didOpen: () => Swal.showLoading() });
        const res = await fetch(WORKER_URL, { method: 'POST', body: JSON.stringify({ action: 'share', data: chatHistory }) });
        const result = await res.json();
        const url = `${window.location.origin}${window.location.pathname}?shareId=${result.shareId}`;
        navigator.clipboard.writeText(url);
        Swal.fire('Thành công!', 'Link chia sẻ (kèm ảnh) đã được copy!', 'success');
    }

    async function importShare() {
        const { value: id } = await Swal.fire({ title: 'Nhập ID Gist', input: 'text' });
        if (id) {
            const res = await fetch(WORKER_URL, { method: 'POST', body: JSON.stringify({ action: 'get_share', shareId: id }) });
            const result = await res.json();
            if (result.success) {
                chatHistory = result.data;
                localStorage.setItem('abc_chat_pro', JSON.stringify(chatHistory));
                location.reload();
            }
        }
    }

    function clearChat() { if (confirm("Xóa lịch sử?")) { localStorage.clear(); location.reload(); } }

    window.onload = async () => {
        const sId = new URLSearchParams(window.location.search).get('shareId');
        if (sId) {
            const res = await fetch(WORKER_URL, { method: 'POST', body: JSON.stringify({ action: 'get_share', shareId: sId }) });
            const r = await res.json();
            if (r.success) r.data.forEach(m => renderMessage(m.parts.find(p=>p.text)?.text, m.role === 'user' ? 'user' : 'model', null, m.parts.find(p=>p.inline_data)?.inline_data.data));
        } else {
            chatHistory.forEach(m => renderMessage(m.parts.find(p=>p.text)?.text, m.role === 'user' ? 'user' : 'model', null, m.parts.find(p=>p.inline_data)?.inline_data.data));
        }
        document.getElementById('iframe-loader').remove();
    };

    userInput.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } };
</script>
</body>
</html>
