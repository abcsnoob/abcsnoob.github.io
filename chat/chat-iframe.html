<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Noob AI Pro | Premium Interface</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

    <style>
        :root {
            --primary: #00d2ff; --primary-deep: #3a7bd5;
            --bg-dark: #0b0e11; --sidebar-bg: #15191e;
            --card-bg: #1e2329; --text-main: #eaecef;
            --border-color: #2b3139; --input-focus: #3a7bd5;
        }

        body { background: var(--bg-dark); color: var(--text-main); font-family: 'Inter', sans-serif; height: 100dvh; overflow: hidden; display: flex; }

        /* Sidebar - Chỉ hiện trên máy tính, mobile dùng menu drawer */
        #sidebar {
    width: 280px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    transition: transform 0.3s ease, visibility 0.3s; /* Hiệu ứng trượt */
    z-index: 1001;
}

@media (max-width: 768px) {
    #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        transform: translateX(-100%); /* Mặc định đẩy ra ngoài màn hình bên trái */
        visibility: hidden;
    }
    /* Khi có class 'active' thì trượt vào */
    #sidebar.active {
        transform: translateX(0);
        visibility: visible;
        display: flex !important;
    }
}
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border-color); }
        .history-list { flex: 1; overflow-y: auto; padding: 10px; }
        .history-item { padding: 12px; border-radius: 8px; margin-bottom: 5px; cursor: pointer; transition: 0.2s; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-item:hover { background: var(--card-bg); color: var(--primary); }

        /* Main Chat Area */
        #main-chat { flex: 1; display: flex; flex-direction: column; position: relative; }
        .top-nav { height: 60px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: rgba(11, 14, 17, 0.8); backdrop-filter: blur(10px); z-index: 100; }

        #chat-window { flex: 1; overflow-y: auto; padding: 30px 10% 120px 10%; scroll-behavior: smooth; }
        
        /* Message Styling */
        .msg-group { margin-bottom: 30px; opacity: 0; transform: translateY(20px); animation: fadeInUp 0.4s forwards; }
        .msg-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-weight: 600; font-size: 13px; color: #848e9c; }
        .msg-content { line-height: 1.7; font-size: 15.5px; word-break: break-word; }
        .msg-content blockquote { border-left: 4px solid var(--primary); padding-left: 15px; color: #b7bdc6; }
        
        /* Input Zone */
        .input-container { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px 10%; background: linear-gradient(transparent, var(--bg-dark) 30%); }
        .input-wrapper { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 12px 18px; display: flex; align-items: flex-end; gap: 12px; transition: 0.3s; }
        .input-wrapper:focus-within { border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 210, 255, 0.2); }
        
        textarea#user-input { flex: 1; background: transparent; border: none; color: white; outline: none; resize: none; max-height: 200px; padding: 5px 0; font-size: 15px; }
        
        /* Utils */
        .action-btn { background: none; border: none; color: #848e9c; cursor: pointer; transition: 0.2s; padding: 8px; border-radius: 8px; }
        .action-btn:hover { color: var(--primary); background: rgba(255,255,255,0.05); }
        .btn-send { background: var(--primary); color: #000; font-weight: bold; border-radius: 10px; padding: 8px 15px; }
        
        #image-preview { display: none; padding: 10px; border-top: 1px solid var(--border-color); }
        .preview-img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; position: relative; }

        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        /* Hiệu ứng con trỏ nhấp nháy */
.typing-cursor::after {
    content: "|";
    animation: blink 0.7s infinite;
    margin-left: 2px;
    color: var(--primary);
    font-weight: bold;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
}
    </style>
</head>
<body>

    <aside id="sidebar">
        <div class="d-flex justify-content-end p-2 d-md-none">
        <button class="action-btn" onclick="toggleSidebar()"><i class="fa-solid fa-xmark fs-4"></i></button>
    </div>
        <div class="sidebar-header">
            <button class="btn btn-outline-primary w-100 mb-3" onclick="newChat()">
                <i class="fa-solid fa-plus me-2"></i> Đoạn chat mới
            </button>
        </div>
        <div class="history-list" id="history-container">
            </div>
        <div class="p-3 border-top border-secondary">
            <div id="user-info" class="small text-secondary mb-2">Chưa đăng nhập</div>
            <button class="action-btn w-100 text-start" onclick="authUI()">
                <i class="fa-solid fa-right-to-bracket me-2"></i> <span id="auth-text">Đăng nhập</span>
            </button>
        </div>
    </aside>

    <main id="main-chat">
        <nav class="top-nav">
            <div class="d-flex align-items-center gap-3">
                <i class="fa-solid fa-bars action-btn d-md-none" onclick="toggleSidebar()"></i>
                <span class="fw-bold fs-5">Noob AI <span class="badge bg-primary ms-1" style="font-size: 10px;">PRO</span></span>
            </div>
            <div class="d-flex gap-2">
                <button class="action-btn" onclick="groupUI()" title="Nhóm"><i class="fa-solid fa-users-rectangle"></i></button>
                <button class="action-btn" onclick="shareUI()" title="Chia sẻ"><i class="fa-solid fa-share-nodes"></i></button>
                <button class="action-btn" onclick="clearChat()" title="Xóa"><i class="fa-solid fa-trash"></i></button>
            </div>
        </nav>

        <section id="chat-window"></section>

        <div class="input-container">
            <div id="image-preview" class="mb-2">
                <div class="preview-img">
                    <img id="p-img" src="" style="width:100%; height:100%; border-radius:8px;">
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" onclick="cancelImg()" style="cursor:pointer">×</span>
                </div>
            </div>
            <div class="input-wrapper">
                <input type="file" id="file-in" hidden accept="image/*" onchange="handleFile(this)">
                <button class="action-btn" onclick="document.getElementById('file-in').click()"><i class="fa-solid fa-paperclip"></i></button>
                <textarea id="user-input" rows="1" placeholder="Nhập câu hỏi tại đây... (Shift + Enter để xuống dòng)"></textarea>
                <button class="btn-send" onclick="send()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
            <p class="text-center text-secondary mt-2" style="font-size: 11px;">Noob AI có thể mắc sai lầm. Hãy kiểm tra lại các thông tin quan trọng.</p>
        </div>
    </main>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script>
/** * NOOB AI PRO - CORE JAVASCRIPT SYSTEM
 * Version: 2.0 (Premium)
 * Features: Auth, D1 Database, AI Vision, OTP Verification, Group Chat
 */

const WORKER_URL = 'https://abcsnoobai.abcsnoob.workers.dev';
let token = localStorage.getItem('token');
let chatHistory = JSON.parse(localStorage.getItem('abc_chat_pro')) || [];
let selectedImageData = null;
let isTyping = false;
let user_lang = localStorage.getItem('user_lang') || 'auto';
let allChats = JSON.parse(localStorage.getItem('all_chats_list')) || [];
let currentChatId = null;
let skipTyping = false; 

// 1. CẤU HÌNH MARKED (Hiển thị Markdown & Code Highlight)
marked.setOptions({
    highlight: function(code, lang) {
        if (Prism.languages[lang]) {
            return Prism.highlight(code, Prism.languages[lang], lang);
        }
        return code;
    },
    breaks: true,
    gfm: true
});
async function typeEffect(element, text) {
    let i = 0;
    let currentText = "";
    skipTyping = false; 
    element.classList.add('typing-cursor');
    
    return new Promise((resolve) => {
        function typing() {
            if (skipTyping) { // Nhấn ESC sẽ nhả hết text
                element.innerHTML = marked.parse(text);
                element.classList.remove('typing-cursor');
                resolve(); return;
            }
            if (i < text.length) {
                currentText += text.charAt(i);
                element.innerHTML = marked.parse(currentText); // Vừa đánh máy vừa Markdown
                i++;
                setTimeout(typing, 10);
            } else {
                element.classList.remove('typing-cursor');
                resolve();
            }
        }
        typing();
    });
}
    // 1. Lưu chat hiện tại vào danh sách folder
function saveCurrentChat() {
    if (chatHistory.length === 0) return;

    if (!currentChatId) {
        // Nếu là chat mới, tạo ID và lấy tên từ tin nhắn đầu của User
        currentChatId = Date.now().toString();
        const firstMsg = chatHistory.find(m => m.role === 'user')?.parts[0]?.text || "Cuộc trò chuyện mới";
        const chatName = firstMsg.length > 30 ? firstMsg.substring(0, 30) + "..." : firstMsg;
        
        allChats.unshift({
            id: currentChatId,
            name: chatName,
            history: chatHistory
        });
    } else {
        // Cập nhật history cho folder hiện tại
        const index = allChats.findIndex(c => c.id === currentChatId);
        if (index !== -1) allChats[index].history = JSON.parse(JSON.stringify(chatHistory));
    }

    localStorage.setItem('all_chats_list', JSON.stringify(allChats));
    renderHistorySidebar();
}

// 2. Tải nội dung một cuộc chat khi click sidebar
async function loadChat(id) {
    const chat = allChats.find(c => c.id === id);
    if (!chat) return;

    currentChatId = id;
    chatHistory = JSON.parse(JSON.stringify(chat.history));
    
    const win = document.getElementById('chat-window');
    win.innerHTML = '';
    
    // Hiển thị lại toàn bộ nội dung với Markdown (không đánh máy lại)
    for (const m of chatHistory) {
        const txt = m.parts.find(p => p.text)?.text;
        // Tham số 'true' để báo đây là history, hiện ngay lập tức
        await createMsgUI(txt, m.role, null, true); 
    }
}

// 3. Xóa một folder chat
async function deleteChat(id, event) {
    event.stopPropagation(); // Ngăn không cho loadChat chạy khi bấm xóa
    const result = await Swal.fire({
        title: "Xóa đoạn chat?",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: "Xóa",
        confirmButtonColor: '#d33'
    });
    
    if (result.isConfirmed) {
        allChats = allChats.filter(c => c.id !== id);
        if (currentChatId === id) newChat();
        localStorage.setItem('all_chats_list', JSON.stringify(allChats));
        renderHistorySidebar();
    }
}
// Hàm dịch trung tâm
async function gt(text) {
    if (!text || user_lang === 'vi' || text.length < 2 || text.includes('Noob AI')) return text;
    try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=vi&tl=${user_lang}&dt=t&q=${encodeURIComponent(text)}`);
        const data = await res.json();
        return data[0][0][0];
    } catch (e) { return text; }
}

// Hàm hiện/ẩn thông báo đang dịch
function showToast(show) {
    let toast = document.getElementById('trans-toast');
    if (!toast) {
        toast = document.createElement('div');
        toast.id = 'trans-toast';
        toast.style = "position:fixed;bottom:100px;right:20px;background:rgba(0,0,0,0.8);color:#00d2ff;padding:6px 15px;border-radius:20px;font-size:12px;z-index:10001;display:none;border:1px solid #00d2ff;";
        toast.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>Translating...';
        document.body.appendChild(toast);
    }
    toast.style.display = show ? 'block' : 'none';
}
function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    if (!sidebar) return;

    if (window.innerWidth <= 768) {
        const isActive = sidebar.classList.contains('active');
        
        if (isActive) {
            // ĐANG MỞ -> ĐÓNG LẠI
            sidebar.classList.remove('active');
            removeOverlay();
        } else {
            // ĐANG ĐÓNG -> MỞ RA
            sidebar.classList.add('active');
            createOverlay();
        }
    } else {
        // Trên Desktop: Ẩn/Hiện bình thường
        sidebar.classList.toggle('d-none');
    }
}
const observer = new MutationObserver(async (mutations) => {
    if (user_lang === 'vi') return;
    for (let m of mutations) {
        for (let node of m.addedNodes) {
            // Nếu phát hiện hộp thoại mới (Swal hoặc Modal)
            if (node.nodeType === 1 && (node.classList.contains('swal2-container') || node.tagName === 'DIV')) {
                const items = node.querySelectorAll('.swal2-title, .swal2-html-container, .swal2-confirm, .swal2-cancel, .swal2-deny, input, button');
                if (items.length > 0) {
                    showToast(true);
                    await Promise.all(Array.from(items).map(async (el) => {
                        if (el.placeholder) el.placeholder = await gt(el.placeholder);
                        if (el.innerText && !el.querySelector('*')) el.innerText = await gt(el.innerText);
                    }));
                    showToast(false);
                }
            }
        }
    }
});
observer.observe(document.body, { childList: true, subtree: true });
function createOverlay() {
    if (document.getElementById('sidebar-overlay')) return;
    const overlay = document.createElement('div');
    overlay.id = 'sidebar-overlay';
    // Style trực tiếp để đảm bảo luôn nằm dưới Sidebar (1000) và trên Chat (999)
    overlay.style = "position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; cursor:pointer;";
    
    // Bấm vào overlay cũng phải đóng sidebar và xóa chính nó
    overlay.onclick = toggleSidebar; 
    document.body.appendChild(overlay);
}

function removeOverlay() {
    const overlay = document.getElementById('sidebar-overlay');
    if (overlay) {
        overlay.remove();
    }
}

// 2. XỬ LÝ ẢNH (VISION)
function handleFile(input) {
    const file = input.files[0];
    if (!file) return;
    
    // Kiểm tra dung lượng (giới hạn 4MB cho Gemini)
    if (file.size > 4 * 1024 * 1024) {
        Swal.fire('Lỗi', 'Ảnh quá lớn (tối đa 4MB)', 'error');
        return;
    }

    const reader = new FileReader();
    reader.onload = (e) => {
        selectedImageData = e.target.result;
        document.getElementById('image-preview').style.display = 'block';
        document.getElementById('p-img').src = selectedImageData;
    };
    reader.readAsDataURL(file);
}

function cancelImg() {
    selectedImageData = null;
    document.getElementById('image-preview').style.display = 'none';
    document.getElementById('file-in').value = '';
}

// 3. RENDER TIN NHẮN LÊN GIAO DIỆN
async function createMsgUI(text, role, image = null, isHistory = false) {
    const win = document.getElementById('chat-window');
    const div = document.createElement('div');
    div.className = 'msg-group notranslate mb-4';
    
    const isUser = (role === 'user');
    const color = isUser ? 'var(--primary)' : '#00ff88';

    div.innerHTML = `
        <div class="msg-header" style="color:${color}; font-weight:bold;">
            <i class="fa-solid ${isUser ? 'fa-user' : 'fa-robot'}"></i> ${isUser ? 'YOU' : "ABC'S NOOB"}
        </div>
        ${image ? `<img src="${image}" class="img-fluid rounded mb-2" style="max-width:200px;">` : ''}
        <div class="msg-content"></div>
    `;
    
    win.appendChild(div);
    const contentDiv = div.querySelector('.msg-content');

    if (isHistory || isUser) {
        contentDiv.innerHTML = marked.parse(text || "");
        if (window.Prism) Prism.highlightAllUnder(contentDiv);
    } else {
        await typeEffect(contentDiv, text || "");
    }
    win.scrollTo({ top: win.scrollHeight, behavior: 'smooth' });
}

// 4. LOGIC GỬI TIN NHẮN & GỌI AI
async function send() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if ((!text && !selectedImageData) || isTyping) return;

    const currentImg = selectedImageData;
    createMsgUI(text, 'user', currentImg);
    
    chatHistory.push({ role: "user", parts: [{ text: text || "Analyze this content" }] });
    input.value = ''; 
    input.style.height = 'auto';
    if (window.cancelImg) cancelImg();
    isTyping = true;

    // 1. Tạo node Loading trước
    const chatWindow = document.getElementById('chat-window');
    const loadingDiv = document.createElement('div');
    const loadingId = 'loading-' + Date.now();
    loadingDiv.id = loadingId;
    loadingDiv.className = 'msg-group notranslate mb-4';
    
    // 2. Dịch văn bản loading
    const loadingText = await gt("Noob AI đang suy nghĩ...");
    loadingDiv.innerHTML = `<div class="msg-header" style="color:#00ff88"><i class="fa-solid fa-circle-notch fa-spin"></i> ${loadingText}</div>`;
    
    // 3. Đưa vào giao diện
    chatWindow.appendChild(loadingDiv);
    chatWindow.scrollTo({ top: chatWindow.scrollHeight, behavior: 'smooth' });

    try {
        const response = await fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                action: 'chat_ai', 
                messages: chatHistory.slice(-12),
                user_lang: user_lang 
            })
        });

        const data = await response.json();
        
        // 4. KIỂM TRA TRƯỚC KHI TÁC ĐỘNG VÀO DOM
        const loaderEl = document.getElementById(loadingId);
        
if (data.success) {
    // Chỗ này hàm createMsgUI giờ đã có async/await nên sẽ chạy hiệu ứng đánh máy
await createMsgUI(data.text, 'model', null, false); 
    chatHistory.push({ role: "model", parts: [{ text: data.text }] });
    saveToLocal();
} else {
            throw new Error(data.error || "API Error");
        }
    } catch (error) {
        // 5. XỬ LÝ LỖI AN TOÀN
        const loaderEl = document.getElementById(loadingId);
        if (loaderEl) {
            const errorText = await gt("Lỗi");
            loaderEl.innerHTML = `<div class="text-danger fw-bold"><i class="fa-solid fa-triangle-exclamation"></i> ${errorText}: ${error.message}</div>`;
        }
        console.error("Chat Error:", error);
    } finally {
        isTyping = false;
    }
}

// 5. HỆ THỐNG XÁC THỰC (SỬA LỖI SWAL)
async function authUI() {
    if (token) {
        const result = await Swal.fire({
            title: await gt('Tài khoản'),
            text: `${await gt('Bạn đang đăng nhập với')}: ${atob(token)}`,
            icon: 'info',
            showCancelButton: true,
            confirmButtonText: await gt('Đăng xuất'),
            cancelButtonText: await gt('Đóng'),
            confirmButtonColor: '#d33'
        });
        if (result.isConfirmed) {
            localStorage.removeItem('token');
            location.reload();
        }
        return;
    }

    const { value: form, isConfirmed, isDenied } = await Swal.fire({
        title: await gt('Đăng nhập / Đăng ký'),
        html: `
            <input id="swal-email" class="swal2-input" placeholder="${await gt('Email')}">
            <input id="swal-pass" type="password" class="swal2-input" placeholder="${await gt('Mật khẩu')}">
        `,
        showDenyButton: true,
        confirmButtonText: await gt('Đăng nhập'),
        denyButtonText: await gt('Tạo tài khoản mới'),
        preConfirm: () => {
            const email = document.getElementById('swal-email').value;
            const password = document.getElementById('swal-pass').value;
            if (!email || !password) return Swal.showValidationMessage('Vui lòng nhập đủ thông tin');
            return { email, password };
        }
    });

    if (!form) return;

    // Xác định action dựa trên nút bấm (Confirm = login, Deny = register)
    const action = isConfirmed ? 'login' : 'register';
    Swal.showLoading();

    try {
        const res = await fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }, // Fix lỗi Content-Type
            body: JSON.stringify({ action, email: form.email, password: form.password })
        });
        const data = await res.json();

        if (data.success) {
            if (action === 'register') {
                // Hiện "Check OTP trong email đi ông giáo!" từ server
                Swal.fire('Thành công', data.message, 'success')
                    .then(() => verifyOTPUI(form.email));
            } else {
                localStorage.setItem('token', data.token);
                location.reload();
            }
        } else if (data.needs_verify) {
            verifyOTPUI(form.email);
        } else {
            // Hiện "Email này đã được deploy (tồn tại)..." từ server
            Swal.fire('Thất bại', data.error || 'Lỗi không xác định', 'error');
        }
    } catch (e) {
        Swal.fire('Lỗi kết nối', 'Server lag rồi ông giáo ơi: ' + e.message, 'error');
    }
}

async function verifyOTPUI(email) {
    const { value: otp } = await Swal.fire({
        title: await gt('Xác minh OTP'),
        text: `${await gt('Nhập mã 6 số đã gửi tới')} ${email}`,
        input: 'text',
        inputAttributes: { maxlength: 6 },
        showCancelButton: true,
        allowOutsideClick: false
    });

    if (!otp) return;

    Swal.showLoading();
    try {
        const res = await fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }, // Phải có header JSON
            body: JSON.stringify({ action: 'verify_otp', email, otp })
        });
        const data = await res.json();

        if (data.success) {
            localStorage.setItem('token', data.token);
            Swal.fire('Tuyệt vời!', 'Tài khoản đã được kích hoạt thành công.', 'success')
                .then(() => location.reload());
        } else {
            // Hiện lỗi sai OTP từ Backend
            Swal.fire('Thất bại', data.error || 'Sai mã OTP', 'error')
                .then(() => verifyOTPUI(email)); // Cho nhập lại
        }
    } catch (e) {
        Swal.fire('Lỗi', 'Không thể xác minh OTP', 'error');
    }
}

// 6. CHIA SẺ & NHÓM (D1)
async function shareUI() {
    if (!token) return authUI();
    Swal.showLoading();
    
    try {
        const res = await fetch(WORKER_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'share', token, data: chatHistory })
        });
        const d = await res.json();
        
        if (d.shareId) {
            navigator.clipboard.writeText(d.shareId);
            Swal.fire(
                await gt('Đã tạo liên kết'), 
                `${await gt('Mã ID')}: ${d.shareId}\n(${await gt('Đã chép vào bộ nhớ tạm')})`, 
                'success'
            );
        }
    } catch (e) {
        Swal.fire('Error', await gt('Lỗi kết nối'), 'error');
    }
}

async function groupUI() {
    if (!token) return authUI();
    const { value: mode } = await Swal.fire({
        title: await gt('Nhóm Chat D1'),
        showDenyButton: true,
        confirmButtonText: await gt('Vào nhóm'),
        denyButtonText: await gt('Tạo nhóm mới')
    });
    if (mode === undefined) return;

    const { value: val } = await Swal.fire({
        title: mode ? await gt('Nhập mã nhóm') : await gt('Tên nhóm của bạn'),
        input: 'text'
    });
    if (!val) return;

    const res = await fetch(WORKER_URL, {
        method: 'POST',
        body: JSON.stringify({ 
            action: mode ? 'join_group' : 'create_group', 
            token, 
            [mode ? 'groupId' : 'groupName']: val 
        })
    });
    const d = await res.json();
    if (d.success) {
        Swal.fire('Xong!', d.groupId ? `Mã nhóm của bạn: ${d.groupId}` : `Bạn đã vào nhóm: ${d.message}`, 'success');
    }
}

// 7. QUẢN LÝ LỊCH SỬ LOCAL
function saveToLocal() {
    localStorage.setItem('abc_chat_pro', JSON.stringify(chatHistory.slice(-30)));
    renderHistorySidebar();
}

function renderHistorySidebar() {
    const container = document.getElementById('history-container');
    if (!container) return;
    container.innerHTML = '';
    
    // Chỉ lấy tin nhắn người dùng để làm tiêu đề
    const titles = chatHistory.filter(m => m.role === 'user').reverse();
    titles.forEach(msg => {
        const item = document.createElement('div');
        item.className = 'history-item';
        const text = msg.parts.find(p => p.text)?.text || "Tin nhắn ảnh";
        item.innerHTML = `<i class="fa-regular fa-message me-2"></i> ${text.substring(0, 25)}...`;
        container.appendChild(item);
    });
}

async function clearChat() {
    const result = await Swal.fire({
        title: await gt("Xóa lịch sử?"),
        text: await gt("Hành động này sẽ xóa toàn bộ tin nhắn hiện tại."),
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: await gt("Xóa sạch"),
        cancelButtonText: await gt("Hủy bỏ"),
        confirmButtonColor: '#d33'
    });
    
    if (result.isConfirmed) {
        chatHistory = [];
        localStorage.removeItem('abc_chat_pro');
        document.getElementById('chat-window').innerHTML = '';
        renderHistorySidebar();
    }
}

// 8. KHỞI TẠO HỆ THỐNG KHI LOAD TRANG
// Sử dụng DOMContentLoaded thay vì window.onload để tránh ghi đè
window.addEventListener('DOMContentLoaded', async () => {
    // 1. Khởi tạo ngôn ngữ
    if (!localStorage.getItem('user_lang') || localStorage.getItem('user_lang') === 'auto') {
        const browserLang = navigator.language.split('-')[0];
        localStorage.setItem('user_lang', browserLang);
    }
    const user_lang = localStorage.getItem('user_lang');

    // 2. Khởi tạo Sidebar và Auth UI
    renderHistorySidebar();
    initAuthUI(user_lang);

    // 3. Render tin nhắn cũ (phiên hiện tại)
    const win = document.getElementById('chat-window');
    if (win && chatHistory?.length > 0) {
        win.innerHTML = '';
        for (const m of chatHistory) {
            const txt = m.parts.find(p => p.text)?.text;
            await createMsgUI(txt, m.role, null, true); 
        }
    }

    // 4. Dịch UI nếu cần (Tránh dịch nếu là tiếng Việt)
    if (user_lang !== 'vi') {
        await translateUI(user_lang); 
    }

    // 5. Đăng ký sự kiện phím tắt toàn cục
    window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') skipTyping = true;
    });

    console.log("Hệ thống đã sẵn sàng! #FreeAbcsnoobhelper");
});

// Tách hàm Auth để code sạch hơn
function initAuthUI(lang) {
    const token = localStorage.getItem('token');
    if (!token) return;

    try {
        // Giả sử token là email mã hóa hoặc JWT đơn giản
        const email = atob(token.split('.')[0]); 
        const userInfo = document.getElementById('user-info');
        if (userInfo) userInfo.innerText = email;

        const authBtnText = document.getElementById('auth-text');
        if (authBtnText) {
            authBtnText.innerText = (lang === 'vi') ? 'Đăng xuất' : 'Logout';
        }
    } catch (e) {
        localStorage.removeItem('token');
    }
}

async function translateUI(lang) {
    const elements = Array.from(document.querySelectorAll('button, span, div.small, textarea, .fw-bold'))
        .filter(el => {
            // Loại bỏ các vùng không cần dịch
            if (el.closest('#chat-window') || el.classList.contains('fa-solid') || el.classList.contains('fa-regular')) return false;
            let text = (el.innerText || el.placeholder || "").trim();
            return text.length > 1 && !text.includes('Noob AI');
        });

    if (elements.length === 0) return;

    // Gộp tất cả text thành một chuỗi lớn cách nhau bởi ký tự đặc biệt để dịch 1 lần
    const textToTranslate = elements.map(el => (el.innerText || el.placeholder).trim()).join('\n---\n');

    try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=vi&tl=${lang}&dt=t&q=${encodeURIComponent(textToTranslate)}`);
        const data = await res.json();
        
        // Google API đôi khi trả về mảng các dòng
        const translatedLines = data[0].map(item => item[0]).join('').split('\n---\n');

        elements.forEach((el, index) => {
            const translated = translatedLines[index]?.trim();
            if (!translated) return;

            if (el.placeholder) {
                el.placeholder = translated;
            } else {
                const icon = el.querySelector('i');
                if (icon) {
                    el.innerHTML = '';
                    el.appendChild(icon);
                    el.appendChild(document.createTextNode(' ' + translated));
                } else {
                    el.innerText = translated;
                }
            }
        });
    } catch (e) {
        console.error("Lỗi dịch UI:", e);
    }
}
// Hàm bắt đầu một cuộc trò chuyện mới hoàn toàn
function newChat() {
    // 1. Lưu lại cuộc trò chuyện hiện tại vào danh sách nếu có nội dung
    if (chatHistory.length > 0) {
        saveCurrentChat();
    }

    // 2. Reset các biến trạng thái
    chatHistory = [];
    currentChatId = null;
    selectedImageData = null;
    isTyping = false;

    // 3. Xóa trắng màn hình chat và preview ảnh
    const win = document.getElementById('chat-window');
    if (win) win.innerHTML = '';
    
    const preview = document.getElementById('image-preview');
    if (preview) preview.style.display = 'none';

    // 4. Xóa dữ liệu phiên tạm thời trong LocalStorage (không xóa all_chats_list)
    localStorage.removeItem('abc_chat_pro');

    // 5. Cập nhật lại giao diện sidebar
    renderHistorySidebar();

    // 6. Thông báo cho người dùng (tùy chọn)
    console.log("Đã bắt đầu phiên hội thoại mới.");
}

// Cập nhật lại hàm renderHistorySidebar để hỗ trợ tải lại chat cũ
function renderHistorySidebar() {
    const container = document.getElementById('history-container');
    if (!container) return;
    container.innerHTML = '';
    
    // Nếu có danh sách các cuộc hội thoại đã lưu (allChats)
    if (allChats && allChats.length > 0) {
        allChats.forEach(chat => {
            const item = document.createElement('div');
            item.className = 'history-item d-flex justify-content-between align-items-center';
            
            // Nội dung tiêu đề
            const content = document.createElement('div');
            content.style.overflow = 'hidden';
            content.style.textOverflow = 'ellipsis';
            content.innerHTML = `<i class="fa-regular fa-message me-2"></i> ${chat.name}`;
            content.onclick = () => loadChat(chat.id);
            
            // Nút xóa nhanh
            const delBtn = document.createElement('i');
            delBtn.className = 'fa-solid fa-trash-can ms-2 text-secondary';
            delBtn.style.fontSize = '12px';
            delBtn.onclick = (e) => deleteChat(chat.id, e);

            item.appendChild(content);
            item.appendChild(delBtn);
            container.appendChild(item);
        });
    } else {
        // Nếu không có allChats, hiển thị tin nhắn từ chatHistory hiện tại như cũ
        const titles = chatHistory.filter(m => m.role === 'user').reverse();
        titles.forEach(msg => {
            const item = document.createElement('div');
            item.className = 'history-item';
            const text = msg.parts.find(p => p.text)?.text || "Tin nhắn ảnh";
            item.innerHTML = `<i class="fa-regular fa-message me-2"></i> ${text.substring(0, 25)}...`;
            container.appendChild(item);
        });
    }
}
