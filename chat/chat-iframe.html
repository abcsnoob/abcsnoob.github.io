<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abc's Noob AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #iframe-loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .chat-card { background: #fff; height: 100vh; display: flex; flex-direction: column; }
        .chat-header { background: #212529; color: white; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #fff; position: relative; }
        #welcome-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100%; text-align: center; }
        #welcome-screen img { width: 100px; height: 100px; border-radius: 50%; margin-bottom: 15px; border: 2px solid #eee; }
        .suggestion-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 20px; max-width: 500px; }
        .suggestion-chip { padding: 8px 16px; background: #f8f9fa; border: 1px solid #ddd; border-radius: 20px; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .suggestion-chip:hover { background: #0d6efd; color: white; border-color: #0d6efd; }
        .refresh-btn { margin-top: 15px; font-size: 13px; color: #6c757d; cursor: pointer; text-decoration: underline; background: none; border: none; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.5; word-wrap: break-word; position: relative; }
        .user-message { align-self: flex-end; background: #0d6efd; color: white; border-bottom-right-radius: 2px; }
        .bot-message { align-self: flex-start; background: #f1f0f0; color: #333; border-bottom-left-radius: 2px; }
        .chat-footer { padding: 15px; border-top: 1px solid #eee; }
        .input-group { background: #f8f9fa; border-radius: 30px; padding: 5px 15px; border: 1px solid #ddd; display: flex; align-items: center; }
        #user-input { border: none; background: transparent; outline: none; flex: 1; height: 40px; }
        .img-msg { max-width: 100%; max-height: 200px; border-radius: 10px; margin-bottom: 8px; display: block; }
        .typing::after { content: '...'; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        .msg-actions { margin-top: 8px; border-top: 1px solid #e0e0e0; padding-top: 5px; display: flex; gap: 15px; font-size: 12px; color: #666; }
        .msg-actions i { cursor: pointer; transition: 0.2s; }
        .msg-actions i:hover { color: #0d6efd; }
    </style>
</head>
<body>
    <div id="iframe-loader"><div class="spinner-grow text-primary"></div></div>
    
    <div class="chat-card">
        <div class="chat-header">
            <div class="notranslate">
                <i class="fa-solid fa-robot me-2"></i><strong>Abc's Noob AI</strong>
            </div>
            <div class="d-flex align-items-center">
                <i class="fa-solid fa-gear me-3" style="cursor:pointer" data-bs-toggle="modal" data-bs-target="#settingsModal"></i>
                <i class="fa-solid fa-trash-can me-3" style="cursor:pointer" onclick="clearChat()"></i>
                <span class="badge rounded-pill bg-success notranslate">Online</span>
            </div>
        </div>

        <div id="chat-window">
            <div id="welcome-screen">
                <img src="/assets/image/abcsnoob.webp" alt="Logo" onerror="this.src='https://via.placeholder.com/100'">
                <h4 id="welcome-title">Chào bạn!</h4>
                <p id="welcome-desc">Bạn hãy cùng trò chuyện với mình nhé</p>
                <div id="suggestion-container" class="suggestion-container"></div>
                <button class="refresh-btn" onclick="initSuggestions()">
                    <i class="fa-solid fa-rotate me-1"></i> <span id="btn-refresh-text">Đổi gợi ý khác</span>
                </button>
            </div>
        </div>

        <div class="chat-footer">
            <div class="input-group">
                <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleFile(this)">
                <button style="border:none; background:none" onclick="document.getElementById('file-input').click()">
                    <i class="fa-solid fa-image text-primary"></i>
                </button>
                <input type="text" id="user-input" placeholder="..." autocomplete="off">
                <button class="btn btn-primary" id="send-btn" style="border-radius:50%; width:40px; height:40px" onclick="sendMessage()">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="modal fade" id="settingsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fa-solid fa-sliders me-2"></i>Cấu hình Node AI</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Độ ngáo (Temperature): <span id="temp-val" class="badge bg-primary">1.4</span></label>
                        <input type="range" class="form-range" min="0" max="2" step="0.1" id="setting-temp" value="1.4">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Ngôn ngữ giao diện</label>
                        <select class="form-select" id="setting-lang">
                            <option value="auto">Tự động (Auto)</option>
                            <option value="vi">Tiếng Việt</option>
                            <option value="en">English</option>
                            <option value="zh">Chinese</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Model ưu tiên</label>
                        <select class="form-select" id="setting-provider">
                            <option value="auto">Tự động (Failover)</option>
                            <option value="gemini">Gemini 1.5 (Main)</option>
                            <option value="groq">Groq (Siêu tốc)</option>
                            <option value="openrouter">Gemini 2.0 (Boss)</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary w-100" onclick="saveSettings()">Lưu & Cài lại Node</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

    <script>
        // --- LOGIC NGÔN NGỮ ---
        // 1. Lấy ngôn ngữ từ localStorage (do script trang chính lưu)
        const getEffectiveLang = () => {
            const savedLang = localStorage.getItem('user_lang');
            if (savedLang) return savedLang;
            
            // Nếu chưa có trong localstorage, lấy theo trình duyệt
            const browserLang = navigator.language.split('-')[0];
            return ['vi', 'en', 'zh'].includes(browserLang) ? browserLang : 'vi';
        };

        // Cấu hình ban đầu
        let config = JSON.parse(localStorage.getItem('abc_config')) || { temp: 1.4, lang: 'auto', provider: 'auto' };
        
        // Xác định ngôn ngữ thực tế để dịch (nếu config là auto thì dùng EffectiveLang)
        const CURRENT_LANG = config.lang === 'auto' ? getEffectiveLang() : config.lang;

        async function translate(text) {
            if (!text || CURRENT_LANG === 'vi') return text;
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=vi&tl=${CURRENT_LANG}&dt=t&q=${encodeURIComponent(text)}`;
                const res = await fetch(url);
                const json = await res.json();
                return json[0].map(item => item[0]).join('');
            } catch (e) { return text; }
        }

        function saveSettings() {
            config.temp = document.getElementById('setting-temp').value;
            config.lang = document.getElementById('setting-lang').value;
            config.provider = document.getElementById('setting-provider').value;
            
            localStorage.setItem('abc_config', JSON.stringify(config));
            
            // Nếu người dùng chọn ngôn ngữ cụ thể, đồng bộ luôn cho trang chính
            if (config.lang !== 'auto') {
                localStorage.setItem('user_lang', config.lang);
            }
            location.reload();
        }

        // --- CHAT SYSTEM ---
        const WORKER_URL = 'https://abcsnoobai.abcsnoob.workers.dev';
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        let isTyping = false, selectedImageData = null;
        let chatHistory = JSON.parse(localStorage.getItem('abc_chat_history')) || [];

        const questionBank = [
            { category: "Công nghệ & AI", questions: ["AI sẽ thay đổi việc làm thế nào?", "Sự khác biệt giữa ML và AI?"] },
            { category: "Tài chính", questions: ["Cách tiết kiệm tiền?", "Đầu tư chứng khoán là gì?"] },
            { category: "Sức khỏe", questions: ["Lợi ích của uống nước?", "Cách ngủ ngon hơn?"] }
        ];

        async function initSuggestions() {
            const container = document.getElementById('suggestion-container');
            if (!container) return;
            container.innerHTML = '';
            const shuffled = [...questionBank].sort(() => 0.5 - Math.random());
            for (const item of shuffled.slice(0, 3)) {
                const randomQuestion = item.questions[Math.floor(Math.random() * item.questions.length)];
                const chip = document.createElement('div');
                chip.className = 'suggestion-chip';
                chip.innerText = await translate(randomQuestion);
                chip.onclick = () => { userInput.value = chip.innerText; sendMessage(); };
                container.appendChild(chip);
            }
        }

        function speakMessage(elementId) {
            const el = document.getElementById(elementId);
            if (!el) return;
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = el.innerHTML;
            tempDiv.querySelectorAll('pre, code, .msg-actions').forEach(node => node.remove());
            
            const textToRead = tempDiv.innerText;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(textToRead);
            // Áp dụng ngôn ngữ thực tế cho giọng đọc
            utterance.lang = CURRENT_LANG === 'vi' ? 'vi-VN' : (CURRENT_LANG === 'zh' ? 'zh-CN' : 'en-US');
            window.speechSynthesis.speak(utterance);
        }

        async function regenerateLast() {
            if (isTyping || chatHistory.length < 2) return;
            chatHistory.pop();
            const messages = document.querySelectorAll('.message');
            if (messages.length > 0) messages[messages.length - 1].remove();
            
            isTyping = false; 
            const lastUserMsg = chatHistory[chatHistory.length - 1].parts[0].text;
            chatHistory.pop();
            userInput.value = lastUserMsg;
            sendMessage();
        }

        async function sendMessage() {
            const prompt = userInput.value.trim();
            if ((!prompt && !selectedImageData) || isTyping) return;
            
            isTyping = true;
            sendBtn.disabled = true;

            const welcome = document.getElementById('welcome-screen');
            if(welcome) welcome.remove();

            renderMessage(prompt, 'user-message', null, true, selectedImageData);
            
            const userContent = { role: "user", parts: [{ text: prompt || "Analyze this image" }] };
            chatHistory.push(userContent);

            const loadingId = 'load-' + Date.now();
            renderMessage('...', 'bot-message typing', loadingId, false);
            
            userInput.value = '';
            const currentImg = selectedImageData;
            selectedImageData = null; 

            try {
                const res = await fetch(WORKER_URL, { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ 
                        messages: chatHistory, 
                        settings: { ...config, lang: CURRENT_LANG }, // Gửi lang thực tế cho Worker
                        image: currentImg 
                    }) 
                });
                const data = await res.json();
                
                const botDiv = document.getElementById(loadingId);
                botDiv.classList.remove('typing');
                botDiv.innerHTML = '';
                
                const responseText = data.text || "Error: No response.";
                await typeText(botDiv, responseText);
                
                addMsgActions(botDiv, loadingId);

                chatHistory.push({ role: "model", parts: [{ text: responseText }] });
                if (chatHistory.length > 12) chatHistory.splice(0, 2);
                localStorage.setItem('abc_chat_history', JSON.stringify(chatHistory));
            } catch (e) { 
                const botDiv = document.getElementById(loadingId);
                if(botDiv) botDiv.innerText = "Connection Error!"; 
            } finally { 
                isTyping = false; 
                sendBtn.disabled = false; 
            }
        }

        function addMsgActions(el, id) {
            const actionDiv = document.createElement('div');
            actionDiv.className = 'msg-actions';
            actionDiv.innerHTML = `
                <i class="fa-solid fa-volume-high" onclick="speakMessage('${id}')"></i>
                <i class="fa-solid fa-arrows-rotate" onclick="regenerateLast()"></i>
            `;
            el.appendChild(actionDiv);
        }

        async function typeText(el, txt) {
            let i = 0;
            return new Promise((resolve) => {
                function typing() {
                    if (i < txt.length) {
                        el.innerHTML = marked.parse(txt.substring(0, i + 1));
                        Prism.highlightAllUnder(el);
                        chatWindow.scrollTop = chatWindow.scrollHeight;
                        i++; setTimeout(typing, 5);
                    } else { resolve(); }
                }
                typing();
            });
        }

        function renderMessage(t, c, id, mk, img) {
            const d = document.createElement('div');
            d.className = `message ${c}`;
            if(id) d.id = id;
            if(img) {
                const i = document.createElement('img');
                i.src = img; i.className='img-msg'; d.appendChild(i);
            }
            if(t) {
                const s = document.createElement('span');
                s.innerHTML = mk ? marked.parse(t) : t;
                d.appendChild(s);
            }
            chatWindow.appendChild(d);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            if(mk) {
                Prism.highlightAllUnder(d);
                if(c.includes('bot-message') && id) addMsgActions(d, id);
            }
        }

        function clearChat() {
            if(confirm("Clear chat history?")) {
                localStorage.removeItem('abc_chat_history');
                location.reload();
            }
        }

        function handleFile(input) {
            const file = input.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                selectedImageData = e.target.result;
                alert("Image selected!");
            };
            reader.readAsDataURL(file);
        }

        window.onload = async () => {
            // Cập nhật UI modal
            document.getElementById('setting-temp').value = config.temp;
            document.getElementById('temp-val').innerText = config.temp;
            document.getElementById('setting-lang').value = config.lang;
            document.getElementById('setting-provider').value = config.provider;
            document.getElementById('setting-temp').oninput = (e) => document.getElementById('temp-val').innerText = e.target.value;

            // Hiển thị lịch sử
            if (chatHistory.length > 0) {
                const welcome = document.getElementById('welcome-screen');
                if(welcome) welcome.remove();
                chatHistory.forEach((m, index) => {
                    const msgId = m.role === 'model' ? `hist-${index}` : null;
                    renderMessage(m.parts[0].text, m.role==='user'?'user-message':'bot-message', msgId, true);
                });
            } else {
                await initSuggestions();
            }
            
            // Dịch UI theo ngôn ngữ hiệu dụng (Auto/Fixed)
            document.getElementById('user-input').placeholder = await translate('Hỏi gì đi ông anh...');
            document.getElementById('welcome-title').innerText = await translate('Chào bạn!');
            document.getElementById('welcome-desc').innerText = await translate('Bạn hãy cùng trò chuyện với mình nhé');
            document.getElementById('btn-refresh-text').innerText = await translate('Đổi gợi ý khác');
            
            setTimeout(() => document.getElementById('iframe-loader')?.remove(), 500);
        };

        userInput.addEventListener('keypress', e => { if(e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
