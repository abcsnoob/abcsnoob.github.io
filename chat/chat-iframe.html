<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <style>
        body { background-color: transparent; margin: 0; padding: 20px; font-family: sans-serif; }
        .chat-card { background: #fff; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 85vh; max-width: 900px; margin: auto; overflow: hidden; }
        .chat-header { background: #212529; color: white; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 20px; font-size: 15px; }
        .user-message { align-self: flex-end; background-color: #0d6efd; color: white; border-bottom-right-radius: 2px; }
        .bot-message { align-self: flex-start; background-color: #f1f0f0; color: #333; border-bottom-left-radius: 2px; }
        pre { background: #2d2d2d !important; padding: 10px; border-radius: 8px; color: #fff; }
        .chat-footer { padding: 15px; border-top: 1px solid #eee; }
        .input-group { background: #f8f9fa; border-radius: 30px; padding: 5px 15px; border: 1px solid #ddd; }
        #user-input { border: none; background: transparent; box-shadow: none; outline: none; width: 100%; }
        .btn-send { border-radius: 50%; width: 40px; height: 40px; flex-shrink: 0; }
    </style>
</head>
<body>

    <div class="chat-card">
        <div class="chat-header">
            <div><i class="fa-solid fa-robot me-2"></i><strong>Abc's Noob AI</strong></div>
            <span class="badge rounded-pill bg-success">Online</span>
        </div>
        
        <div id="chat-window"></div>

        <div class="chat-footer">
            <div class="d-flex align-items-center input-group">
                <input type="text" id="user-input" placeholder="Hỏi gì về Minecraft hoặc Code đi..." autocomplete="off">
                <button class="btn btn-primary btn-send" id="send-btn" onclick="sendMessage()">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    
    <script>
        const WORKER_URL = 'https://abcsnoobai.abcsnoob.workers.dev';
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        let isTyping = false;
        let chatHistory = JSON.parse(localStorage.getItem('abc_chat_history')) || [];

        // Lắng nghe sự kiện xóa từ trang cha (index.html)
        window.addEventListener('message', (event) => {
            if (event.data === 'clear-chat') clearChat();
        });

        window.onload = () => {
            if (chatHistory.length > 0) {
                chatHistory.forEach(msg => renderMessage(msg.parts[0].text, msg.role === 'user' ? 'user-message' : 'bot-message', null, true));
            } else {
                renderMessage("Chào ông anh! Tôi là AI của Abc's Noob đây.", 'bot-message');
            }
        };

        async function sendMessage() {
            const prompt = userInput.value.trim();
            if (!prompt || isTyping) return;

            renderMessage(prompt, 'user-message');
            chatHistory.push({ role: "user", parts: [{ text: prompt }] });
            userInput.value = '';
            isTyping = true;

            const loadingId = 'load-' + Date.now();
            renderMessage('Đang quét mạng lưới...', 'bot-message', loadingId, false);

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: chatHistory })
                });
                const data = await response.json();
                const fullText = data.text || "Lỗi rồi đại ca ơi...";
                
                const botMsgDiv = document.getElementById(loadingId);
                botMsgDiv.innerHTML = '';
                await typeText(botMsgDiv, fullText);

                chatHistory.push({ role: "model", parts: [{ text: fullText }] });
                if (chatHistory.length > 16) chatHistory.splice(0, 2);
                localStorage.setItem('abc_chat_history', JSON.stringify(chatHistory));
            } catch (err) {
                document.getElementById(loadingId).innerText = "Mất kết nối server!";
            } finally {
                isTyping = false;
            }
        }

        async function typeText(element, text) {
            let i = 0;
            return new Promise((resolve) => {
                function typing() {
                    if (i < text.length) {
                        element.innerHTML = marked.parse(text.substring(0, i + 1));
                        Prism.highlightAllUnder(element);
                        i++;
                        chatWindow.scrollTop = chatWindow.scrollHeight;
                        setTimeout(typing, 10);
                    } else { resolve(); }
                }
                typing();
            });
        }

        function renderMessage(text, className, id = '', useMarkdown = true) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            if(id) div.id = id;
            div.innerHTML = useMarkdown ? marked.parse(text) : text;
            chatWindow.appendChild(div);
            if(useMarkdown) Prism.highlightAllUnder(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function clearChat() {
            if(confirm("Xóa hết dấu vết chat à ông anh?")) {
                localStorage.removeItem('abc_chat_history');
                location.reload();
            }
        }

        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
