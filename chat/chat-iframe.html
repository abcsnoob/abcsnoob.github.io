<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abc's Noob AI | Pro Dashboard</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

    <style>
        :root {
            --primary: #5865F2; --primary-hover: #4752C4;
            --bg-darker: #1e1f22; --bg-main: #2b2d31;
            --bg-sidebar: #2b2d31; --bg-msg: #313338;
            --text-normal: #dbdee1; --text-muted: #949ba4;
            --border: rgba(255,255,255,0.05);
        }

        /* Scrollbar tinh tế kiểu Dev */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 10px; }

        body { 
            background: var(--bg-darker); color: var(--text-normal); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100dvh; overflow: hidden; display: flex; margin: 0; 
        }

        /* --- SIDEBAR SYSTEM --- */
        #sidebar {
            width: 300px; background: var(--bg-sidebar); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; transition: 0.3s; z-index: 1001;
        }

        .server-header {
            height: 60px; padding: 0 16px; display: flex; align-items: center;
            border-bottom: 1px solid var(--border); font-weight: 800; font-size: 1.1rem;
            box-shadow: 0 1px 0 rgba(0,0,0,0.1); color: #fff;
        }

        .section-label {
            padding: 20px 16px 8px; font-size: 12px; font-weight: 700;
            color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .nav-list { flex: 1; overflow-y: auto; padding: 0 8px; }
        .nav-item {
            padding: 8px 12px; border-radius: 4px; margin-bottom: 2px;
            cursor: pointer; transition: 0.1s; display: flex; align-items: center;
            color: var(--text-muted); font-size: 15px; position: relative;
        }
        .nav-item:hover { background: #35373c; color: #dbdee1; }
        .nav-item.active { background: #3f4147; color: #fff; }
        .nav-item i { width: 24px; font-size: 18px; margin-right: 12px; opacity: 0.7; }

        .user-panel {
            background: #232428; padding: 10px 16px; display: flex; 
            align-items: center; gap: 12px; border-top: 1px solid var(--border);
        }
        .avatar {
            width: 38px; height: 38px; border-radius: 50%; background: var(--primary);
            display: flex; align-items: center; justify-content: center; font-weight: bold;
        }

        /* --- MAIN CHAT AREA --- */
        #main-container { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); }
        
        .chat-header {
            height: 60px; padding: 0 20px; display: flex; align-items: center;
            justify-content: space-between; border-bottom: 1px solid var(--border);
            background: var(--bg-main);
        }

        #chat-window {
            flex: 1; overflow-y: auto; padding: 20px 0; display: flex; flex-direction: column;
        }

        .msg-row {
            padding: 10px 20px; display: flex; gap: 16px; transition: 0.1s;
        }
        .msg-row:hover { background: rgba(0,0,0,0.05); }
        .msg-avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; }
        .msg-body { flex: 1; }
        .msg-info { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
        .msg-author { font-weight: 600; color: #fff; }
        .msg-time { font-size: 12px; color: var(--text-muted); }
        .msg-content { line-height: 1.5; font-size: 15px; white-space: pre-wrap; }

        /* --- INPUT AREA --- */
        .input-wrapper { padding: 0 20px 24px; position: relative; }
        .input-box {
            background: #383a40; border-radius: 8px; padding: 10px 16px;
            display: flex; align-items: flex-end; gap: 15px;
        }
        #user-input {
            flex: 1; background: transparent; border: none; color: #dbdee1;
            outline: none; resize: none; max-height: 400px; padding: 5px 0;
        }

        /* --- MODAL & OVERLAY --- */
        .noob-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: none; align-items: center; justify-content: center; z-index: 2000;
            backdrop-filter: blur(5px);
        }
        .noob-modal {
            background: var(--bg-main); width: 90%; max-width: 440px;
            border-radius: 8px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .form-control-noob {
            background: #1e1f22; border: 1px solid transparent; color: #fff;
            padding: 10px; border-radius: 4px; width: 100%; margin-bottom: 15px;
        }
        .form-control-noob:focus { border-color: var(--primary); outline: none; }

        /* Mobile Fix */
        @media (max-width: 768px) {
            #sidebar { position: fixed; left: -300px; height: 100%; width: 280px; }
            #sidebar.open { left: 0; }
        }
    </style>
</head>
<body>

    <aside id="sidebar">
        <div class="server-header">
            <i class="fa-solid fa-code-branch me-2 text-primary"></i> NOOB DEV CENTER
        </div>

        <div class="nav-list">
            <div class="section-label">Tin nhắn riêng</div>
            <div id="personal-chats"></div>

            <div class="section-label">
                Nhóm của ông giáo
                <i class="fa-solid fa-plus-circle ms-auto" style="cursor:pointer" onclick="openModal('modal-create-group')"></i>
            </div>
            <div id="group-list"></div>
        </div>

        <div class="user-panel">
            <div class="avatar" id="user-avatar">?</div>
            <div class="flex-grow-1 overflow-hidden">
                <div class="fw-bold text-white text-truncate" id="user-name">Guest Noob</div>
                <div class="small text-muted" id="user-email-display">Đăng nhập để lưu data</div>
            </div>
            <i class="fa-solid fa-gear text-muted" style="cursor:pointer" onclick="openModal('modal-profile')"></i>
        </div>
    </aside>

    <div id="main-container">
        <nav class="chat-header">
            <div class="d-flex align-items-center">
                <i class="fa-solid fa-bars d-md-none me-3" onclick="toggleSidebar()"></i>
                <span class="text-muted fs-4 me-2">#</span>
                <span class="fw-bold" id="active-chat-title">Chào mừng ông giáo</span>
            </div>
            <div class="d-flex gap-3">
                <i class="fa-solid fa-users text-muted" style="cursor:pointer" onclick="showGroupMembers()" id="member-btn" style="display:none"></i>
                <i class="fa-solid fa-user-plus text-muted" style="cursor:pointer" onclick="openModal('modal-invite')" id="invite-btn" style="display:none"></i>
                <i class="fa-solid fa-trash-can text-muted" onclick="clearCurrentChat()"></i>
            </div>
        </nav>

        <main id="chat-window">
            <div class="text-center p-5 opacity-25">
                <i class="fa-solid fa-comments fa-4x mb-3"></i>
                <h4>Chưa có hội thoại nào</h4>
                <p>Chọn một nhóm hoặc tạo tin nhắn mới để bắt đầu gank code.</p>
            </div>
        </main>

        <div class="input-wrapper">
            <div class="input-box">
                <button class="btn p-0 text-muted" onclick="document.getElementById('img-upload').click()">
                    <i class="fa-solid fa-circle-plus fs-5"></i>
                </button>
                <input type="file" id="img-upload" hidden accept="image/*" onchange="previewImage(this)">
                <textarea id="user-input" rows="1" placeholder="Gửi tin nhắn..."></textarea>
                <button class="btn btn-link text-primary p-0" onclick="sendMessage()">
                    <i class="fa-solid fa-paper-plane fs-5"></i>
                </button>
            </div>
            <div id="p-preview-container" class="mt-2" style="display:none">
                 <img id="p-preview" style="height:60px; border-radius:8px; border:1px solid var(--primary)">
            </div>
        </div>
    </div>

    <div class="noob-overlay" id="overlay" onclick="handleOverlayClick(event)">
        <div id="modal-profile" class="noob-modal" style="display:none">
            <h5 class="fw-bold mb-3">Hồ sơ Pro</h5>
            <div id="auth-section">
                <input type="email" id="auth-email" class="form-control-noob" placeholder="Email">
                <input type="password" id="auth-pass" class="form-control-noob" placeholder="Mật khẩu">
                <div class="d-flex gap-2">
                    <button class="btn btn-primary flex-grow-1" onclick="handleAuth('login')">Đăng nhập</button>
                    <button class="btn btn-outline-light flex-grow-1" onclick="handleAuth('register')">Đăng ký</button>
                </div>
            </div>
            <div id="profile-section" style="display:none">
                <label class="small text-muted mb-2">Username hiển thị</label>
                <input type="text" id="new-username" class="form-control-noob">
                <button class="btn btn-primary w-100" onclick="updateUsername()">Lưu thay đổi</button>
                <button class="btn btn-danger w-100 mt-2" onclick="logout()">Đăng xuất</button>
            </div>
        </div>

        <div id="modal-create-group" class="noob-modal" style="display:none">
            <h5 class="fw-bold mb-3">Tạo Nhóm Mới</h5>
            <input type="text" id="group-name-input" class="form-control-noob" placeholder="Tên nhóm chat">
            <button class="btn btn-primary w-100" onclick="createGroup()">Khởi tạo ngay</button>
        </div>

        <div id="modal-invite" class="noob-modal" style="display:none">
            <h5 class="fw-bold mb-3">Mời đồng đội</h5>
            <p class="small text-muted">Nhập email của người dùng Noob AI khác.</p>
            <input type="email" id="invite-email" class="form-control-noob" placeholder="friend@example.com">
            <button class="btn btn-primary w-100" onclick="inviteUser()">Gửi lời mời</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    
    <script>
        const WORKER_URL = 'https://abcsnoobai.abcsnoob.workers.dev'; // THAY URL CỦA ÔNG GIÁO VÀO
        let currentUser = JSON.parse(localStorage.getItem('noob_user')) || null;
        let activeGroupId = null;
        let selectedImg = null;
        let groups = [];

        // --- CORE UI ---
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
        
        function openModal(id) {
            document.getElementById('overlay').style.display = 'flex';
            document.querySelectorAll('.noob-modal').forEach(m => m.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }

        function handleOverlayClick(e) { if(e.target.id === 'overlay') document.getElementById('overlay').style.display = 'none'; }

        function showNotify(msg, type='info') {
            alert(msg); // Thay bằng Toast nếu muốn xịn hơn
        }

        // --- AUTH LOGIC ---
        async function handleAuth(mode) {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-pass').value;
            const res = await fetch(WORKER_URL, {
                method: 'POST',
                body: JSON.stringify({ action: mode, email, password })
            });
            const d = await res.json();
            if(d.success) {
                localStorage.setItem('noob_token', d.token);
                localStorage.setItem('noob_user', JSON.stringify({ email, username: email.split('@')[0] }));
                location.reload();
            } else showNotify(d.error);
        }

        function updateUIAuth() {
            if(currentUser) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('profile-section').style.display = 'block';
                document.getElementById('user-name').innerText = currentUser.username;
                document.getElementById('user-email-display').innerText = currentUser.email;
                document.getElementById('user-avatar').innerText = currentUser.username[0].toUpperCase();
                loadGroups();
            }
        }

        function logout() { localStorage.clear(); location.reload(); }

        // --- GROUP & MESSAGE LOGIC ---
        async function loadGroups() {
            const token = localStorage.getItem('noob_token');
            const res = await fetch(WORKER_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'get_my_groups', email: currentUser.email })
            });
            const d = await res.json();
            if(d.success) {
                const list = document.getElementById('group-list');
                list.innerHTML = d.groups.map(g => `
                    <div class="nav-item" onclick="switchGroup('${g.id}', '${g.name}')">
                        <i class="fa-solid fa-hashtag"></i> ${g.name}
                    </div>
                `).join('');
            }
        }

        async function createGroup() {
            const name = document.getElementById('group-name-input').value;
            const res = await fetch(WORKER_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'create_group', email: currentUser.email, data: { groupName: name }})
            });
            if((await res.json()).success) { location.reload(); }
        }

        async function switchGroup(id, name) {
            activeGroupId = id;
            document.getElementById('active-chat-title').innerText = name;
            document.getElementById('member-btn').style.display = 'block';
            document.getElementById('invite-btn').style.display = 'block';
            document.getElementById('chat-window').innerHTML = '<div class="text-center p-5 opacity-50">Đang tải tin nhắn nhóm...</div>';
            
            const res = await fetch(WORKER_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'get_group_msgs', email: currentUser.email, data: { groupId: id }})
            });
            const d = await res.json();
            const win = document.getElementById('chat-window');
            win.innerHTML = '';
            if(d.success) {
                d.messages.forEach(m => renderMsg(m.text, m.sender_name, m.role, m.created_at));
            }
        }

        function renderMsg(text, author, role, time) {
            const win = document.getElementById('chat-window');
            const div = document.createElement('div');
            div.className = 'msg-row';
            const isBot = (role === 'model');
            const avatarColor = isBot ? '#5865F2' : '#fbc531';
            
            div.innerHTML = `
                <div class="msg-avatar" style="background:${avatarColor}; display:flex; align-items:center; justify-content:center; color:white; font-weight:bold">
                    ${author[0].toUpperCase()}
                </div>
                <div class="msg-body">
                    <div class="msg-info">
                        <span class="msg-author" style="color:${isBot ? '#00d2ff' : '#fff'}">${author}</span>
                        <span class="msg-time">${new Date(time).toLocaleTimeString()}</span>
                    </div>
                    <div class="msg-content">${marked.parse(text)}</div>
                </div>
            `;
            win.appendChild(div);
            win.scrollTop = win.scrollHeight;
            if(window.Prism) Prism.highlightAllUnder(div);
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if(!text || !activeGroupId) return;

            renderMsg(text, currentUser.username, 'user', new Date());
            input.value = '';
            
            const res = await fetch(WORKER_URL, {
                method: 'POST',
                body: JSON.stringify({ 
                    action: 'send_group_msg', 
                    email: currentUser.email, 
                    data: { groupId: activeGroupId, text, senderName: currentUser.username }
                })
            });
            const d = await res.json();
            if(d.success) renderMsg(d.text, "Abc's Noob", 'model', new Date());
        }

        // --- INITIALIZE ---
        window.onload = () => {
            updateUIAuth();
            
            // Auto-resize textarea
            const tx = document.getElementById('user-input');
            tx.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
            });
        }
    </script>
</body>
</html>
