<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abc's Noob AI - Premium</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <style>
        :root {
            --primary-color: #0d6efd;
            --bg-body: #f0f2f5;
            --bg-card: #ffffff;
            --text-main: #212529;
            --bot-msg-bg: #f1f0f0;
            --footer-bg: #ffffff;
            --input-bg: #f8f9fa;
            --border-color: #ddd;
        }

        /* DARK MODE LOGIC */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #121212;
                --bg-card: #1e1e1e;
                --text-main: #e0e0e0;
                --bot-msg-bg: #2d2d2d;
                --footer-bg: #1e1e1e;
                --input-bg: #2d2d2d;
                --border-color: #444;
            }
            .bot-message { color: #e0e0e0 !important; }
            #user-input { color: white; }
            #welcome-desc { color: #aaa !important; }
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-body); color: var(--text-main); }

        #iframe-loader { position: fixed; inset: 0; background: var(--bg-card); display: flex; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s; }

        .chat-card { background: var(--bg-card); height: 100vh; height: 100dvh; display: flex; flex-direction: column; width: 100%; position: relative; }
        
        .chat-header { 
            background: #212529; color: white; padding: 12px 15px; 
            display: flex; align-items: center; justify-content: space-between; 
            z-index: 10; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        #chat-window { 
            flex: 1; overflow-y: auto; padding: 15px; 
            display: flex; flex-direction: column; gap: 15px; 
            background: transparent; scroll-behavior: smooth;
        }

        .message { 
            max-width: 85%; padding: 10px 16px; border-radius: 18px; 
            font-size: 15px; line-height: 1.5; word-wrap: break-word; 
            animation: fadeIn 0.3s ease; position: relative;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .user-message { align-self: flex-end; background: var(--primary-color); color: white; border-bottom-right-radius: 4px; }
        .bot-message { align-self: flex-start; background: var(--bot-msg-bg); color: var(--text-main); border-bottom-left-radius: 4px; }
        
        .bot-message pre { background: #2d2d2d !important; border-radius: 8px; margin: 10px 0; padding: 10px; overflow-x: auto; }

        .chat-footer { padding: 12px; border-top: 1px solid var(--border-color); background: var(--footer-bg); }
        .input-group-custom { 
            background: var(--input-bg); border-radius: 30px; padding: 5px 15px; 
            border: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px;
        }
        #user-input { border: none; background: transparent; outline: none; flex: 1; min-height: 40px; font-size: 15px; }

        #tut-box { 
            position: absolute; z-index: 9992; background: var(--bg-card); color: var(--text-main);
            padding: 15px; border-radius: 12px; width: 280px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        #welcome-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; }
        .img-container { position: relative; margin-bottom: 5px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border-color); }
        .img-msg { max-width: 100%; max-height: 300px; display: block; cursor: zoom-in; }
        
        @media (max-width: 768px) {
            .message { max-width: 92%; }
            .chat-header strong { font-size: 14px; }
        }
    </style>
</head>
<body>

    <div id="iframe-loader"><div class="spinner-border text-primary"></div></div>

    <div id="tut-overlay" onclick="nextStep()" style="position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 9990; display: none;"></div>
    <div id="tut-box" style="display:none">
        <h6 id="tut-title" class="fw-bold text-primary mb-2"></h6>
        <p id="tut-desc" class="small mb-3"></p>
        <div class="d-flex justify-content-between align-items-center">
            <span id="tut-step-count" class="badge bg-secondary"></span>
            <button class="btn btn-sm btn-primary px-3" onclick="nextStep()">Tiếp tục</button>
        </div>
    </div>

    <div class="chat-card" id="main-app">
        <div class="chat-header" id="header-area">
            <div><i class="fa-solid fa-robot me-2"></i><strong>Abc's Noob AI</strong></div>
            <div class="d-flex gap-3 align-items-center">
                <i id="btn-import" class="fa-solid fa-cloud-arrow-down" title="Nhập ID" style="cursor:pointer" onclick="importShare()"></i>
                <i id="btn-share" class="fa-solid fa-share-nodes" title="Chia sẻ" style="cursor:pointer" onclick="shareChat()"></i>
                <i id="btn-clear" class="fa-solid fa-trash-can" title="Xóa" style="cursor:pointer" onclick="clearChat()"></i>
                <span class="badge rounded-pill bg-success">Online</span>
            </div>
        </div>

        <div id="chat-window">
            <div id="welcome-screen">
                <img src="/assets/image/abcsnoob.webp" width="80" height="80" class="rounded-circle mb-3" onerror="this.src='https://via.placeholder.com/80'">
                <h4>Xin chào!</h4>
                <p id="welcome-desc" class="text-muted">Nhập tin nhắn hoặc ID để bắt đầu.</p>
            </div>
        </div>

        <div class="chat-footer" id="footer-area">
            <div class="input-group-custom">
                <button id="btn-img" class="btn btn-link p-0 text-muted" onclick="document.getElementById('file-input').click()">
                    <i class="fa-solid fa-image fs-5"></i>
                </button>
                <input type="file" id="file-input" accept="image/*" hidden onchange="handleFile(this)">
                <input type="text" id="user-input" placeholder="Hỏi gì đó..." autocomplete="off">
                <button id="stop-btn" class="btn btn-link text-danger p-0" style="display:none" onclick="stopTyping()"><i class="fa-solid fa-circle-stop fs-5"></i></button>
                <button id="send-btn" class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center" style="width:35px; height:35px" onclick="sendMessage()">
                    <i class="fa-solid fa-paper-plane" style="font-size: 14px;"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        const WORKER_URL = 'https://abcsnoobai.abcsnoob.workers.dev';
        const USER_LANG = localStorage.getItem('user_lang') || 'vi';
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const stopBtn = document.getElementById('stop-btn');

        let isTyping = false, abortTyping = false, selectedImageData = null, currentStep = 0;
        let chatHistory = JSON.parse(localStorage.getItem('abc_chat_history')) || [];

        // --- DARK MODE THEME FOR SWAL ---
        const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const swalConfig = {
            background: isDark ? '#1e1e1e' : '#fff',
            color: isDark ? '#fff' : '#000'
        };

        // --- SHARE & IMPORT ---
        async function shareChat() {
            if (!chatHistory.length) return;
            Swal.fire({ title: 'Đang lưu...', allowOutsideClick: false, ...swalConfig, didOpen: () => Swal.showLoading() });
            try {
                const res = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'share', data: chatHistory })
                });
                const result = await res.json();
                if (result.success) {
                    const shareUrl = `${window.location.origin}${window.location.pathname}?shareId=${result.shareId}`;
                    navigator.clipboard.writeText(shareUrl);
                    Swal.fire({ icon: 'success', title: 'Đã copy Link!', text: `ID: ${result.shareId}`, ...swalConfig });
                }
            } catch (e) { Swal.fire('Lỗi!', 'Không thể share.', 'error'); }
        }

        async function importShare() {
            const { value: shareId } = await Swal.fire({
                title: 'Nhập ID Share',
                input: 'text',
                showCancelButton: true,
                ...swalConfig
            });
            if (shareId) {
                Swal.fire({ title: 'Đang tải...', ...swalConfig, didOpen: () => Swal.showLoading() });
                try {
                    const res = await fetch(WORKER_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'get_share', shareId: shareId.trim() })
                    });
                    const result = await res.json();
                    if (result.success) {
                        chatWindow.innerHTML = '';
                        chatHistory = result.data;
                        localStorage.setItem('abc_chat_history', JSON.stringify(chatHistory));
                        chatHistory.forEach(m => renderMessage(m.parts.find(p => p.text)?.text, m.role === 'user' ? 'user-message' : 'bot-message'));
                        Swal.close();
                    }
                } catch (e) { Swal.fire('Lỗi!', 'ID sai hoặc lỗi mạng.', 'error'); }
            }
        }

        // --- CORE LOGIC ---
        function renderMessage(text, className, id = null, isMarkdown = true, imgSrc = null) {
            const welcome = document.getElementById('welcome-screen');
            if (welcome) welcome.style.display = 'none';
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            if (id) msgDiv.id = id;
            if (imgSrc) {
                const imgCont = document.createElement('div');
                imgCont.className = 'img-container';
                imgCont.innerHTML = `<img src="${imgSrc}" class="img-msg" onclick="this.requestFullscreen()">`;
                msgDiv.appendChild(imgCont);
            }
            if (text) {
                const span = document.createElement('span');
                span.innerHTML = isMarkdown ? marked.parse(text) : text;
                msgDiv.appendChild(span);
            }
            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            if (isMarkdown) Prism.highlightAllUnder(msgDiv);
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if ((!text && !selectedImageData) || isTyping) return;
            const currentImg = selectedImageData;
            renderMessage(text, 'user-message', null, true, currentImg);
            userInput.value = ''; selectedImageData = null;
            isTyping = true; sendBtn.disabled = true; stopBtn.style.display = 'block';

            let userParts = [];
            if (text) userParts.push({ text: text });
            if (currentImg) userParts.push({ inline_data: { mime_type: "image/jpeg", data: currentImg.split(',')[1] } });
            chatHistory.push({ role: "user", parts: userParts });

            const botMsgId = 'bot-' + Date.now();
            renderMessage('...', 'bot-message typing', botMsgId, false);

            try {
                const res = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: chatHistory, user_lang: USER_LANG })
                });
                const data = await res.json();
                const botEl = document.getElementById(botMsgId);
                botEl.classList.remove('typing'); botEl.innerHTML = '';
                await typeEffect(botEl, data.text);
                chatHistory.push({ role: "model", parts: [{ text: data.text }] });
                localStorage.setItem('abc_chat_history', JSON.stringify(chatHistory.slice(-15)));
            } catch (e) { document.getElementById(botMsgId).innerText = "Lỗi kết nối!"; }
            finally { isTyping = false; sendBtn.disabled = false; stopBtn.style.display = 'none'; }
        }

        async function typeEffect(el, text) {
            let i = 0; abortTyping = false;
            return new Promise(resolve => {
                function inner() {
                    if (i < text.length && !abortTyping) {
                        i += 4; el.innerHTML = marked.parse(text.substring(0, i));
                        chatWindow.scrollTop = chatWindow.scrollHeight;
                        setTimeout(inner, 10);
                    } else { el.innerHTML = marked.parse(text); Prism.highlightAllUnder(el); resolve(); }
                }
                inner();
            });
        }

        function handleFile(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => { selectedImageData = e.target.result; Toastify({ text: "Đã chọn ảnh!", background: "green" }).showToast(); };
            reader.readAsDataURL(file);
        }

        function clearChat() { if (confirm("Xóa lịch sử?")) { localStorage.removeItem('abc_chat_history'); location.reload(); } }
        function stopTyping() { abortTyping = true; }

        window.onload = async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const shareId = urlParams.get('shareId');
            if (shareId) {
                // Tải từ URL nếu có
                const res = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'get_share', shareId: shareId }) });
                const result = await res.json();
                if (result.success) {
                    document.getElementById('welcome-screen').style.display = 'none';
                    result.data.forEach(m => renderMessage(m.parts.find(p => p.text)?.text, m.role === 'user' ? 'user-message' : 'bot-message'));
                }
            } else if (chatHistory.length > 0) {
                document.getElementById('welcome-screen').style.display = 'none';
                chatHistory.forEach(m => renderMessage(m.parts.find(p => p.text)?.text, m.role === 'user' ? 'user-message' : 'bot-message'));
            }
            setTimeout(() => {
                document.getElementById('iframe-loader').style.opacity = '0';
                setTimeout(() => document.getElementById('iframe-loader').remove(), 500);
            }, 800);
        };

        userInput.onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };
    </script>
</body>
</html>
