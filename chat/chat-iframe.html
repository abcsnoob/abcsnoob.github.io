<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abc's Noob AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #iframe-loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .chat-card { background: #fff; height: 100vh; display: flex; flex-direction: column; }
        .chat-header { background: #212529; color: white; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #fff; position: relative; }
        
        #welcome-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; }
        #welcome-screen img { width: 100px; height: 100px; border-radius: 50%; margin-bottom: 15px; border: 2px solid #eee; }
        
        .suggestion-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 20px; max-width: 500px; }
        .suggestion-chip { padding: 8px 16px; background: #f8f9fa; border: 1px solid #ddd; border-radius: 20px; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .suggestion-chip:hover { background: #0d6efd; color: white; border-color: #0d6efd; }
        
        .refresh-btn { margin-top: 15px; font-size: 13px; color: #6c757d; cursor: pointer; text-decoration: underline; background: none; border: none; }
        .refresh-btn:hover { color: #0d6efd; }

        .message { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.5; word-wrap: break-word; }
        .user-message { align-self: flex-end; background: #0d6efd; color: white; border-bottom-right-radius: 2px; }
        .bot-message { align-self: flex-start; background: #f1f0f0; color: #333; border-bottom-left-radius: 2px; }
        
        .chat-footer { padding: 15px; border-top: 1px solid #eee; }
        .input-group { background: #f8f9fa; border-radius: 30px; padding: 5px 15px; border: 1px solid #ddd; display: flex; align-items: center; }
        #user-input { border: none; background: transparent; outline: none; flex: 1; height: 40px; }
        .img-msg { max-width: 100%; max-height: 250px; border-radius: 10px; margin-bottom: 8px; display: block; }

        .typing::after { content: '...'; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div id="iframe-loader"><div class="spinner-grow text-primary"></div></div>
    
    <div class="chat-card">
        <div class="chat-header">
            <div class="notranslate">
                <i class="fa-solid fa-robot me-2"></i><strong>Abc's Noob AI</strong>
            </div>
            <div class="d-flex align-items-center">
                <i class="fa-solid fa-trash-can me-3" style="cursor:pointer" onclick="clearChat()"></i>
                <span class="badge rounded-pill bg-success notranslate">Online</span>
            </div>
        </div>

        <div id="chat-window">
            <div id="welcome-screen">
                <img src="/assets/image/abcsnoob.webp" alt="Logo" onerror="this.src='https://via.placeholder.com/100'">
                <h4 id="welcome-title">Chào bạn!</h4>
                <p id="welcome-desc">Bạn hãy cùng trò chuyện với mình nhé</p>
                <div id="suggestion-container" class="suggestion-container"></div>
                <button class="refresh-btn" onclick="initSuggestions()">
                    <i class="fa-solid fa-rotate me-1"></i> <span id="btn-refresh-text">Đổi gợi ý khác</span>
                </button>
            </div>
        </div>

        <div class="chat-footer">
            <div class="input-group">
                <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleFile(this)">
                <button style="border:none; background:none" onclick="document.getElementById('file-input').click()">
                    <i class="fa-solid fa-image"></i>
                </button>
                <input type="text" id="user-input" placeholder="Hỏi gì đi ông anh..." autocomplete="off">
                <button class="btn btn-primary" id="send-btn" style="border-radius:50%; width:40px; height:40px" onclick="sendMessage()">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

   <script>

        // --- 1. CẤU HÌNH DỊCH THUẬT (Chỉ dùng cho giao diện) ---

        const TARGET_LANG = localStorage.getItem('user_lang') || 'vi';



        async function translate(text) {

            if (!text || TARGET_LANG === 'vi') return text;

            try {

                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=vi&tl=${TARGET_LANG}&dt=t&q=${encodeURIComponent(text)}`;

                const res = await fetch(url);

                const json = await res.json();

                return json[0].map(item => item[0]).join('');

            } catch (e) { return text; }

        }



        // --- 2. QUẢN LÝ CHAT ---

        const WORKER_URL = 'https://abcsnoobai.abcsnoob.workers.dev';

        const chatWindow = document.getElementById('chat-window');

        const userInput = document.getElementById('user-input');

        const sendBtn = document.getElementById('send-btn');

        let isTyping = false, selectedImageData = null;

        let chatHistory = JSON.parse(localStorage.getItem('abc_chat_history')) || [];



const questionBank = [
    {
        category: "Giải trí & Trò chơi",
        questions: [
            "Những tựa game thế giới mở phổ biến nhất hiện nay là gì?",
            "Gợi ý cho tôi một bộ phim kinh điển về đề tài du hành thời gian.",
            "Tại sao trò chơi điện tử lại có lợi cho việc giảm căng thẳng?",
            "Lịch sử phát triển của dòng máy game cầm tay từ GameBoy đến Switch.",
            "Top 5 bộ phim đoạt giải Oscar có kịch bản xoắn não nhất.",
            "Xu hướng của ngành công nghiệp eSports trong thập kỷ tới."
        ]
    },
    {
        category: "Tài chính & Kinh tế",
        questions: [
            "Bitcoin và Ethereum khác nhau như thế nào?",
            "Những nguyên tắc cơ bản cho người mới bắt đầu đầu tư tài chính?",
            "Làm sao để quản lý chi tiêu cá nhân hiệu quả theo quy tắc 50/30/20?",
            "Lạm phát ảnh hưởng như thế nào đến sức mua của người tiêu dùng?",
            "Phân biệt giữa cổ phiếu, trái phiếu và quỹ chỉ số (ETF).",
            "Tự do tài chính (FIRE) là gì và làm sao để đạt được nó trước tuổi 40?"
        ]
    },
    {
        category: "Công nghệ & AI",
        questions: [
            "AI sẽ thay đổi thị trường việc làm như thế nào trong 5 năm tới?",
            "Hướng dẫn viết một hàm cơ bản bằng Python để kiểm tra số nguyên tố.",
            "Làm thế nào để tạo một trang web có thiết kế responsive bằng CSS?",
            "Sự khác biệt giữa Machine Learning và Deep Learning là gì?",
            "Web3 và Metaverse sẽ thay đổi cách chúng ta tương tác trên Internet ra sao?",
            "Cách bảo vệ dữ liệu cá nhân trước các cuộc tấn công mạng hiện đại."
        ]
    },
    {
        category: "Khoa học & Vũ trụ",
        questions: [
            "Lỗ đen là gì và điều gì xảy ra nếu vật chất rơi vào đó?",
            "Biến đổi khí hậu đang ảnh hưởng thế nào đến các rạn san hô?",
            "Thuyết tương đối của Einstein có thể giải thích đơn giản như thế nào?",
            "Khả năng con người định cư trên sao Hỏa trong tương lai gần.",
            "Sóng hấp dẫn là gì và tại sao việc phát hiện ra chúng lại quan trọng?",
            "Tại sao chúng ta vẫn chưa tìm thấy sự sống ngoài hành tinh (Nghịch lý Fermi)?"
        ]
    },
    {
        category: "Đời sống & Sức khỏe",
        questions: [
            "Công thức làm một món ăn sáng nhanh gọn nhưng đủ dinh dưỡng?",
            "Làm thế nào để cải thiện chất lượng giấc ngủ một cách tự nhiên?",
            "Kỹ thuật Pomodoro là gì và cách áp dụng hiệu quả?",
            "Lợi ích của việc thiền định đối với sức khỏe tâm thần hằng ngày.",
            "Chế độ ăn Intermittent Fasting (nhịn ăn gián đoạn) hoạt động như thế nào?",
            "Cách thiết lập thói quen đọc sách 30 phút mỗi ngày cho người bận rộn."
        ]
    },
    {
        category: "Văn hóa & Nghệ thuật",
        questions: [
            "Tìm hiểu về những di sản văn hóa thế giới nổi tiếng nhất của UNESCO.",
            "Kể cho tôi một câu chuyện đùa ngắn về công nghệ.",
            "Những cách hiệu quả nhất để tự học một ngôn ngữ mới tại nhà?",
            "Sự khác biệt giữa trường phái hội họa Ấn tượng và Biểu hiện.",
            "Tác động của văn hóa đại chúng (Pop Culture) đến tư duy của Gen Z.",
            "Lịch sử và ý nghĩa của các ngày lễ truyền thống lớn trên thế giới."
        ]
    },
    {
        category: "Phát triển bản thân",
        questions: [
            "Làm thế nào để xây dựng sự tự tin khi nói chuyện trước đám đông?",
            "Kỹ năng tư duy phản biện (Critical Thinking) là gì và cách rèn luyện?",
            "Sự khác biệt giữa tư duy cố định (Fixed Mindset) và tư duy phát triển (Growth Mindset).",
            "Cách lập kế hoạch hành động (Action Plan) để đạt được mục tiêu năm.",
            "Nghệ thuật thương lượng và đàm phán trong công việc.",
            "Làm sao để vượt qua sự trì hoãn (Procrastination) một cách triệt để?"
        ]
    },
    {
        category: "Lịch sử & Triết học",
        questions: [
            "Những nguyên nhân chính dẫn đến sự sụp đổ của Đế chế La Mã.",
            "Triết học Khắc kỷ (Stoicism) giúp ích gì cho cuộc sống hiện đại?",
            "Ý nghĩa của cuộc Cách mạng Công nghiệp lần thứ nhất đối với nhân loại.",
            "Chủ nghĩa hiện sinh (Existentialism) là gì qua góc nhìn của Jean-Paul Sartre?",
            "Những vị tướng tài ba nhất trong lịch sử quân sự thế giới.",
            "Sự hình thành và phát triển của Con đường tơ lụa cổ đại."
        ]
    }
];



async function initSuggestions() {
    const container = document.getElementById('suggestion-container');
    if (!container) return;
    container.innerHTML = '';

    // Trộn ngẫu nhiên các chủ đề
    const shuffledCategories = [...questionBank].sort(() => 0.5 - Math.random());
    
    // Lấy 4 chủ đề đầu tiên (hoặc số lượng bạn muốn)
    for (const item of shuffledCategories.slice(0, 4)) {
        const chip = document.createElement('div');
        chip.className = 'suggestion-chip';
        
        // Chọn ngẫu nhiên 1 câu hỏi trong chủ đề đó
        const randomQuestion = item.questions[Math.floor(Math.random() * item.questions.length)];
        
        // 1. Dịch nhãn chủ đề để hiển thị trên nút
        const translatedLabel = await translate(item.category);
        chip.innerText = translatedLabel;
        
        chip.onclick = async () => {
            // 2. Dịch câu hỏi đã chọn trước khi gửi
            const translatedQuery = await translate(randomQuestion);
            userInput.value = translatedQuery; 
            
            // 3. Tự động gửi đi
            sendMessage(); 
        };
        container.appendChild(chip);
    }
}



        async function sendMessage() {

            const prompt = userInput.value.trim();

            if ((!prompt && !selectedImageData) || isTyping) return;

            

            isTyping = true; sendBtn.disabled = true;

            

            // HIỂN THỊ GỐC: Không dịch nội dung user nhập

            renderMessage(prompt, 'user-message', null, true, selectedImageData);

            

            chatHistory.push({ role: "user", parts: [{ text: prompt || "Phân tích ảnh" }] });

            

            const loadingId = 'load-' + Date.now();

            const loadingMsg = await translate('Đang xử lý...');

            renderMessage(loadingMsg, 'bot-message typing', loadingId, false);

            userInput.value = ''; selectedImageData = null;



            try {

                const res = await fetch(WORKER_URL, { 

                    method: 'POST', 

                    body: JSON.stringify({ messages: chatHistory }) 

                });

                const data = await res.json();

                const botDiv = document.getElementById(loadingId);

                botDiv.classList.remove('typing'); botDiv.innerHTML = '';

                

                // HIỂN THỊ GỐC: AI trả về ngôn ngữ nào hiện ngôn ngữ đó (Chống dịch nhảm code)

                await typeText(botDiv, data.text);

                

                chatHistory.push({ role: "model", parts: [{ text: data.text }] });

                if (chatHistory.length > 10) chatHistory.splice(0, 2);

                localStorage.setItem('abc_chat_history', JSON.stringify(chatHistory));

            } catch (e) { 

                const errorMsg = await translate("Lỗi kết nối!");

                document.getElementById(loadingId).innerText = errorMsg; 

            }

            finally { isTyping = false; sendBtn.disabled = false; }

        }



async function typeText(el, txt) {
    let i = 0;
    const speed = 20; // Tốc độ gõ (ms mỗi ký tự), càng nhỏ càng nhanh
    el.innerHTML = ''; // Xóa trắng trước khi gõ

    return new Promise((resolve) => {
        function typing() {
            if (i < txt.length) {
                // Lấy phần văn bản đã "gõ" xong
                let currentText = txt.substring(0, i + 1);
                
                // Render Markdown và Highlight Code liên tục
                el.innerHTML = marked.parse(currentText);
                Prism.highlightAllUnder(el);
                
                // Tự động cuộn xuống theo dòng chữ
                chatWindow.scrollTop = chatWindow.scrollHeight;
                
                i++;
                setTimeout(typing, speed);
            } else {
                resolve();
            }
        }
        typing();
    });
}



        function renderMessage(t, c, id, mk, img) {

            const w = document.getElementById('welcome-screen'); if(w) w.remove();

            const d = document.createElement('div'); d.className = `message ${c}`; if(id) d.id = id;

            if(img) { const i = document.createElement('img'); i.src = img; i.className='img-msg'; d.appendChild(i); }

            if(t) { const s = document.createElement('span'); s.innerHTML = mk ? marked.parse(t) : t; d.appendChild(s); }

            chatWindow.appendChild(d); chatWindow.scrollTop = chatWindow.scrollHeight;

            if(mk) Prism.highlightAllUnder(d);

        }



        function clearChat() { 

            if(confirm("Xóa lịch sử?")) { 

                localStorage.removeItem('abc_chat_history'); 

                location.reload(); 

            } 

        }



        function handleFile(i) {

            const f = i.files[0]; if(!f) return;

            const r = new FileReader(); 

            r.onload = (e) => selectedImageData = e.target.result; 

            r.readAsDataURL(f);

        }



        window.onload = async () => {

            // Dịch giao diện tĩnh

            document.getElementById('welcome-title').innerText = await translate('Chào bạn!');

            document.getElementById('welcome-desc').innerText = await translate('Bạn hãy cùng trò chuyện với mình nhé');

            document.getElementById('btn-refresh-text').innerText = await translate('Đổi gợi ý khác');

            document.getElementById('user-input').placeholder = await translate('Hỏi gì đi ông anh...');



            if (chatHistory.length > 0) {

                for (const m of chatHistory) {

                    // Hiển thị lại lịch sử cũng giữ nguyên ngôn ngữ gốc

                    renderMessage(m.parts[0].text, m.role==='user'?'user-message':'bot-message', null, true);

                }

            } else {

                initSuggestions();

            }

            setTimeout(() => document.getElementById('iframe-loader')?.remove(), 600);

        };



        userInput.addEventListener('keypress', e => e.key === 'Enter' && sendMessage());

    </script>
</body>
</html>
