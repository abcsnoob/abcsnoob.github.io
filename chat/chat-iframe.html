<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abc's Noob AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
<style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; }
        
        #iframe-loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        
        .chat-card { background: #fff; height: 100vh; display: flex; flex-direction: column; max-width: 1000px; margin: 0 auto; box-shadow: 0 0 20px rgba(0,0,0,0.1); position: relative; }
        
        .chat-header { background: #212529; color: white; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; z-index: 10; }
        .chat-header strong { font-size: 16px; }

        #chat-window { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            background: #fff; 
            scroll-behavior: smooth;
        }
        
        #welcome-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; padding: 20px; }
        #welcome-screen img { width: 80px; height: 80px; border-radius: 50%; margin-bottom: 15px; }
        
        .suggestion-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 15px; width: 100%; }
        .suggestion-chip { padding: 6px 12px; background: #f8f9fa; border: 1px solid #ddd; border-radius: 18px; font-size: 13px; cursor: pointer; }

        .message { max-width: 85%; padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.4; word-wrap: break-word; position: relative; }
        .user-message { align-self: flex-end; background: #0d6efd; color: white; border-bottom-right-radius: 2px; }
        .bot-message { align-self: flex-start; background: #f1f0f0; color: #333; border-bottom-left-radius: 2px; }
        
        .chat-footer { padding: 10px; border-top: 1px solid #eee; background: white; }
        .input-group { background: #f8f9fa; border-radius: 25px; padding: 2px 10px; border: 1px solid #ddd; display: flex; align-items: center; }
        #user-input { border: none; background: transparent; outline: none; flex: 1; height: 38px; padding: 0 10px; font-size: 15px; }
        
        /* Chỉnh sửa hiển thị ảnh */
        .img-container { position: relative; display: inline-block; cursor: zoom-in; margin-top: 5px; }
        .img-msg { max-width: 100%; max-height: 300px; border-radius: 10px; display: block; }
        .download-btn { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.5); color: white; border: none; border-radius: 50%; width: 28px; height: 28px; opacity: 0.8; }

        /* Spinner & Typing */
        .typing::after { content: '...'; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        #stop-btn { display: none; border-radius: 50%; width: 35px; height: 35px; margin-right: 5px; }

        /* RESPONSIVE QUERIES */
        @media (max-width: 768px) {
            .chat-card { width: 100%; height: 100vh; border-radius: 0; }
            .message { max-width: 92%; font-size: 14px; }
            .chat-header strong { font-size: 14px; }
            .chat-header .fa-expand { display: none; } /* Mobile không cần nút này lắm */
            .img-msg { max-height: 200px; }
            .suggestion-chip { font-size: 12px; }
        }

        /* Fullscreen Image */
        img:fullscreen { object-fit: contain; background: black; }
        img:-webkit-full-screen { object-fit: contain; background: black; }
    </style>
</head>
<body>
    <div id="iframe-loader"><div class="spinner-grow text-primary"></div></div>
    
    <div class="chat-card" id="main-app">
        <div class="chat-header">
            <div class="notranslate">
                <i class="fa-solid fa-robot me-2"></i><strong>Abc's Noob AI</strong>
            </div>
            <div class="d-flex align-items-center">
                <i class="fa-solid fa-expand me-3" title="Toàn màn hình" style="cursor:pointer" onclick="toggleFullScreen()"></i>
                <i class="fa-solid fa-file-import me-3" title="Dán ID chia sẻ" style="cursor:pointer" onclick="importShareId()"></i>
                <i class="fa-solid fa-share-nodes me-3" title="Chia sẻ hội thoại" style="cursor:pointer" onclick="shareChat()"></i>
                <i class="fa-solid fa-trash-can me-3" style="cursor:pointer" onclick="clearChat()"></i>
                <span class="badge rounded-pill bg-success notranslate">Online</span>
            </div>
        </div>

        <div id="chat-window">
            <div id="welcome-screen">
                <img src="/assets/image/abcsnoob.webp" alt="Logo" onerror="this.src='https://via.placeholder.com/100'">
                <h4 id="welcome-title">Chào bạn!</h4>
                <p id="welcome-desc">Bạn hãy cùng trò chuyện với mình nhé</p>
                <div id="suggestion-container" class="suggestion-container"></div>
                <button class="refresh-btn" onclick="initSuggestions()">
                    <i class="fa-solid fa-rotate me-1"></i> <span id="btn-refresh-text">Đổi gợi ý khác</span>
                </button>
            </div>
        </div>

        <div class="chat-footer">
            <div class="input-group">
                <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleFile(this)">
                <button style="border:none; background:none" onclick="document.getElementById('file-input').click()">
                    <i class="fa-solid fa-image text-muted"></i>
                </button>
                
                <input type="text" id="user-input" placeholder="Hỏi gì đi ông anh..." autocomplete="off">
                
                <button id="stop-btn" class="btn btn-outline-danger border-0" onclick="stopTyping()">
                    <i class="fa-solid fa-circle-stop"></i>
                </button>

                <button class="btn btn-primary" id="send-btn" style="border-radius:50%; width:40px; height:40px" onclick="sendMessage()">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script>
const USER_LANG = localStorage.getItem('user_lang') || 'vi';
const WORKER_URL = 'https://abcsnoobai.abcsnoob.workers.dev';
const chatWindow = document.getElementById('chat-window');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const stopBtn = document.getElementById('stop-btn');

let isTyping = false, 
    abortTyping = false, 
    selectedImageData = null,      
    selectedImageBase64 = null,   
    selectedImageMime = null;     

let chatHistory = JSON.parse(localStorage.getItem('abc_chat_history')) || [];

const questionBank = [
    { category: "Công nghệ", questions: ["AI sẽ thay đổi việc làm thế nào?", "Cách học code nhanh nhất?"] },
    { category: "Giải trí", questions: ["Phim nào hay trên Netflix?", "Gợi ý game thế giới mở."] },
    { category: "Sức khỏe", questions: ["Cách ngủ ngon tự nhiên?", "Bài tập 5 phút tại chỗ."] }
];

// --- HÀM FULLSCREEN TOÀN APP ---
function toggleFullScreen() {
    const elem = document.documentElement;
    if (!document.fullscreenElement) {
        elem.requestFullscreen().catch(err => {
            alert(`Lỗi: ${err.message}`);
        });
    } else {
        document.exitFullscreen();
    }
}

// --- HÀM PHÓNG TO ẢNH ---
function openFullScreenImage(imgElement) {
    if (imgElement.requestFullscreen) {
        imgElement.requestFullscreen();
    } else if (imgElement.webkitRequestFullscreen) {
        imgElement.webkitRequestFullscreen();
    } else if (imgElement.msRequestFullscreen) {
        imgElement.msRequestFullscreen();
    }
}

// --- HÀM CHIA SẺ ---
async function shareChat() {
    if (!chatHistory || chatHistory.length === 0) {
        Toastify({ text: "Chưa có gì để share hết ông giáo ạ!", background: "orange" }).showToast();
        return;
    }

    const loadToast = Toastify({ text: "Đang đóng gói và gửi lên GitHub Gist...", duration: -1 }).showToast();

    try {
        const response = await fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                action: 'share',
                data: {
                    history: chatHistory,
                    timestamp: new Date().toISOString()
                }
            })
        });

        const result = await response.json();

        if (result.success && result.shareId) {
            const shareUrl = `${window.location.origin}${window.location.pathname}?shareId=${result.shareId}`;
            await navigator.clipboard.writeText(shareUrl);
            loadToast.hideToast();
            Toastify({ 
                text: "✅ Đã copy link chia sẻ vĩnh viễn!", 
                duration: 5000,
                style: { background: "linear-gradient(to right, #00b09b, #96c93d)" }
            }).showToast();
        } else {
            throw new Error("Worker không tạo được Gist");
        }
    } catch (e) {
        loadToast.hideToast();
        Toastify({ text: "Lỗi: " + e.message, background: "#f44336" }).showToast();
    }
}

async function importShareId() {
    const shareId = prompt("Nhập ID chia sẻ:");
    if (!shareId) return;

    // Hiện spinner khi đang import
    const importToast = Toastify({ text: " đang tải hội thoại...", duration: -1, avatar: "https://i.gifer.com/ZKZg.gif" }).showToast();

    try {
        const res = await fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'get_share', shareId: shareId.trim() })
        });
        const result = await res.json();
        
        if (result.success) {
            chatWindow.innerHTML = ''; // Xóa màn hình hiện tại
            result.data.history.forEach(m => {
                const txt = m.parts.find(p => p.text)?.text || "";
                const imgPart = m.parts.find(p => p.inline_data);
                const imgSrc = imgPart ? `data:${imgPart.inline_data.mime_type};base64,${imgPart.inline_data.data}` : null;
                renderMessage(txt, m.role === 'user' ? 'user-message' : 'bot-message', null, true, imgSrc);
            });
            window.history.pushState({}, '', `?shareId=${shareId}`);
            importToast.hideToast();
            Toastify({ text: "Đã nhập thành công!", background: "green" }).showToast();
        } else {
            alert("Không tìm thấy ID này!");
            importToast.hideToast();
        }
    } catch (e) { 
        alert("Lỗi tải ID!"); 
        importToast.hideToast();
    }
}

// --- TIỆN ÍCH ---
async function translate(text) {
    if (!text || USER_LANG === 'vi') return text;
    try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=vi&tl=${USER_LANG}&dt=t&q=${encodeURIComponent(text)}`);
        const json = await res.json();
        return json[0].map(item => item[0]).join('');
    } catch (e) { return text; }
}

function stopTyping() { abortTyping = true; }

function clearChat() {
    if(confirm("Xóa lịch sử trò chuyện?")) {
        localStorage.removeItem('abc_chat_history');
        location.reload();
    }
}

// --- XỬ LÝ HÌNH ẢNH ---
function handleFile(input) {
    const file = input.files[0];
    if (!file) return;

    Toastify({ text: "Đang nén ảnh...", duration: 1000 }).showToast();

    const reader = new FileReader();
    reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 1024; 
            let width = img.width;
            let height = img.height;

            if (width > MAX_WIDTH) {
                height *= MAX_WIDTH / width;
                width = MAX_WIDTH;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            
            const compressedData = canvas.toDataURL('image/jpeg', 0.7);
            
            selectedImageData = compressedData; 
            selectedImageBase64 = compressedData.split(',')[1];
            selectedImageMime = 'image/jpeg';
            
            Toastify({ text: "Đã sẵn sàng gửi ảnh!", duration: 2000, style: { background: "green" } }).showToast();
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

async function sendMessage() {
    const prompt = userInput.value.trim();
    if ((!prompt && !selectedImageBase64) || isTyping) return;

    isTyping = true; abortTyping = false;
    sendBtn.disabled = true;
    stopBtn.style.display = 'inline-block';

    renderMessage(prompt, 'user-message', null, true, selectedImageData);

    let userParts = [];
    if (prompt) userParts.push({ text: prompt });
    if (selectedImageBase64) {
        userParts.push({
            inline_data: { mime_type: selectedImageMime, data: selectedImageBase64 }
        });
    }

    chatHistory.push({ role: "user", parts: userParts });

    const loadingId = 'load-' + Date.now();
    renderMessage('...', 'bot-message typing', loadingId, false);
    
    userInput.value = '';
    const tempImg = selectedImageData;
    selectedImageData = null;
    selectedImageBase64 = null;
    document.getElementById('file-input').value = '';

    try {
        const res = await fetch(WORKER_URL, { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages: chatHistory, user_lang: USER_LANG }) 
        });
        
        const data = await res.json();
        const botDiv = document.getElementById(loadingId);
        botDiv.classList.remove('typing');
        botDiv.innerHTML = '';

        await typeText(botDiv, data.text);

        if(data.provider) {
            const pTag = document.createElement('small');
            pTag.style = "font-size: 10px; color: #999; display: block; margin-top: 5px; font-style: italic;";
            pTag.innerText = 'Powered by ' + data.provider;
            botDiv.appendChild(pTag);
        }

        chatHistory.push({ role: "model", parts: [{ text: data.text }] });
        
        const historyToSave = chatHistory.slice(-10).map(msg => ({
            role: msg.role,
            parts: msg.parts.filter(p => p.text) 
        }));
        localStorage.setItem('abc_chat_history', JSON.stringify(historyToSave));

    } catch (e) {
        const errDiv = document.getElementById(loadingId);
        if(errDiv) errDiv.innerText = "Lỗi kết nối!";
    } finally {
        isTyping = false; sendBtn.disabled = false;
        stopBtn.style.display = 'none';
    }
}

async function typeText(el, txt) {
    let i = 0;
    return new Promise((resolve) => {
        function typing() {
            if (i < txt.length && !abortTyping) {
                i++;
                el.innerHTML = marked.parse(txt.substring(0, i));
                Prism.highlightAllUnder(el);
                chatWindow.scrollTop = chatWindow.scrollHeight;
                setTimeout(typing, 10); 
            } else { 
                if(abortTyping) el.innerHTML = marked.parse(txt.substring(0, i) + " [Đã dừng]");
                resolve(); 
            }
        }
        typing();
    });
}

function renderMessage(t, c, id, mk, img) {
    const welcome = document.getElementById('welcome-screen'); 
    if(welcome) welcome.remove();

    const msgDiv = document.createElement('div'); 
    msgDiv.className = `message ${c}`; 
    if(id) msgDiv.id = id;

    if(img) { 
        const container = document.createElement('div');
        container.className = 'img-container';
        container.onclick = () => openFullScreenImage(imageEl); // Click để xem full screen
        
        const imageEl = document.createElement('img'); 
        imageEl.src = img; 
        imageEl.className = 'img-msg'; 
        
        const dlBtn = document.createElement('button');
        dlBtn.className = 'download-btn';
        dlBtn.innerHTML = '<i class="fa-solid fa-download"></i>';
        dlBtn.onclick = (e) => {
            e.stopPropagation();
            const link = document.createElement('a');
            link.href = img;
            link.download = `img-${Date.now()}.png`;
            link.click();
        };
        
        container.appendChild(imageEl);
        container.appendChild(dlBtn);
        msgDiv.appendChild(container); 
    }

    if(t) { 
        const textSpan = document.createElement('span'); 
        textSpan.innerHTML = mk ? marked.parse(t) : t; 
        msgDiv.appendChild(textSpan); 
    }

    chatWindow.appendChild(msgDiv);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    if(mk) Prism.highlightAllUnder(msgDiv);
}

async function initSuggestions() {
    const container = document.getElementById('suggestion-container');
    if (!container) return;
    container.innerHTML = '';
    const shuffled = [...questionBank].sort(() => 0.5 - Math.random());
    for (const item of shuffled.slice(0, 3)) {
        const chip = document.createElement('div');
        chip.className = 'suggestion-chip';
        chip.innerText = await translate(item.category);
        chip.onclick = async () => {
            const q = item.questions[Math.floor(Math.random() * item.questions.length)];
            userInput.value = await translate(q);
            sendMessage();
        };
        container.appendChild(chip);
    }
}

async function loadSharedChat(shareId) {
    // Spinner cho trường hợp load từ URL tham số
    const importToast = Toastify({ text: "Đang tải hội thoại chia sẻ...", duration: -1 }).showToast();
    try {
        const res = await fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'get_share', shareId: shareId.trim() })
        });
        const result = await res.json();
        if (result.success) {
            result.data.history.forEach(m => {
                const txt = m.parts.find(p => p.text)?.text || "";
                const imgPart = m.parts.find(p => p.inline_data);
                const imgSrc = imgPart ? `data:${imgPart.inline_data.mime_type};base64,${imgPart.inline_data.data}` : null;
                renderMessage(txt, m.role === 'user' ? 'user-message' : 'bot-message', null, true, imgSrc);
            });
        }
    } catch (e) { console.error(e); }
    finally { importToast.hideToast(); }
}

window.onload = async () => {
    const urlParams = new URLSearchParams(window.location.search);
    const shareId = urlParams.get('shareId');

    if (shareId) {
        await loadSharedChat(shareId);
    } else if (chatHistory.length > 0) {
        chatHistory.forEach(m => {
            const txt = m.parts.find(p => p.text)?.text || "";
            const imgPart = m.parts.find(p => p.inline_data);
            const imgSrc = imgPart ? `data:${imgPart.inline_data.mime_type};base64,${imgPart.inline_data.data}` : null;
            renderMessage(txt, m.role === 'user' ? 'user-message' : 'bot-message', null, true, imgSrc);
        });
    } else {
        initSuggestions();
    }
    setTimeout(() => document.getElementById('iframe-loader')?.remove(), 600);
};

userInput.addEventListener('keypress', e => { if(e.key === 'Enter') sendMessage(); });
</script>
</body>
</html>
