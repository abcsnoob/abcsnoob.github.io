<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abc's Noob AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; }
        #iframe-loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: flex; justify-content: center; align-items: center; z-index: 9999; transition: 0.4s; }
        .chat-card { background: #fff; height: 100vh; display: flex; flex-direction: column; }
        .chat-header { background: #212529; color: white; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #fff; scroll-behavior: smooth; position: relative; }
        
        /* Welcome Screen Styling */
        #welcome-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; color: #555; }
        #welcome-screen img { width: 100px; height: 100px; border-radius: 50%; margin-bottom: 15px; border: 2px solid #eee; }
        .suggestion-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 20px; max-width: 400px; }
        .suggestion-chip { padding: 8px 16px; background: #f8f9fa; border: 1px solid #ddd; border-radius: 20px; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .suggestion-chip:hover { background: #0d6efd; color: white; border-color: #0d6efd; }

        .message { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.5; word-wrap: break-word; }
        .user-message { align-self: flex-end; background: #0d6efd; color: white; border-bottom-right-radius: 2px; }
        .bot-message { align-self: flex-start; background: #f1f0f0; color: #333; border-bottom-left-radius: 2px; }
        pre { background: #2d2d2d !important; padding: 12px; border-radius: 10px; overflow-x: auto; margin: 10px 0; }
        .chat-footer { padding: 15px; border-top: 1px solid #eee; background: #fff; }
        .input-group { background: #f8f9fa; border-radius: 30px; padding: 5px 15px; border: 1px solid #ddd; display: flex; align-items: center; }
        #user-input { border: none; background: transparent; outline: none; flex: 1; height: 40px; }
        .btn-action { border: none; background: none; color: #666; margin-right: 10px; transition: 0.3s; }
        .btn-action:hover { color: #0d6efd; }
        .preview-container { display: none; padding: 10px 20px; border-top: 1px solid #eee; position: relative; background: #fafafa; }
        .preview-img { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; }
        .remove-img { position: absolute; top: 5px; left: 55px; cursor: pointer; background: #ff4d4d; color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; }
        .img-msg { max-width: 100%; max-height: 250px; border-radius: 10px; margin-bottom: 8px; display: block; cursor: pointer; }
    </style>
</head>
<body>
    <div id="iframe-loader"><div class="spinner-grow text-primary"></div></div>

    <div class="chat-card">
        <div class="chat-header">
            <div><i class="fa-solid fa-robot me-2"></i><strong>Abc's Noob AI</strong></div>
            <div class="d-flex align-items-center">
                <i class="fa-solid fa-trash-can me-3" style="cursor:pointer" onclick="clearChat()" title="Xóa lịch sử"></i>
                <span class="badge rounded-pill bg-success" style="font-size: 0.7rem;">Online</span>
            </div>
        </div>
        
        <div id="chat-window">
            <div id="welcome-screen">
                <img src="/assets/image/abcsnoob.webp" alt="Logo" onerror="this.src='https://via.placeholder.com/100'">
                <h4>Chào bạn!</h4>
                <p>Bạn hãy cùng trò chuyện với mình nhé</p>
                <div class="suggestion-container">
                    <div class="suggestion-chip" onclick="setQuery('Minecraft có những gì?')">Minecraft</div>
                    <div class="suggestion-chip" onclick="setQuery('Bitcoin được ai tạo ra?')">Bitcoin</div>
                    <div class="suggestion-chip" onclick="setQuery('AI là gì?')">Công nghệ</div>
                    <div class="suggestion-chip" onclick="setQuery('Mình rảnh quá, có câu chuyện cười nào không nhỉ?')">Rảnh háng</div>
                    <div class="suggestion-chip" onclick="setQuery('Có meme nào hay không?')">Meme</div>
                </div>
            </div>
        </div>

        <div class="preview-container" id="preview-container">
            <img src="" class="preview-img" id="img-preview">
            <div class="remove-img" onclick="removeImage()"><i class="fa-solid fa-xmark"></i></div>
        </div>

        <div class="chat-footer">
            <div class="input-group">
                <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleFile(this)">
                <button class="btn-action" onclick="document.getElementById('file-input').click()"><i class="fa-solid fa-image"></i></button>
                <input type="text" id="user-input" placeholder="Hỏi gì đi ông anh..." autocomplete="off">
                <button class="btn btn-primary btn-send" style="border-radius:50%; width:40px; height:40px" id="send-btn" onclick="sendMessage()">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    
    <script>
        const WORKER_URL = 'https://abcsnoobai.abcsnoob.workers.dev';
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        let isTyping = false;
        let selectedImageData = null;
        let chatHistory = JSON.parse(localStorage.getItem('abc_chat_history')) || [];

        function showToast(text, type = "info") {
            Toastify({ text, duration: 2500, gravity: "top", position: "right", style: { background: type === "error" ? "#ff4d4d" : "#212529" } }).showToast();
        }

        function setQuery(text) {
            userInput.value = text;
            sendMessage();
        }

        function handleFile(input) {
            const file = input.files[0];
            if (file) {
                if (file.size > 1 * 1024 * 1024) {
                    showToast("Ảnh quá nặng (>1MB)! Nén lại đi ông anh.", "error");
                    input.value = ''; return;
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    selectedImageData = e.target.result;
                    document.getElementById('img-preview').src = selectedImageData;
                    document.getElementById('preview-container').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            selectedImageData = null;
            document.getElementById('preview-container').style.display = 'none';
            document.getElementById('file-input').value = '';
        }

        window.onload = () => {
            if (chatHistory.length > 0) {
                const welcome = document.getElementById('welcome-screen');
                if (welcome) welcome.remove();
                
                chatHistory.forEach(msg => {
                    const text = msg.parts.find(p => p.text)?.text || "";
                    const img = msg.parts.find(p => p.inline_data)?.inline_data?.data;
                    renderMessage(text, msg.role === 'user' ? 'user-message' : 'bot-message', null, true, img);
                });
            }
            setTimeout(() => { document.getElementById('iframe-loader').remove(); userInput.focus(); }, 600);
        };

        async function sendMessage() {
            const prompt = userInput.value.trim();
            if ((!prompt && !selectedImageData) || isTyping) return;

            sendBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
            sendBtn.disabled = true; isTyping = true;

            const currentParts = [];
            if (selectedImageData) {
                currentParts.push({ inline_data: { mime_type: "image/jpeg", data: selectedImageData.split(',')[1] } });
            }
            currentParts.push({ text: prompt || "Phân tích ảnh" });

            renderMessage(prompt, 'user-message', null, true, selectedImageData);
            chatHistory.push({ role: "user", parts: currentParts });
            
            const tempImg = selectedImageData;
            removeImage(); userInput.value = '';

            const loadingId = 'load-' + Date.now();
            renderMessage('Đang xử lý...', 'bot-message typing', loadingId, false);

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: chatHistory })
                });
                const data = await response.json();
                
                sendBtn.className = data.provider === 'groq' ? 'btn btn-warning btn-send' : 'btn btn-primary btn-send';
                if(data.provider === 'groq') showToast("Đã chuyển sang Groq Node", "info");

                const botMsgDiv = document.getElementById(loadingId);
                botMsgDiv.classList.remove('typing'); botMsgDiv.innerHTML = '';
                
                await typeText(botMsgDiv, data.text || "Lỗi phản hồi!");
                chatHistory.push({ role: "model", parts: [{ text: data.text }] });
                if (chatHistory.length > 10) chatHistory.splice(0, 2);
                localStorage.setItem('abc_chat_history', JSON.stringify(chatHistory));
            } catch (err) {
                showToast("Server lag rồi!", "error");
                document.getElementById(loadingId).innerText = "Lỗi node!";
            } finally {
                isTyping = false; sendBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i>';
                sendBtn.disabled = false; chatWindow.scrollTop = chatWindow.scrollHeight;
            }
        }

        async function typeText(el, txt) {
            let i = 0;
            return new Promise(res => {
                function t() {
                    if (i < txt.length) {
                        el.innerHTML = marked.parse(txt.substring(0, i + 1));
                        Prism.highlightAllUnder(el); i++;
                        chatWindow.scrollTop = chatWindow.scrollHeight;
                        setTimeout(t, 5);
                    } else res();
                } t();
            });
        }

        function renderMessage(text, className, id, mk, imgData = null) {
            // Xóa màn hình chào nếu nó đang hiển thị
            const welcome = document.getElementById('welcome-screen');
            if (welcome) welcome.remove();

            const div = document.createElement('div');
            div.className = `message ${className}`;
            if(id) div.id = id;
            if(imgData) {
                const img = document.createElement('img');
                img.src = imgData.startsWith('data:') ? imgData : `data:image/jpeg;base64,${imgData}`;
                img.className = 'img-msg';
                div.appendChild(img);
            }
            if(text) {
                const txtSpan = document.createElement('span');
                txtSpan.innerHTML = mk ? marked.parse(text) : text;
                div.appendChild(txtSpan);
            }
            chatWindow.appendChild(div);
            if(mk) Prism.highlightAllUnder(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function clearChat() {
            if(confirm("Xóa lịch sử node?")) { 
                localStorage.removeItem('abc_chat_history'); 
                showToast("Đã dọn dẹp!"); 
                setTimeout(() => location.reload(), 800); 
            }
        }
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
