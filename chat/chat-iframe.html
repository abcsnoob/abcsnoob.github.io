<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abc's Noob AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #f4f7f6; }
        
        /* Hiệu ứng Fade In cho tin nhắn */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message { 
            max-width: 85%; 
            padding: 12px 16px; 
            border-radius: 18px; 
            font-size: 15px; 
            line-height: 1.5; 
            word-wrap: break-word; 
            position: relative;
            animation: fadeIn 0.4s ease-out forwards; /* Thêm hiệu ứng fade in */
        }

        #iframe-loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .chat-card { background: #fff; height: 100vh; display: flex; flex-direction: column; }
        .chat-header { background: #212529; color: white; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #fff; scroll-behavior: smooth; }
        
        #welcome-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100%; text-align: center; animation: fadeIn 0.8s ease; }
        #welcome-screen img { width: 100px; height: 100px; border-radius: 50%; margin-bottom: 15px; border: 2px solid #eee; }
        
        .suggestion-chip { padding: 8px 16px; background: #f8f9fa; border: 1px solid #ddd; border-radius: 20px; font-size: 14px; cursor: pointer; transition: 0.3s; }
        .suggestion-chip:hover { background: #0d6efd; color: white; transform: scale(1.05); }

        .user-message { align-self: flex-end; background: #0d6efd; color: white; border-bottom-right-radius: 2px; }
        .bot-message { align-self: flex-start; background: #f1f0f0; color: #333; border-bottom-left-radius: 2px; border: 1px solid #e0e0e0; }
        
        .chat-footer { padding: 15px; border-top: 1px solid #eee; background: white; }
        .input-group { background: #f8f9fa; border-radius: 30px; padding: 5px 15px; border: 1px solid #ddd; transition: 0.3s; }
        .input-group:focus-within { border-color: #0d6efd; box-shadow: 0 0 8px rgba(13,110,253,0.1); }
        #user-input { border: none; background: transparent; outline: none; flex: 1; height: 40px; }
        
        .msg-actions { margin-top: 8px; border-top: 1px solid #e0e0e0; padding-top: 5px; display: flex; gap: 15px; font-size: 12px; color: #666; opacity: 0.7; }
        .msg-actions i:hover { color: #0d6efd; opacity: 1; }
        
        /* Typing effect dots */
        .typing::after { content: '...'; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div id="iframe-loader"><div class="spinner-grow text-primary"></div></div>
    
    <div class="chat-card">
        <div class="chat-header">
            <div><i class="fa-solid fa-robot me-2"></i><strong>Abc's Noob AI</strong></div>
            <div class="d-flex">
                <i class="fa-solid fa-gear me-3" style="cursor:pointer" data-bs-toggle="modal" data-bs-target="#settingsModal"></i>
                <i class="fa-solid fa-trash-can" style="cursor:pointer" onclick="clearChat()"></i>
            </div>
        </div>

        <div id="chat-window">
            <div id="welcome-screen">
                <img src="/assets/image/abcsnoob.webp" alt="Logo" onerror="this.src='https://via.placeholder.com/100'">
                <h4 id="welcome-title">Chào bạn!</h4>
                <p id="welcome-desc">Mình có thể giúp gì cho bạn hôm nay?</p>
                <div id="suggestion-container" class="suggestion-container d-flex flex-wrap justify-content-center gap-2"></div>
            </div>
        </div>

        <div class="chat-footer">
            <div class="input-group">
                <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleFile(this)">
                <button class="btn" onclick="document.getElementById('file-input').click()"><i class="fa-solid fa-image text-primary"></i></button>
                <input type="text" id="user-input" placeholder="Nhập tin nhắn..." autocomplete="off">
                <button class="btn btn-primary" id="send-btn" style="border-radius:50%; width:40px; height:40px" onclick="sendMessage()">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="modal fade" id="settingsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header"><h5>Cấu hình Node</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <label class="form-label">Độ sáng tạo (Temp)</label>
                    <input type="range" class="form-range" min="0" max="2" step="0.1" id="setting-temp">
                    <label class="form-label mt-3">Ngôn ngữ</label>
                    <select class="form-select" id="setting-lang">
                        <option value="auto">Tự động</option>
                        <option value="vi">Tiếng Việt</option>
                        <option value="en">English</option>
                    </select>
                </div>
                <div class="modal-footer"><button class="btn btn-primary w-100" onclick="saveSettings()">Lưu thay đổi</button></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

    <script>
        const WORKER_URL = 'https://abcsnoobai.abcsnoob.workers.dev';
        let config = JSON.parse(localStorage.getItem('abc_config')) || { temp: 1.4, lang: 'auto' };
        let chatHistory = JSON.parse(localStorage.getItem('abc_chat_history')) || [];
        const CURRENT_LANG = config.lang === 'auto' ? (navigator.language.startsWith('vi') ? 'vi' : 'en') : config.lang;

        // Dịch thuật đơn giản cho UI
        async function translate(text) {
            if (CURRENT_LANG === 'vi') return text;
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=vi&tl=${CURRENT_LANG}&dt=t&q=${encodeURIComponent(text)}`);
                const json = await res.json();
                return json[0][0][0];
            } catch { return text; }
        }

        function renderMessage(text, type, id = null, isMarkdown = true, img = null) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;
            if(id) msgDiv.id = id;
            
            if(img) {
                const image = document.createElement('img');
                image.src = img; image.style.maxWidth = '100%'; image.style.borderRadius = '10px';
                msgDiv.appendChild(image);
            }

            if(text) {
                const span = document.createElement('span');
                const cleanText = text.replace(/\(System:.*?\)\n\n/g, "");
                span.innerHTML = isMarkdown ? marked.parse(cleanText) : cleanText;
                msgDiv.appendChild(span);
            }

            document.getElementById('chat-window').appendChild(msgDiv);
            document.getElementById('chat-window').scrollTop = document.getElementById('chat-window').scrollHeight;
            Prism.highlightAllUnder(msgDiv);
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const prompt = input.value.trim();
            if(!prompt || isTyping) return;

            window.isTyping = true;
            document.getElementById('welcome-screen')?.remove();
            renderMessage(prompt, 'user-message');
            input.value = '';

            const loadingId = 'bot-' + Date.now();
            renderMessage('Đang suy nghĩ', 'bot-message typing', loadingId, false);

            try {
                const res = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ 
                        messages: [...chatHistory, {role: "user", parts: [{text: prompt}]}],
                        settings: config 
                    })
                });
                const data = await res.json();
                
                const botMsg = document.getElementById(loadingId);
                botMsg.classList.remove('typing');
                botMsg.innerHTML = marked.parse(data.text);
                
                chatHistory.push({role: "user", parts: [{text: prompt}]}, {role: "model", parts: [{text: data.text}]});
                localStorage.setItem('abc_chat_history', JSON.stringify(chatHistory.slice(-20)));
            } catch {
                document.getElementById(loadingId).innerText = "Lỗi kết nối!";
            } finally { window.isTyping = false; }
        }

        function saveSettings() {
            config.temp = document.getElementById('setting-temp').value;
            config.lang = document.getElementById('setting-lang').value;
            localStorage.setItem('abc_config', JSON.stringify(config));
            location.reload();
        }

        function clearChat() {
            if(confirm("Xóa hết tin nhắn?")) {
                localStorage.removeItem('abc_chat_history');
                location.reload();
            }
        }

        window.onload = async () => {
            document.getElementById('setting-temp').value = config.temp;
            document.getElementById('setting-lang').value = config.lang;

            if(chatHistory.length > 0) {
                document.getElementById('welcome-screen')?.remove();
                chatHistory.forEach(m => renderMessage(m.parts[0].text, m.role === 'user' ? 'user-message' : 'bot-message'));
            } else {
                const suggestions = ["Kể một câu chuyện hài", "AI có thể làm gì?", "Cách học code nhanh"];
                const container = document.getElementById('suggestion-container');
                for(let s of suggestions) {
                    const chip = document.createElement('div');
                    chip.className = 'suggestion-chip';
                    chip.innerText = await translate(s);
                    chip.onclick = () => { document.getElementById('user-input').value = s; sendMessage(); };
                    container.appendChild(chip);
                }
            }
            document.getElementById('iframe-loader').remove();
        };

        document.getElementById('user-input').addEventListener('keypress', e => e.key === 'Enter' && sendMessage());
    </script>
</body>
