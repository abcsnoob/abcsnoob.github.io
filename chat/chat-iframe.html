<!DOCTYPE html>
<html lang="vi" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abc's Noob AI</title>
    <link href="[https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css](https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css)" rel="stylesheet">
    <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css)"/>
    <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css](https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css)">
    <link rel="stylesheet" type="text/css" href="[https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css](https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css)">
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #iframe-loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .chat-card { background: #fff; height: 100vh; display: flex; flex-direction: column; }
        .chat-header { background: #212529; color: white; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #fff; position: relative; }
        
        #welcome-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; }
        #welcome-screen img { width: 100px; height: 100px; border-radius: 50%; margin-bottom: 15px; border: 2px solid #eee; }
        
        .suggestion-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 20px; max-width: 500px; }
        .suggestion-chip { padding: 8px 16px; background: #f8f9fa; border: 1px solid #ddd; border-radius: 20px; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .suggestion-chip:hover { background: #0d6efd; color: white; border-color: #0d6efd; }
        
        .message { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.5; word-wrap: break-word; }
        .user-message { align-self: flex-end; background: #0d6efd; color: white; border-bottom-right-radius: 2px; }
        .bot-message { align-self: flex-start; background: #f1f0f0; color: #333; border-bottom-left-radius: 2px; }
        
        /* Chặn trình duyệt tự dịch các vùng này */
        pre, code, .notranslate { translate: no !important; }

        .chat-footer { padding: 15px; border-top: 1px solid #eee; }
        .input-group { background: #f8f9fa; border-radius: 30px; padding: 5px 15px; border: 1px solid #ddd; display: flex; align-items: center; }
        #user-input { border: none; background: transparent; outline: none; flex: 1; height: 40px; }
        .img-msg { max-width: 100%; max-height: 250px; border-radius: 10px; margin-bottom: 8px; display: block; }
    </style>
</head>
<body>
    <div id="iframe-loader"><div class="spinner-grow text-primary"></div></div>
    
    <div class="chat-card">
        <div class="chat-header">
            <div id="notranslate" class="notranslate" translate="no">
                <i class="fa-solid fa-robot me-2"></i><strong>Abc's Noob AI</strong>
            </div>
            <div class="d-flex align-items-center">
                <i class="fa-solid fa-trash-can me-3" style="cursor:pointer" onclick="clearChat()"></i>
                <span class="badge rounded-pill bg-success notranslate">Online</span>
            </div>
        </div>

        <div id="chat-window">
            <div id="welcome-screen">
                <img src="/assets/image/abcsnoob.webp" alt="Logo" onerror="this.src='[https://via.placeholder.com/100](https://via.placeholder.com/100)'">
                <h4 id="welcome-title">Chào bạn!</h4>
                <p id="welcome-desc">Bạn hãy cùng trò chuyện với mình nhé</p>
                <div id="suggestion-container" class="suggestion-container"></div>
            </div>
        </div>

        <div class="chat-footer">
            <div class="input-group">
                <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleFile(this)">
                <button style="border:none; background:none" onclick="document.getElementById('file-input').click()">
                    <i class="fa-solid fa-image"></i>
                </button>
                <input type="text" id="user-input" placeholder="Hỏi gì đi ông anh..." autocomplete="off">
                <button class="btn btn-primary" id="send-btn" style="border-radius:50%; width:40px; height:40px" onclick="sendMessage()">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="[https://cdn.jsdelivr.net/npm/marked/marked.min.js](https://cdn.jsdelivr.net/npm/marked/marked.min.js)"></script>
    <script src="[https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js](https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js)"></script>

    <script>
        const TARGET_LANG = localStorage.getItem('user_lang') || 'vi';

        // --- HÀM DỊCH THÔNG MINH (CHẶN DỊCH CODE) ---
        async function smartTranslate(text) {
            if (!text || TARGET_LANG === 'vi') return text;

            // Regex để tìm các đoạn code block ```...```
            const codeBlocks = [];
            let placeholderText = text.replace(/```[\s\S]*?```/g, (match) => {
                codeBlocks.push(match);
                return `__CODE_BLOCK_${codeBlocks.length - 1}__`;
            });

            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=vi&tl=${TARGET_LANG}&dt=t&q=${encodeURIComponent(placeholderText)}`;
                const res = await fetch(url);
                const json = await res.json();
                let translatedText = json[0].map(item => item[0]).join('');

                // Trả lại các đoạn code nguyên bản vào văn bản đã dịch
                codeBlocks.forEach((code, index) => {
                    translatedText = translatedText.replace(`__CODE_BLOCK_${index}__`, code);
                });

                return translatedText;
            } catch (e) { return text; }
        }

        const WORKER_URL = 'https://abcsnoobai.abcsnoob.workers.dev';
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        let isTyping = false, selectedImageData = null;
        let chatHistory = JSON.parse(localStorage.getItem('abc_chat_history')) || [];

        async function sendMessage() {
            const prompt = userInput.value.trim();
            if ((!prompt && !selectedImageData) || isTyping) return;
            
            isTyping = true; sendBtn.disabled = true;
            
            const displayPrompt = await smartTranslate(prompt);
            renderMessage(displayPrompt, 'user-message', null, true, selectedImageData);
            
            chatHistory.push({ role: "user", parts: [{ text: prompt || "Phân tích ảnh" }] });
            
            const loadingId = 'load-' + Date.now();
            renderMessage('...', 'bot-message typing', loadingId, false);
            userInput.value = '';

            try {
                const res = await fetch(WORKER_URL, { method: 'POST', body: JSON.stringify({ messages: chatHistory }) });
                const data = await res.json();
                const botDiv = document.getElementById(loadingId);
                botDiv.classList.remove('typing');
                
                // DỊCH NHƯNG GIỮ NGUYÊN CODE
                const translatedBotText = await smartTranslate(data.text);
                await typeText(botDiv, translatedBotText);
                
                chatHistory.push({ role: "model", parts: [{ text: data.text }] });
                localStorage.setItem('abc_chat_history', JSON.stringify(chatHistory.slice(-10)));
            } catch (e) { document.getElementById(loadingId).innerText = "Error!"; }
            finally { isTyping = false; sendBtn.disabled = false; }
        }

        async function typeText(el, txt) {
            // Render Marked trước để tách biệt thẻ HTML
            el.innerHTML = marked.parse(txt);
            // Gán thuộc tính chặn dịch cho tất cả các thẻ code vừa tạo
            el.querySelectorAll('pre, code').forEach(node => {
                node.classList.add('notranslate');
                node.setAttribute('translate', 'no');
            });
            Prism.highlightAllUnder(el);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function renderMessage(t, c, id, mk, img) {
            const w = document.getElementById('welcome-screen'); if(w) w.remove();
            const d = document.createElement('div'); d.className = `message ${c} notranslate`; if(id) d.id = id;
            if(img) { const i = document.createElement('img'); i.src = img; i.className='img-msg'; d.appendChild(i); }
            if(t) { const s = document.createElement('span'); s.innerHTML = mk ? marked.parse(t) : t; d.appendChild(s); }
            chatWindow.appendChild(d); chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function clearChat() { localStorage.removeItem('abc_chat_history'); location.reload(); }
        function handleFile(i) {
            const f = i.files[0]; if(!f) return;
            const r = new FileReader(); r.onload = (e) => selectedImageData = e.target.result; r.readAsDataURL(f);
        }

        window.onload = async () => {
            if (chatHistory.length > 0) {
                for (const m of chatHistory) {
                    const t = await smartTranslate(m.parts[0].text);
                    renderMessage(t, m.role==='user'?'user-message':'bot-message', null, true);
                }
            }
            document.getElementById('iframe-loader')?.remove();
        };
    </script>
</body>
</html>
