<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abc's Noob AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #iframe-loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .chat-card { background: #fff; height: 100vh; display: flex; flex-direction: column; }
        .chat-header { background: #212529; color: white; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
        
        #chat-window { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            background: #fff; 
            position: relative;
            scroll-behavior: smooth;
        }
        
        #welcome-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; }
        #welcome-screen img { width: 100px; height: 100px; border-radius: 50%; margin-bottom: 15px; border: 2px solid #eee; }
        
        .suggestion-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 20px; max-width: 500px; }
        .suggestion-chip { padding: 8px 16px; background: #f8f9fa; border: 1px solid #ddd; border-radius: 20px; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .suggestion-chip:hover { background: #0d6efd; color: white; border-color: #0d6efd; }
        
        .refresh-btn { margin-top: 15px; font-size: 13px; color: #6c757d; cursor: pointer; text-decoration: underline; background: none; border: none; }
        .refresh-btn:hover { color: #0d6efd; }

        .message { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.5; word-wrap: break-word; position: relative; }
        .user-message { align-self: flex-end; background: #0d6efd; color: white; border-bottom-right-radius: 2px; }
        .bot-message { align-self: flex-start; background: #f1f0f0; color: #333; border-bottom-left-radius: 2px; }
        
        .chat-footer { padding: 15px; border-top: 1px solid #eee; }
        .input-group { background: #f8f9fa; border-radius: 30px; padding: 5px 15px; border: 1px solid #ddd; display: flex; align-items: center; gap: 5px; }
        #user-input { border: none; background: transparent; outline: none; flex: 1; height: 40px; }
        
        /* Chỉnh sửa hiển thị ảnh */
        .img-container { position: relative; display: inline-block; }
        .img-msg { max-width: 100%; max-height: 250px; border-radius: 10px; margin-bottom: 8px; display: block; }
        .download-btn { 
            position: absolute; top: 5px; right: 5px; 
            background: rgba(0,0,0,0.5); color: white; 
            border: none; border-radius: 50%; width: 30px; height: 30px; 
            cursor: pointer; opacity: 0; transition: 0.3s;
        }
        .img-container:hover .download-btn { opacity: 1; }

        .typing::after { content: '...'; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        #stop-btn { display: none; border-radius: 50%; width: 40px; height: 40px; transition: 0.3s; }
    </style>
</head>
<body>
    <div id="iframe-loader"><div class="spinner-grow text-primary"></div></div>
    
    <div class="chat-card">
        <div class="chat-header">
            <div class="notranslate">
                <i class="fa-solid fa-robot me-2"></i><strong>Abc's Noob AI</strong>
            </div>
            <div class="d-flex align-items-center">
                <i class="fa-solid fa-share-nodes me-3" title="Chia sẻ hội thoại" style="cursor:pointer" onclick="shareChat()"></i>
                <i class="fa-solid fa-trash-can me-3" style="cursor:pointer" onclick="clearChat()"></i>
                <span class="badge rounded-pill bg-success notranslate">Online</span>
            </div>
        </div>

        <div id="chat-window">
            <div id="welcome-screen">
                <img src="/assets/image/abcsnoob.webp" alt="Logo" onerror="this.src='https://via.placeholder.com/100'">
                <h4 id="welcome-title">Chào bạn!</h4>
                <p id="welcome-desc">Bạn hãy cùng trò chuyện với mình nhé</p>
                <div id="suggestion-container" class="suggestion-container"></div>
                <button class="refresh-btn" onclick="initSuggestions()">
                    <i class="fa-solid fa-rotate me-1"></i> <span id="btn-refresh-text">Đổi gợi ý khác</span>
                </button>
            </div>
        </div>

        <div class="chat-footer">
            <div class="input-group">
                <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleFile(this)">
                <button style="border:none; background:none" onclick="document.getElementById('file-input').click()">
                    <i class="fa-solid fa-image text-muted"></i>
                </button>
                
                <input type="text" id="user-input" placeholder="Hỏi gì đi ông anh..." autocomplete="off">
                
                <button id="stop-btn" class="btn btn-outline-danger border-0" onclick="stopTyping()">
                    <i class="fa-solid fa-circle-stop"></i>
                </button>

                <button class="btn btn-primary" id="send-btn" style="border-radius:50%; width:40px; height:40px" onclick="sendMessage()">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script>
const USER_LANG = localStorage.getItem('user_lang') || 'vi';
const WORKER_URL = 'https://abcsnoobai.abcsnoob.workers.dev';
const chatWindow = document.getElementById('chat-window');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const stopBtn = document.getElementById('stop-btn');

let isTyping = false, 
    abortTyping = false, 
    selectedImageData = null,      
    selectedImageBase64 = null,   
    selectedImageMime = null;     

let chatHistory = JSON.parse(localStorage.getItem('abc_chat_history')) || [];

const questionBank = [
    { category: "Công nghệ", questions: ["AI sẽ thay đổi việc làm thế nào?", "Cách học code nhanh nhất?"] },
    { category: "Giải trí", questions: ["Phim nào hay trên Netflix?", "Gợi ý game thế giới mở."] },
    { category: "Sức khỏe", questions: ["Cách ngủ ngon tự nhiên?", "Bài tập 5 phút tại chỗ."] }
];

// --- HÀM LƯU ẢNH ---
function downloadImage(base64Data) {
    const link = document.createElement('a');
    link.href = base64Data;
    link.download = `abcs-chat-img-${Date.now()}.png`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    Toastify({ text: "Đang tải ảnh xuống...", duration: 2000 }).showToast();
}

// --- HÀM CHIA SẺ ---
async function shareChat() {
    if (!chatHistory || chatHistory.length === 0) {
        Toastify({ text: "Chưa có gì để share hết ông giáo ạ!", background: "orange" }).showToast();
        return;
    }

    const loadToast = Toastify({ text: "Đang đóng gói và gửi lên GitHub Gist...", duration: -1 }).showToast();

    try {
        const response = await fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                action: 'share',
                data: {
                    history: chatHistory,
                    timestamp: new Date().toISOString()
                }
            })
        });

        const result = await response.json();

        if (result.success && result.shareId) {
            const shareUrl = `${window.location.origin}${window.location.pathname}?shareId=${result.shareId}`;
            await navigator.clipboard.writeText(shareUrl);
            loadToast.hideToast();
            Toastify({ 
                text: "✅ Đã copy link chia sẻ vĩnh viễn!", 
                duration: 5000,
                style: { background: "linear-gradient(to right, #00b09b, #96c93d)" }
            }).showToast();
        } else {
            throw new Error("Worker không tạo được Gist");
        }
    } catch (e) {
        loadToast.hideToast();
        Toastify({ text: "Lỗi: " + e.message, background: "#f44336" }).showToast();
    }
}

// --- TIỆN ÍCH ---
async function translate(text) {
    if (!text || USER_LANG === 'vi') return text;
    try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=vi&tl=${USER_LANG}&dt=t&q=${encodeURIComponent(text)}`);
        const json = await res.json();
        return json[0].map(item => item[0]).join('');
    } catch (e) { return text; }
}

function stopTyping() { abortTyping = true; }

function clearChat() {
    if(confirm("Xóa lịch sử trò chuyện? (Dữ liệu Bitcoin vẫn an toàn 🐧)")) {
        localStorage.removeItem('abc_chat_history');
        location.reload();
    }
}

// --- XỬ LÝ HÌNH ẢNH ---
function handleFile(input) {
    const file = input.files[0];
    if (!file) return;

    Toastify({ text: "Đang nén ảnh...", duration: 1000, gravity: "top", position: "center" }).showToast();

    const reader = new FileReader();
    reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 1024; 
            let width = img.width;
            let height = img.height;

            if (width > MAX_WIDTH) {
                height *= MAX_WIDTH / width;
                width = MAX_WIDTH;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            
            const compressedData = canvas.toDataURL('image/jpeg', 0.7);
            
            selectedImageData = compressedData; 
            selectedImageBase64 = compressedData.split(',')[1];
            selectedImageMime = 'image/jpeg';
            
            Toastify({ 
                text: "Đã sẵn sàng gửi ảnh!", 
                duration: 2000, 
                style: { background: "linear-gradient(to right, #00b09b, #96c93d)" } 
            }).showToast();
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

async function sendMessage() {
    const prompt = userInput.value.trim();
    if ((!prompt && !selectedImageBase64) || isTyping) return;

    isTyping = true; abortTyping = false;
    sendBtn.disabled = true;
    stopBtn.style.display = 'inline-block';

    renderMessage(prompt, 'user-message', null, true, selectedImageData);

    let userParts = [];
    if (prompt) userParts.push({ text: prompt });
    if (selectedImageBase64) {
        userParts.push({
            inline_data: {
                mime_type: selectedImageMime,
                data: selectedImageBase64
            }
        });
    }

    chatHistory.push({ role: "user", parts: userParts });

    const loadingId = 'load-' + Date.now();
    renderMessage('...', 'bot-message typing', loadingId, false);
    
    userInput.value = '';
    selectedImageData = null;
    selectedImageBase64 = null;
    document.getElementById('file-input').value = '';

    try {
        const res = await fetch(WORKER_URL, { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages: chatHistory, user_lang: USER_LANG }) 
        });
        
        const data = await res.json();
        const botDiv = document.getElementById(loadingId);
        botDiv.classList.remove('typing');
        botDiv.innerHTML = '';

        await typeText(botDiv, data.text);

        if(data.provider) {
            const pTag = document.createElement('small');
            pTag.style = "font-size: 10px; color: #999; display: block; margin-top: 5px; font-style: italic;";
            pTag.innerText = 'Powered by ' + data.provider;
            botDiv.appendChild(pTag);
        }

        chatHistory.push({ role: "model", parts: [{ text: data.text }] });
        
        const historyToSave = chatHistory.slice(-10).map(msg => ({
            role: msg.role,
            parts: msg.parts.filter(p => p.text) 
        }));
        localStorage.setItem('abc_chat_history', JSON.stringify(historyToSave));

    } catch (e) {
        const errDiv = document.getElementById(loadingId);
        if(errDiv) errDiv.innerText = "Lỗi kết nối! Có vẻ như node Bitcoin đang bảo trì 🐧";
    } finally {
        isTyping = false; sendBtn.disabled = false;
        stopBtn.style.display = 'none';
    }
}

async function typeText(el, txt) {
    let i = 0;
    return new Promise((resolve) => {
        function typing() {
            if (i < txt.length && !abortTyping) {
                i++;
                el.innerHTML = marked.parse(txt.substring(0, i));
                Prism.highlightAllUnder(el);
                chatWindow.scrollTop = chatWindow.scrollHeight;
                setTimeout(typing, 10); 
            } else { 
                if(abortTyping) el.innerHTML = marked.parse(txt.substring(0, i) + " [Đã dừng]");
                resolve(); 
            }
        }
        typing();
    });
}

function renderMessage(t, c, id, mk, img) {
    const w = document.getElementById('welcome-screen'); 
    if(w) w.remove();

    const d = document.createElement('div'); 
    d.className = `message ${c}`; 
    if(id) d.id = id;

    if(img) { 
        const container = document.createElement('div');
        container.className = 'img-container';
        
        const i = document.createElement('img'); 
        i.src = img; 
        i.className = 'img-msg'; 
        
        const dlBtn = document.createElement('button');
        dlBtn.className = 'download-btn';
        dlBtn.innerHTML = '<i class="fa-solid fa-download"></i>';
        dlBtn.onclick = () => downloadImage(img);
        
        container.appendChild(i);
        container.appendChild(dlBtn);
        d.appendChild(container); 
    }

    if(t) { 
        const s = document.createElement('span'); 
        s.innerHTML = mk ? marked.parse(t) : t; 
        d.appendChild(s); 
    }

    chatWindow.appendChild(d);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    if(mk) Prism.highlightAllUnder(d);
}

async function initSuggestions() {
    const container = document.getElementById('suggestion-container');
    if (!container) return;
    container.innerHTML = '';
    const shuffled = [...questionBank].sort(() => 0.5 - Math.random());
    for (const item of shuffled.slice(0, 3)) {
        const chip = document.createElement('div');
        chip.className = 'suggestion-chip';
        chip.innerText = await translate(item.category);
        chip.onclick = async () => {
            const q = item.questions[Math.floor(Math.random() * item.questions.length)];
            userInput.value = await translate(q);
            sendMessage();
        };
        container.appendChild(chip);
    }
}

window.onload = async () => {
    const urlParams = new URLSearchParams(window.location.search);
    const shareId = urlParams.get('shareId');

    // Chế độ xem ShareId (GitHub Gist)
    if (shareId) {
        document.getElementById('welcome-screen')?.remove();
        Toastify({ text: "Đang tải dữ liệu từ GitHub vệ tinh... 🛰️", duration: 3000 }).showToast();
        try {
            const res = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'get_share', shareId: shareId })
            });
            const result = await res.json();
            if (!result.success) throw new Error("Gist không tồn tại");

            result.data.history.forEach(m => {
                const txt = m.parts.find(p => p.text)?.text || "";
                const imgPart = m.parts.find(p => p.inline_data);
                const imgSrc = imgPart ? `data:${imgPart.inline_data.mime_type};base64,${imgPart.inline_data.data}` : null;
                renderMessage(txt, m.role === 'user' ? 'user-message' : 'bot-message', null, true, imgSrc);
            });
        } catch (e) {
            renderMessage("❌ Lỗi: " + e.message, 'bot-message', null, true);
        }
    } else {
        if (chatHistory.length > 0) {
            chatHistory.forEach(m => {
                const txt = m.parts.find(p => p.text)?.text || "";
                renderMessage(txt, m.role === 'user' ? 'user-message' : 'bot-message', null, true);
            });
        } else { initSuggestions(); }
    }

    document.getElementById('welcome-title').innerText = await translate('Chào bạn!');
    document.getElementById('welcome-desc').innerText = await translate("Tôi là Abc's Noob. Hỏi tôi về Code, Minecraft hoặc Bitcoin nhé!");
    document.getElementById('btn-refresh-text').innerText = await translate('Đổi gợi ý khác');
    document.getElementById('user-input').placeholder = await translate('Hỏi gì đi ông anh...');
    setTimeout(() => document.getElementById('iframe-loader')?.remove(), 600);
};

userInput.addEventListener('keypress', e => {
    if(e.key === 'Enter') sendMessage();
});
</script>
</body>
</html>
