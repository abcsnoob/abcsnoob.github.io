<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Noob AI - Full D1 System</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">

    <style>
        :root {
            --primary: #007bff; --bg: #171717; --text: #ececec; --msg-bot: #212121;
            --border: #333333; --header-bg: #000000; --header-text: #ffffff;
            --input-bg: #212121; --icon-color: #b4b4b4;
        }

        body, html { margin: 0; padding: 0; height: 100dvh; width: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, sans-serif; overflow: hidden; }
        .app-wrapper { display: flex; flex-direction: column; height: 100%; max-width: 900px; margin: 0 auto; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }

        .app-header { padding: 12px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--header-bg); color: var(--header-text); }
        .header-tools { display: flex; gap: 20px; align-items: center; }
        .header-tools i { cursor: pointer; font-size: 1.1rem; color: rgba(255, 255, 255, 0.7); transition: 0.2s; }
        .header-tools i:hover { color: #00d2ff; text-shadow: 0 0 8px rgba(0,210,255,0.5); }

        #chat-window { flex: 1; overflow-y: auto; padding: 20px 15px; display: flex; flex-direction: column; gap: 24px; -webkit-overflow-scrolling: touch; }
        .msg-row { display: flex; width: 100%; }
        .user-row { justify-content: flex-end; }
        .msg-bubble { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 16px; line-height: 1.5; position: relative; }
        .user-bubble { background: var(--primary); color: white; border-bottom-right-radius: 4px; }
        .bot-bubble { background: var(--msg-bot); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

        pre { position: relative; background: #0d0d0d !important; border-radius: 10px !important; padding: 15px !important; margin: 15px 0 !important; }
        .copy-btn { position: absolute; top: 8px; right: 8px; padding: 4px 10px; font-size: 11px; background: #333; color: #fff; border: 1px solid #444; border-radius: 5px; cursor: pointer; }

        .app-footer { padding: 15px; background: var(--bg); border-top: 1px solid var(--border); }
        .input-box { background: var(--input-bg); border: 1.5px solid var(--border); border-radius: 24px; padding: 8px 16px; display: flex; align-items: flex-end; gap: 10px; }
        #user-input { flex: 1; border: none; background: transparent; color: var(--text); outline: none; padding: 8px 0; max-height: 150px; resize: none; }
        
        .img-strip { display: none; position: relative; width: 65px; height: 65px; margin-bottom: 10px; margin-left: 10px; }
        .img-strip img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; border: 1px solid var(--primary); }
        .img-del { position: absolute; top: -8px; right: -8px; background: #ff4d4d; color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <header class="app-header">
        <div class="fw-bold fs-5"><i class="fa-solid fa-wand-sparkles me-2"></i>Noob AI Pro</div>
        <div class="header-tools">
            <i class="fa-solid fa-user-circle" id="auth-btn" onclick="authUI()" title="Tài khoản"></i>
            <i class="fa-solid fa-users" onclick="groupUI()" title="Nhóm Chat"></i>
            <i class="fa-solid fa-cloud-arrow-down" onclick="importShare()" title="Nhập ID"></i>
            <i class="fa-solid fa-share-nodes" onclick="shareUI()" title="Chia sẻ"></i>
            <i class="fa-solid fa-trash-can" onclick="clearChat()" title="Xóa lịch sử"></i>
        </div>
    </header>

    <main id="chat-window"></main>

    <footer class="app-footer">
        <div class="img-strip" id="p-strip">
            <img id="p-img" src="">
            <div class="img-del" onclick="cancelImg()">×</div>
        </div>
        <div class="input-box">
            <button class="icon-btn border-0 bg-transparent text-secondary" onclick="document.getElementById('file-in').click()">
                <i class="fa-solid fa-circle-plus fs-4"></i>
            </button>
            <input type="file" id="file-in" hidden accept="image/*" onchange="handleFile(this)">
            <textarea id="user-input" rows="1" placeholder="Hỏi gì đó..."></textarea>
            <button class="btn btn-primary btn-sm rounded-circle p-2" id="send-btn" onclick="send()">
                <i class="fa-solid fa-arrow-up"></i>
            </button>
        </div>
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    const WORKER_URL = 'https://abcsnoobai.abcsnoob.workers.dev';
    let token = localStorage.getItem('token');
    let chatHistory = JSON.parse(localStorage.getItem('abc_chat_pro')) || [];
    let selectedImageData = null, isTyping = false;

    // --- XỬ LÝ ẢNH ---
    function handleFile(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            selectedImageData = e.target.result;
            document.getElementById('p-strip').style.display = 'block';
            document.getElementById('p-img').src = selectedImageData;
        };
        reader.readAsDataURL(file);
    }
    function cancelImg() { selectedImageData = null; document.getElementById('p-strip').style.display = 'none'; }

    // --- UI RENDER ---
    function renderMessage(text, role, id = null, imgSrc = null) {
        const container = document.createElement('div');
        container.className = role === 'user' ? 'msg-row user-row' : 'msg-row';
        const content = document.createElement('div');
        content.className = role === 'user' ? 'msg-bubble user-bubble' : 'msg-bubble bot-bubble';
        if (id) content.id = id;

        if (imgSrc) {
            content.innerHTML += `<img src="${imgSrc}" style="max-width:100%; border-radius:10px; display:block; margin-bottom:10px;">`;
        }
        const textSpan = document.createElement('div');
        textSpan.innerHTML = marked.parse(text || "");
        content.appendChild(textSpan);
        container.appendChild(content);
        document.getElementById('chat-window').appendChild(container);
        document.getElementById('chat-window').scrollTop = document.getElementById('chat-window').scrollHeight;
        Prism.highlightAllUnder(content);
    }

    // --- CHAT LOGIC ---
    async function send() {
        const text = document.getElementById('user-input').value.trim();
        if ((!text && !selectedImageData) || isTyping) return;

        const currentImg = selectedImageData;
        renderMessage(text, 'user', null, currentImg);
        
        let entry = { role: "user", parts: [{ text: text || "Học ảnh này" }] };
        if (currentImg) {
            entry.parts.push({ inline_data: { mime_type: "image/jpeg", data: currentImg.split(',')[1] } });
        }
        chatHistory.push(entry);
        document.getElementById('user-input').value = '';
        cancelImg();

        isTyping = true;
        const botId = 'bot-' + Date.now();
        renderMessage('...', 'model', botId);
        const botEl = document.getElementById(botId).lastChild;

        try {
            const res = await fetch(WORKER_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'chat_ai', messages: chatHistory.slice(-10) })
            });
            const data = await res.json();
            
            // Hiệu ứng gõ chữ
            let i = 0; botEl.innerHTML = '';
            function type() {
                if (i < data.text.length) {
                    i += 10;
                    botEl.innerHTML = marked.parse(data.text.substring(0, i));
                    document.getElementById('chat-window').scrollTop = document.getElementById('chat-window').scrollHeight;
                    setTimeout(type, 1);
                } else {
                    chatHistory.push({ role: "model", parts: [{ text: data.text }] });
                    localStorage.setItem('abc_chat_pro', JSON.stringify(chatHistory.slice(-20)));
                    isTyping = false;
                }
            }
            type();
        } catch (e) { botEl.innerText = "Lỗi server!"; isTyping = false; }
    }

    // --- AUTH & GROUP & SHARE (Dùng D1) ---
    async function authUI() {
        if (token) {
            const { isConfirmed } = await Swal.fire({ title: 'Đăng xuất?', text: atob(token), showCancelButton: true });
            if (isConfirmed) { localStorage.removeItem('token'); location.reload(); }
            return;
        }
        const { value: form } = await Swal.fire({
            title: 'Tài khoản',
            html: '<input id="em" class="swal2-input" placeholder="Email"><input id="pw" type="password" class="swal2-input" placeholder="Mật khẩu">',
            showDenyButton: true, confirmButtonText: 'Login', denyButtonText: 'Register'
        });
        if (!form) return;
        const action = Swal.getConfirmedButton() === document.activeElement ? 'login' : 'register';
        const res = await fetch(WORKER_URL, { method: 'POST', body: JSON.stringify({ action, email: document.getElementById('em').value, password: document.getElementById('pw').value }) });
        const d = await res.json();
        if (d.success && action === 'login') { localStorage.setItem('token', d.token); location.reload(); }
        else Swal.fire(d.success ? 'Xong!' : 'Lỗi', d.error || '', d.success ? 'success' : 'error');
    }

    async function groupUI() {
        if (!token) return authUI();
        const { value: mode } = await Swal.fire({ title: 'Nhóm Chat', showDenyButton: true, confirmButtonText: 'Vào nhóm', denyButtonText: 'Tạo nhóm' });
        if (mode === undefined) return;
        const action = mode ? 'join_group' : 'create_group';
        const inputTitle = mode ? 'Nhập mã nhóm' : 'Tên nhóm mới';
        const { value: val } = await Swal.fire({ title: inputTitle, input: 'text' });
        if (!val) return;

        const body = { action, token };
        if (mode) body.groupId = val; else body.groupName = val;

        const res = await fetch(WORKER_URL, { method: 'POST', body: JSON.stringify(body) });
        const d = await res.json();
        if (d.success) Swal.fire('Thành công', d.groupId ? `Mã nhóm: ${d.groupId}` : `Đã vào nhóm: ${d.message}`, 'success');
    }

    async function shareUI() {
        if (!token) return authUI();
        const res = await fetch(WORKER_URL, { method: 'POST', body: JSON.stringify({ action: 'share', token, data: chatHistory }) });
        const d = await res.json();
        if (d.shareId) { navigator.clipboard.writeText(d.shareId); Swal.fire('Đã chép mã ID', d.shareId, 'success'); }
    }

    async function importShare() {
        const { value: id } = await Swal.fire({ title: 'Nhập ID Share', input: 'text' });
        if (!id) return;
        const res = await fetch(WORKER_URL, { method: 'POST', body: JSON.stringify({ action: 'get_share', shareId: id }) });
        const d = await res.json();
        if (d.success) { chatHistory = d.data; localStorage.setItem('abc_chat_pro', JSON.stringify(d.data)); location.reload(); }
    }

    function clearChat() { localStorage.removeItem('abc_chat_pro'); location.reload(); }

    window.onload = () => {
        chatHistory.forEach(m => {
            const txt = m.parts.find(p => p.text)?.text;
            const img = m.parts.find(p => p.inline_data)?.inline_data.data;
            renderMessage(txt, m.role, null, img ? `data:image/jpeg;base64,${img}` : null);
        });
    };
    document.getElementById('user-input').onkeydown = e => e.key === 'Enter' && !e.shiftKey && (e.preventDefault(), send());
</script>
</body>
</html>
